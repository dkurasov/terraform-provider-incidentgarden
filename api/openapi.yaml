              type: array
              description: |
                One entry per device the test was sent to. Always present and
                never empty: an empty target set is a `422`, not a `200` with
                nothing inside.
              items:
                $ref: '#/components/schemas/PushChannelTestResult'

    UsageEntry:
      type: object
      description: |
        Per-resource usage and configured cap. `limit: 0` means the operator
        has disabled the quota (matches `quotas.Check` "limit<=0 → unlimited"
        semantics) — UIs should treat it as "no cap" and skip the progress
        bar to avoid implying a 0-budget.
      required: [used, limit]
      properties:
        used:
          type: integer
          minimum: 0
          description: Current resource count.
        limit:
          type: integer
          minimum: 0
          description: |
            Configured cap. `0` denotes unlimited (operator disabled the
            quota). Otherwise the backend rejects the next mutation with
            `403 quota_exceeded` once `used >= limit`.

    AccountUsage:
      type: object
      description: |
        Quota usage that belongs to the ACCOUNT and needs no organization to
        be computed. Returned by `GET /api/v1/me/usage`.

        Everything that needed an organization id on the input moved to
        `MemberUsage` / `OrgUsage` in cross-089. Notification channels moved
        to `OrgUsage` earlier (cross-038) — they are per-(user, org).
      required: [organizations, trial_credits]
      properties:
        organizations:
          allOf:
            - $ref: '#/components/schemas/UsageEntry'
          description: |
            Cross-org anti-multiplication cap: how many organizations this
            person may own at once. Meaningful at `used: 0` — a person with
            zero organizations is a normal state (cross-076).
        trial_credits:
          type: integer
          description: |
            Number of trial activations the user still has (`users.trial_credits`,
            cross-058). Each `POST /orgs/{slug}/activate-trial` spends one. The
            billing UI shows "Start trial (N)" while this is > 0 and the org in
            view is on Free. Account-scoped (follows the person across orgs),
            so it lives here rather than on the org-scoped PlanInfo.

    MemberUsage:
      type: object
      description: |
        The caller's own quota usage INSIDE one organization — the half of the
        former `UserUsage` that was never account-scoped: both fields are
        computed from (user id, org id) and differ between organizations
        (cross-033, split out by cross-089).
      required: [voice_calls_daily, phone_channels]
      properties:
        voice_calls_daily:
          allOf:
            - $ref: '#/components/schemas/UsageEntry'
          description: This member's voice call count today in this org (resets daily).
        phone_channels:
          allOf:
            - $ref: '#/components/schemas/UsageEntry'
          description: This member's verified sip-channel count in this org.

    OrgUsage:
      type: object
      description: |
        Quota usage scoped to the organization at `{slug}`. Per-team and
        per-integration nested quotas (schedules, rotations, integration
        policies) are reported on their respective entity pages instead of
        in this aggregated payload to keep the response O(1) regardless of
        team / integration count.

        `notification_channels` is per-(user, org) since cross-038 — the
        value reported is the current user's channel count in this org.
      required:
        - integrations
        - silences
        - members
        - pending_invites
        - teams
        - escalation_policies
        - notification_channels
        - voice_calls_monthly
        - voice_thresholds_crossed
        - current_members
        - paid_seats
        - seat_price
        - est_next_amount
        - next_renewal_date
      properties:
        integrations:
          $ref: '#/components/schemas/UsageEntry'
        silences:
          $ref: '#/components/schemas/UsageEntry'
        members:
          $ref: '#/components/schemas/UsageEntry'
        pending_invites:
          $ref: '#/components/schemas/UsageEntry'
        teams:
          $ref: '#/components/schemas/UsageEntry'
        escalation_policies:
          $ref: '#/components/schemas/UsageEntry'
        notification_channels:
          $ref: '#/components/schemas/UsageEntry'
        voice_calls_monthly:
          allOf:
            - $ref: '#/components/schemas/UsageEntry'
          description: |
            Org-wide voice calls this billing month (cross-033).
            `used` is counted (post-dispatch counter), not billed —
            may undercount vs the real bill on post-tx failure.
        voice_thresholds_crossed:
          type: array
          items:
            type: integer
          description: |
            Percent thresholds crossed this billing month, sorted asc,
            e.g. [], [80], [80,100]; UI drives banner directly.
        current_members:
          type: integer
          minimum: 0
          description: |
            Per-seat billing (cross-059): current member count = all
            `org_members` rows (incl. owner + deactivated), i.e. the seats the
            org would be billed for on the next renewal. Always present.
        paid_seats:
          type: ['integer', 'null']
          description: |
            Per-seat billing (cross-059): the seat ceiling the last payment
            covered (`subscriptions.paid_seats`). `null` on Free/Trial (no paid
            Pro period) — the per-seat gate is asleep. When set, adding a member
            is refused once `current_members >= paid_seats`.
        seat_price:
          type: ['integer', 'null']
          description: |
            Per-seat billing (cross-059): price of one seat per month in RUB
            (`plans.price_monthly_rub`, re-interpreted per-seat). `null` on
            Free/Trial (free).
        est_next_amount:
          type: ['integer', 'null']
          description: |
            Per-seat billing (cross-059): estimated next charge =
            `current_members × seat_price`, computed on the fly. `null` when
            `seat_price` is `null` (no priced plan).
        next_renewal_date:
          type: ['string', 'null']
          format: date-time
          description: |
            Per-seat billing (cross-059): the subscription paid-until date
            (`subscriptions.expires_at`). `null` on Free/Trial (perpetual on
            beta) or any subscription without an expiry.

