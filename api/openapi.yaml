    # --- Response wrappers ---------------------------------------------------
    AuthResponse:
      type: object
      description: |
        Envelope of the auth flows that mint a session: login, register,
        initial-password-change and refresh. These endpoints additionally set
        three cookies on the response:
          - `refresh_token` — HttpOnly, SameSite=Lax, scoped to
            `/api/v1/auth`. Carries the rotating refresh credential.
          - `csrf_token` — NOT HttpOnly (frontend reads via
            `document.cookie`), SameSite=Lax, path `/`. 64 hex chars,
            cryptographically random. The frontend must echo this value
            in the `X-CSRF-Token` header on every authenticated mutation;
            the server validates header == cookie via constant-time
            compare. See `CSRFInvalid` response for the failure shape.
          - `has_session` — the session marker. NOT HttpOnly, SameSite=Lax,
            path `/`, constant value `1`, same Max-Age as the two above.
            It is neither a credential nor an identity: presenting it proves
            nothing, and no endpoint reads it. Its only job is to let the
            frontend answer "is there a session?" before any JavaScript runs
            — a server-rendered redirect decision, which is why it must be
            path `/` and readable, unlike `refresh_token`.

            THE CLIENT NEVER WRITES IT. The marker is set and erased by the
            same server code, with the same attributes and the same lifetime
            as the refresh cookie it mirrors; a client that writes it on its
            own is asserting a session state the server never confirmed, and
            a client that erases it on a network error or a 5xx throws away
            a live session on evidence that proves nothing about it.
        WHEN THE THREE COOKIES CHANGE, exhaustively:
          - they are SET by a response that mints a token pair — normally a
            success, and see the asymmetry below for the one error case;
          - they are ERASED (MaxAge=-1) only by a successful `/auth/logout` or
            `/auth/logout-all`;
          - no unsuccessful response ERASES them — not a 400, not a 401, not a
            409, not a 429, not a 5xx.

        The last rule is the one worth stating outright, because the obvious
        reading of a 401 is "the session is over, erase everything". A response
        speaks about the token that was PRESENTED, while the cookie jar it
        arrives in may already hold a newer one installed by a request that
        overtook it — two browser tabs share a single cookie, so this is the
        ordinary case. HTTP offers no conditional delete, so erasing on failure
        is a bet that nothing updated the jar in the meantime.

        The rule governs ERASING, not writing, and the asymmetry is deliberate.
        Erasing can destroy a credential that belongs to another request;
        writing our own freshly minted cookies cannot, because they are only
        ever written after the rotation has committed — and only one request
        can commit it. So a rare `500` on `/auth/refresh` may still carry a new
        `refresh_token` and `has_session`: the rotation happened, and the
        client must be told, or it would be left holding a token the server has
        already retired. A client must therefore accept cookies from an error
        response and simply retry.

        Consequence a client must handle: after a session ends any way other
        than logout, the cookies — including `has_session` — survive until
        their Max-Age expires. The marker will claim a session that is gone.
        Treat it as "worth trying", never as proof; the authoritative answer is
        the next API response.

        cross-089: a session belongs to the PERSON and is bound to no
        organization. There is no `organization` field and no
        `organization_blocked` flag any more — an organization is chosen by
        navigating to `/api/v1/orgs/{slug}/…`, and `memberships` is the whole
        answer to "where can I go".

        Landing rule for clients: zero memberships → onboarding; exactly one
        active membership → straight to its dashboard; anything else → the
        organization picker, with `org_status: blocked` entries greyed out.
      required: [data]
      properties:
        data:
          type: object
          required: [user, memberships, tokens]
          properties:
            user:
              $ref: '#/components/schemas/User'
            memberships:
              type: array
              description: |
                Every organization the caller belongs to, always present:
                an empty array when they belong to none (a normal state since
                cross-076), one element when they belong to one. Required on
                purpose — the whole landing decision hangs on this list, and
                an optional field would make that decision depend on how many
                organizations the person happens to have.
              items:
                $ref: '#/components/schemas/OrgMembership'
            tokens:
              $ref: '#/components/schemas/TokenPair'

    AccessTokenResponse:
      type: object
      description: |
        **No operation returns this any more.** It was the answer of the
        deprecated `POST /api/v1/auth/switch-org` while that endpoint still
        re-minted a bare access token; that endpoint now answers `410` and
        issues nothing. The schema is kept rather than removed because deleting
        a shipped component is a destructive contract change — do not read its
        presence as a surface that still exists.
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, expires_in]
          properties:
            access_token:
              type: string
            expires_in:
              type: integer
              description: Access token TTL in seconds

    OrgMembershipsListResponse:
      type: object
