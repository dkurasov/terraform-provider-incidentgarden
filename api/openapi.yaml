        length:
          type: integer
          minimum: 1
          maximum: 365
          default: 1
          description: >
            Number of buckets (hours / days / weeks, per `type`) one shift lasts.
            The ceiling judges the value SENT, on every path that takes a whole
            rotation body — create, update and preview alike.
        start_date:
          type: string
          format: date-time
          description: >
            Anchor the rotation is counted from. Must fall within calendar years
            2020-2099; outside that range the server answers 400. JSON Schema has
            no minimum/maximum for a date-time string, so the range lives in this
            sentence and in the server, not in a keyword.
        end_date:
          type: ['string', 'null']
          format: date-time
          description: >
            Optional end of the rotation, exclusive. When present it must be
            after start_date and, like it, within calendar years 2020-2099.
        time_restriction:
          $ref: '#/components/schemas/TimeRestriction'
        participants:
          type: array
          minItems: 1
          maxItems: 50
          description: >
            Positions of the rotation circle, in order — the index of an entry
            IS its position. The ceiling judges the array SENT, on create,
            update and preview alike.


            Each `participant_type` fixes which reference the entry must carry,
            and the rule is EXCLUSIVE — the reference a type demands is also the
            only one it may carry: `user` requires `user_id` and no `team_id`,
            `team` requires `team_id` and no `user_id`, and `none` — the
            deliberate hole in the circle, the beat on which nobody is paged —
            requires NEITHER. All three are enforced on write, on create, update
            and preview alike; a reference that does not belong to the type is
            rejected with 400.
          items:
            type: object
            required: [participant_type]
            properties:
              participant_type:
                $ref: '#/components/schemas/ParticipantType'
              user_id:
                type: string
                format: uuid
              team_id:
                type: string
                format: uuid

    UpdateRotationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/RotationType'
        length:
          type: integer
          minimum: 1
          maximum: 365
          description: >
            See CreateRotationRequest.length. Like the calendar bounds, the
            ceiling judges the value SENT: a stored row that exceeds it (only
            reachable through a direct API client predating the ceiling) stays
            editable as long as the patch does not resend the offending field.
        start_date:
          type: string
          format: date-time
          description: >
            Anchor the rotation is counted from. Must fall within calendar years
            2020-2099 (see CreateRotationRequest.start_date). Only the dates
            actually sent are bounds-checked, so a row stored outside that range
            before the rule existed stays editable.
        end_date:
          type: ['string', 'null']
          format: date-time
          description: >
            Optional end of the rotation, exclusive; null clears it. A supplied
            value must be after the effective start_date and within calendar
            years 2020-2099.
        time_restriction:
          $ref: '#/components/schemas/TimeRestriction'
        participants:
          type: array
          minItems: 1
          maxItems: 50
          description: >
            See CreateRotationRequest.participants. Replaces the whole circle
            when present; the ceiling judges the array SENT.
          items:
            type: object
            required: [participant_type]
            properties:
              participant_type:
                $ref: '#/components/schemas/ParticipantType'
              user_id:
                type: string
                format: uuid
              team_id:
                type: string
                format: uuid

