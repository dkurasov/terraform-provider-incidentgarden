openapi: 3.1.0
info:
  title: Incident Garden API
  description: |
    API for incident management, on-call duty and escalations.

    ## Authentication
    JWT Bearer token in the `Authorization: Bearer <token>` header.
    Access token — 15 minutes, refresh token — 6 hours.
    A token says WHO the caller is and nothing else: it carries no
    organization, and neither does the session (cross-089).

    ## Addressing an organization
    The organization is part of the address, and only of the address. Three
    forms, told apart by the URL alone:
    - `/api/v1/me/<X>` — the person, no organization involved (profile,
      password, devices, push readiness, the list of memberships).
    - `/api/v1/orgs/{slug}/me/<X>` — the person INSIDE that organization
      (notification channels and rules, my teams, my quota usage).
    - `/api/v1/orgs/{slug}/<X>` — the organization's own resources (alerts,
      teams, schedules, integrations, policies, silences, members, reports).

    This rule is normative for new endpoints. The `{slug}` segment is resolved
    on every request, so removing a membership or lowering a role takes effect
    immediately rather than at the next token refresh; the failure modes are
    documented on the `OrgSlug` parameter. One session can work in several
    organizations at once — different browser tabs, different addresses, no
    switching call and no "active organization" stored anywhere.

    ## CSRF protection
    Every authenticated mutation (POST / PUT / PATCH / DELETE on routes behind
    `AuthMiddleware`) is guarded by a double-submit-cookie check:
    - Auth flows that mint a session (login, register, refresh,
      initial-password-change) set the `csrf_token` cookie (NOT HttpOnly,
      SameSite=Lax, 64 hex chars). Creating an organization and accepting an
      invite no longer issue tokens or cookies (cross-089) — they run on the
      session the caller already has.
    - The frontend reads the value via `document.cookie` and sends it in the
      `X-CSRF-Token` header on every mutation.
    - The backend compares cookie ↔ header with a constant-time compare.
      Mismatch / missing → `403 CSRFInvalid` with `error.code = "csrf_invalid"`.
    - Safe methods (GET / HEAD / OPTIONS) are not checked.
    - Public unauthenticated endpoints (login, register, refresh) and webhook
      ingestion (`POST /integrations/{apiKey}/alerts`, authenticated by the API
      key in the URL) are not checked — the cookie is not active yet / any more.
    - Logout / logout-all clear the `csrf_token` cookie (MaxAge=-1). They are
      the only thing that clears it: no unsuccessful response of any endpoint
      erases cookie state (writing freshly minted cookies is a separate matter
      — see `AuthResponse`).
    - A third cookie, `has_session`, travels with the same code, the same
      attributes and the same lifetime as `csrf_token`, but it is NOT part of
      the CSRF check and carries no credential and no identity — its value is
      the constant `1`. It exists so a browser can answer "is there a session?"
      before any JavaScript runs. It is written and erased by the server only:
      a client that writes it is inventing an answer the server did not give.
      See `AuthResponse` for the full cookie contract.

    ## Authorization levels
    3 org-level roles: `org_owner`, `org_admin`, `org_member`.
    2 team-level roles: `team_admin`, `team_member`.

    Route groups (all of them under `/api/v1/orgs/{slug}`):
    - **Protected** (all roles): notification channels/rules, org leave,
      teams, schedules, escalation, integrations, alerting.
      `org_member` = team-scoped alert write access.
    - **Admin** (org_admin / org_owner): membership management (role, position,
      removal), invites list + CRUD, config management

    A refusal by role returns `403` with NO `error.code`. A refusal meaning
    the caller has lost access to the organization itself returns `403` WITH
    `error.code` (`organization_not_member` / `organization_blocked`). The
    absence of the code is what tells the two apart — see `ForbiddenError`.

    ## Response format
    Success: `{"data": ...}`
    Errors: `{"error": {"message": "...", "details": [...]}}`

    ## Pagination
    Query parameters `?limit=N&offset=N`.
    Response: `{"data": {"items": [...], "total": N, "limit": N, "offset": N}}`
  version: 0.1.0
  contact:
    name: Incident Garden

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: infrastructure
    description: Health checks, readiness, version
  - name: auth
    description: Authentication and session management
  - name: organization
    description: |
      One organization, addressed by `{slug}`: its data, its settings, joining
      and leaving it. "Current" is not a server-side concept since cross-089 —
      the organization is whichever one the URL names.
  - name: users
    description: |
      The caller's own account: profile, password, quota usage. Scoped to the
      ACCOUNT, not to a membership — an organization manages membership, not
      the account itself (cross-075).
  - name: members
    description: |
      People inside one organization — the membership list and a single
      member's role and position. Deliberately separate from `users`: a member
      is an account PLUS an `org_role` and a `position_id` in this specific
      organization, and the same account is a member of several organizations
      with different roles (cross-089).
  - name: positions
    description: Position reference data
  - name: invites
    description: Organization invite management
  - name: teams
    description: Teams and team members
  - name: schedules
    description: On-call schedules, rotations, overrides
  - name: escalation-policies
    description: Escalation policies and steps
  - name: integrations
    description: Alert integration management
  - name: alert-ingestion
    description: Public alert ingestion endpoints (API key auth)
  - name: alerts
    description: Alert lifecycle management
  - name: silences
    description: Silence and maintenance window management
  - name: notification-channels
    description: User notification channels
  - name: notification-rules
    description: User notification rules
  - name: mobile-installations
    description: |
      The caller's mobile devices and their push delivery addresses. Scoped to
      the ACCOUNT, not to an organization: a phone belongs to the person, and an
      organization manages membership, not the account. These endpoints
      therefore require no organization context.
  - name: reports
    description: Read-only analytics reports
  - name: legal
    description: Legal documents (public access)

# =============================================================================
# Paths
# =============================================================================
paths:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  /healthz:
    get:
      tags: [infrastructure]
      summary: Liveness probe
      operationId: healthz
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [infrastructure]
      summary: Readiness probe
      operationId: readyz
      security: []
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: ok
        '503':
          description: Not ready

  /version:
    get:
      tags: [infrastructure]
      summary: Application version
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  commit:
                    type: string
                  build_time:
                    type: string

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register new user (identity only)
      description: |
        Creates a new user without organization. This is the only endpoint that
        creates a platform account (cross-076): accepting an invite grants
        membership, never an account.

        A verification email (24h TTL) is sent after the account is created. A
        configured SMTP service is therefore a precondition — when it is not
        configured the request is rejected with 503. Returns JWT tokens; a session
        is never bound to an organization (cross-089), and the caller may well
        belong to none — `memberships` comes back as an empty array.

        Legal acceptances are enforced at registration time: every document
        with `requires_acceptance=true AND is_active=true` AND a published
        active version must be covered by `accepted_versions`. Validation
        runs inside the user-creation transaction — a failure rolls back the
        new user row.

        When the `auth.allow_self_signup` system setting is `false`, returns 403.
        Use `GET /api/v1/auth/signup-status` to probe availability before rendering the form.

        ## Registering with an invite (cross-076)
        An invited person registers through this endpoint with the optional
        `invite_token` copied from the invite link. A valid token is a
        privileged mode with exactly two effects:
        - it bypasses the `auth.allow_self_signup` flag (the person is not a
          stranger — an organization vouched for them);
        - it marks the address as verified immediately and skips the
          verification email entirely, so registration does not depend on a
          live SMTP service. The token was delivered to that very address, so
          ownership is already proven.

        A token never bypasses the platform email blacklist.

        The token is validated as a gate, not as a field: an unknown, non-pending
        or expired token, an email that differs from the invite's address, or a
        blocked inviting organization all REJECT the registration — the request
        is never silently downgraded to a plain self-signup. Failures carry a
        machine-readable `error.code` (see `InviteRegistrationError`) so the
        client can offer "register without the invitation" (a plain retry of the
        same form with `invite_token` omitted, which then goes through all the
        normal rules). There is no separate code for an email mismatch — it is
        reported as `invite_invalid`, otherwise this public endpoint would become
        an oracle for the invited address.

        Registration only creates the account. Joining the organization is a
        second, authenticated call to `POST /api/v1/auth/accept-invite`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: |
            Validation error, missing required legal-document acceptance
            (`error.code = "legal_acceptance_required"`, with the pending
            list under `error.details.pending`), stale legal-document
            version label (`error.code = "stale_version"`, no `details`),
            an unusable `invite_token` (`error.code = "invite_invalid"` —
            unknown / non-pending token or an email that does not match the
            invite), or a blacklisted email address (generic
            `message = "registration failed"`, deliberately WITHOUT a code so
            the response never confirms the ban).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorBody'
                  - $ref: '#/components/schemas/LegalAcceptanceRequiredError'
                  - $ref: '#/components/schemas/StaleVersionError'
                  - $ref: '#/components/schemas/InviteRegistrationError'
                  - $ref: '#/components/schemas/Error'
        '403':
          description: |
            Either public self-signup is disabled and no `invite_token` was
            supplied (generic `Error`, `message = "registration is disabled"`),
            or the organization that issued the supplied invite has been blocked
            by a platform admin (`error.code = "invite_org_blocked"`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/InviteRegistrationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '410':
          description: |
            The supplied `invite_token` has expired
            (`error.code = "invite_expired"`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteRegistrationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '502':
          description: |
            The verification email could not be delivered (SMTP is configured
            — an unconfigured service is rejected with 503 before any work —
            but the send attempt failed). The email is sent after the
            user-creation transaction commits, so the freshly created user is
            rolled back and the registration takes no effect; the same request
            may be retried. Not reachable on the `invite_token` branch — it
            sends no email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The email service is not configured, so the verification email
            cannot be sent. Not reachable on the `invite_token` branch — it
            sends no email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/signup-status:
    get:
      tags: [auth]
      summary: Check if public self-signup is allowed
      description: |
        Public probe for the `auth.allow_self_signup` system setting.
        Fail-closed: a missing key (fresh install, test truncation), an
        unreadable setting, or any value that is not `"true"` compared
        case-insensitively (`"true"`, `"TRUE"` and `"True"` all enable signup)
        is reported as NOT allowed. Used by the UI to toggle the registration form
        before submission, and to decide whether "register without the
        invitation" may be offered after an `invite_token` rejection on
        `POST /api/v1/auth/register`.
      operationId: signupStatus
      security: []
      responses:
        '200':
          description: Signup availability
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [allowed]
                    properties:
                      allowed:
                        type: boolean
                        description: true when public self-signup is enabled
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      description: |
        Accepts refresh_token via JSON body or httpOnly cookie.
        Web clients use the cookie; mobile clients send the token in the body.
        A session belongs to the person and to no organization (cross-089),
        so refreshing never fails because of an organization: a blocked
        organization surfaces as a 403 on its own address, not here.

        Answers with the full `AuthResponse` — identity, memberships and
        tokens — and not a bare token pair. This is the most frequent session
        path there is (a page reload with an expired access token), and the
        client needs both halves at once: `memberships` is what answers which
        organization the slug in the address refers to and what role the
        caller holds there. A token-only answer would force a second,
        sequential request right after every refresh, in the one place
        latency is most visible. It costs nothing: before cross-089 this path
        already made two extra reads to assemble the session's organization
        context, and now it makes one.
      operationId: refreshTokens
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Optional when httpOnly cookie is present
                installation_id:
                  type: string
                  format: uuid
                  description: |
                    The mobile installation the caller presents, to earn a long
                    session. Optional, and web clients never send it.

                    A session is always issued short — on every client,
                    including this one. It becomes long only here, on a renewal,
                    and only after the server has checked the id against the
                    device registry: the installation must exist, belong to the
                    caller and not be revoked. There is deliberately no "client
                    type" field and no User-Agent heuristic: a self-description
                    is just a word, and a long lifetime would go to whoever
                    wrote the right string. Presenting a device is not stronger
                    proof of being a phone — it is proof of something more
                    useful: of being a row the owner can switch off one device
                    at a time.

                    Presenting an id that is unknown, someone else's or revoked
                    is NOT an error. The answer is an ordinary `200` carrying an
                    ordinary short session — refusing instead would turn "I
                    revoked this phone" into "this phone can no longer sign in".

                    Revoking a device ends the sessions bound to it, so a client
                    whose device was switched off elsewhere gets `401` on its
                    next renewal and signs in again.
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: |
            No refresh token was presented at all — neither in the body nor in
            the `refresh_token` cookie. Like every other unsuccessful response
            from this endpoint, it leaves all three cookies untouched. Worth
            noting why this branch is the most exposed one: the endpoint is
            public and so carries no CSRF gate, and `SameSite=Lax` withholds
            cookies from a cross-site POST — any page could otherwise auto-
            submit an empty form here and have the response erase a victim's
            session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            The presented refresh token was rejected: unknown, expired, or
            belonging to a deactivated / platform-blocked account (all
            deliberately indistinguishable from one another). Cookies are NOT
            touched — see `AuthResponse` for why a rejected token is not
            grounds to erase the jar it arrives in.

            This status means exactly "the presented token was rejected", and
            it is the ONLY response from this endpoint that licenses a client
            to conclude the session is over and show a login form. Every other
            outcome — 400, 409, 429, 5xx — means "not proven, try again".
            Nothing else may be added to this status: widening it silently
            turns that client rule into a bug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The presented refresh token was superseded by a concurrent rotation:
            another `/auth/refresh` carrying the same token committed first, so
            this one rolled back. The session is ALIVE — the winner rotated it —
            and the correct client action is simply to retry, which will pick up
            the credential the winner installed.

            Deliberately not a 401. A client ends the session on 401, and doing
            so here would sign out a person whose session was renewed a moment
            earlier. The distinction is carried by the status rather than by a
            code in the body precisely so no client needs a dictionary of body
            codes to get this right.

            Browsers reach this because all tabs share one `refresh_token`
            cookie, so two tabs waking together present the same token.

            Mobile / non-browser clients: a contract note ahead of the client
            existing. Such a client holds its own token and keeps no cookies,
            but two concurrent refresh attempts with one token are equally
            possible there — a background task and a foreground retry, say. A
            `409` means RETRY, never "the session ended"; treating it as the
            latter would log the user out of a live session.

            Cookies are not touched, as on every unsuccessful response. Note
            the limit of this answer: a loser whose token read lands after the
            winner already committed is indistinguishable from a replay of a
            long-dead token and receives `401` instead. `409` narrows the
            window, it does not close it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          description: |
            The server could not determine the session's fate — a failure to
            read the stored token, the user row, or the memberships. Explicitly
            NOT a 401, and the distinction is part of the contract: 401 means
            the token was rejected, so a client is entitled to end the session
            on it, whereas a 500 means the question went unanswered and the
            client must retry rather than sign the person out.

            ⚠ A 500 from this endpoint may still carry `Set-Cookie`. If the
            rotation committed and a later step failed, the response ships the
            new `refresh_token` and `has_session` so the client is not left
            holding a retired token. Accept the cookies, then retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Log out (invalidate refresh token)
      operationId: logout
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Optional when httpOnly cookie is present
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CSRFInvalid'

  /api/v1/auth/forgot-password:
    post:
      tags: [auth]
      summary: Request password reset
      description: Always returns 200 to prevent email enumeration.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password with token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset successful
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/accept-invite:
    post:
      tags: [auth]
      summary: Accept invite
      description: |
        Adds the authenticated caller to the organization that issued the
        invite. Authentication is mandatory (cross-076): an invite grants
        membership, never a platform account, so this endpoint no longer
        creates users. A person who does not have an account yet registers
        first via `POST /api/v1/auth/register` (optionally passing the same
        token as `invite_token`) and then calls this endpoint with the tokens
        that registration returned.

        The body carries only `token`. The caller's email must match the
        invite's address; any mismatch is reported as the same
        anti-enumeration "invite invalid or expired" 400 as an unknown token.

        Side effect (cross-076): if the caller's address is still unverified,
        accepting the invite marks it verified in the same transaction — the
        invite token was delivered to that address and has just been matched
        against it, which is a stronger proof of ownership than the
        verification email.

        The two steps are not atomic by design: if acceptance fails (invite
        revoked, organization blocked, members quota or paid seats exhausted)
        the account and the session survive and only the acceptance is retried.

        Returns the created `OrgMembership` — no tokens (cross-089). The
        session is not bound to an organization, so there is nothing to
        re-mint; the client refreshes its membership list and navigates to
        `/api/v1/orgs/{org_slug}/…`.

        The caller's account must still be active and not blocked by the
        platform: that gate survives the removal of token minting, and after
        cross-089 it is the only barrier here — resolving `{slug}` on the
        org-scoped routes reads the organization and the membership, never
        `users`. **It answers `401`, not `403`** — a hidden one, worded
        exactly like an expired token so a ban stays indistinguishable from a
        stale session (cross-061). It is therefore absent from the 403 list
        below on purpose; do not add it there.
      operationId: acceptInvite
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Invite accepted — returns the caller's new membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMembershipDataResponse'
        '400':
          description: |
            One of:
            - Validation error.
            - Invite invalid or expired (anti-enumeration response). Covers
              every leak vector that would otherwise reveal whether the
              invite's email is registered: unknown / unrecognised token,
              non-pending invite, and a mismatch between the caller's address
              and the invite's. All return `error.message = "invite invalid or
              expired"` with no further detail. Distinct lifecycle errors
              (already accepted → 409, expired → 410) only surface after a
              valid token has been resolved.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorBody'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Forbidden. Either a generic denial (`Error`: organization blocked),
            pending legal acceptances (`code="legal_acceptance_required"` —
            the endpoint sits behind the legal gate, so updated documents must
            be accepted before joining an organization), the org-members
            anti-abuse quota was hit (`code="quota_exceeded"`), or the paid-seat
            ceiling was reached on a paid Pro subscription
            (`code="paid_seats_exceeded"`, cross-059) — the org must add seats
            before accepting another member. On beta (Free/Trial) the seat case
            never occurs.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/LegalAcceptanceRequiredError'
                  - $ref: '#/components/schemas/QuotaExceededError'
                  - $ref: '#/components/schemas/PaidSeatsExceededError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '410':
          description: Invite expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Verify email address
      description: Verifies user's email with the token sent during registration.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'
        '401':
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  # ---------------------------------------------------------------------------
  # Current user
  # ---------------------------------------------------------------------------
  /api/v1/me:
    get:
      tags: [users]
      summary: Get current user
      description: |
        The caller's ACCOUNT. Carries no `org_role` and no `position_id` since
        cross-089 — those describe a membership, and this endpoint knows
        nothing about organizations. Read the role from the matching
        `OrgMembership` in `GET /api/v1/me/organizations`.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [users]
      summary: Update current user profile
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/me/organizations:
    get:
      tags: [auth]
      summary: List user's organizations
      description: |
        Every organization the caller belongs to, with the role, the position
        and the organization's status in each.

        Since cross-089 this list is the client's index of the whole
        interface: the organization picker, the role gate and the answer to
        "may I open this address at all" come from here. Re-fetch it on
        events — focus regained, entering the picker, creating or joining or
        leaving an organization, and any org-scoped `403` — never on a timer,
        and never once at login for the life of the session. A stale list
        renders permissions the person no longer has.

        Available without an organization context, including to someone who
        belongs to none (empty array, a normal state since cross-076), and
        while legal acceptances are still pending.
      operationId: listMyOrganizations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of org memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMembershipsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/me/usage:
    get:
      tags: [users]
      summary: Get the caller's account-level quota usage
      description: |
        Account-scoped cross-029 quota usage. No organization is involved and
        none is required: this endpoint answers for the person, so it is
        equally valid for someone who belongs to zero organizations
        (cross-076) — the "N of M organizations" counter is meaningful at
        zero, and clients must not gate this call on an org role.

        Everything that used to live here but is only meaningful inside one
        organization (`voice_calls_daily`, `phone_channels`, the whole
        `organization` block and `plan`) moved to
        `GET /api/v1/orgs/{slug}/me/usage` (cross-089). The old payload mixed
        the two: two of its "user" fields were already computed with an
        organization id on the input.

        `limit: 0` means the operator has explicitly disabled that quota
        (treated as unlimited by the backend, the UI should hide the resource
        rather than render a 0-cap progress bar).
      operationId: getAccountUsage
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account-scoped usage payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUsageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/orgs/{slug}/me/usage:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [users]
      summary: Get the caller's quota usage inside one organization
      description: |
        cross-029 quota usage for the caller as a member of `{slug}`, plus the
        organization-wide counters and the active plan summary.

        Split from `GET /api/v1/me/usage` in cross-089 along the line the code
        already drew — which numbers need an organization id to be computed at
        all. The `member` block is the caller's own consumption in THIS
        organization (voice calls today, verified phone channels); the
        `organization` block is org-wide; `plan` is the org's active plan.

        All org-level roles (`org_owner`, `org_admin`, `org_member`) read
        their own usage.
      operationId: getOrgScopedUsage
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Org-scoped usage payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUsageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs:
    post:
      tags: [organization]
      summary: Create organization
      description: |
        Creates a new organization. The current user becomes `org_owner`.
        Requires verified email (`email_verified_at != null`).
        Triggers default subscription creation and seeds the caller's default
        notification channel and rules for the new membership.

        Returns the created `OrgMembership` — no tokens (cross-089). The
        session is not bound to an organization, so there is nothing to
        re-mint; the client refreshes its membership list and navigates to
        `/api/v1/orgs/{org_slug}/…`.

        The caller's account must still be active and not blocked by the
        platform: that gate survives the removal of token minting, and after
        cross-089 it is the only barrier here — resolving `{slug}` on the
        org-scoped routes reads the organization and the membership, never
        `users`. **It answers `401`, not `403`** — a hidden one, worded
        exactly like an expired token so a ban stays indistinguishable from a
        stale session (cross-061). It is therefore absent from the 403 list
        below on purpose; do not add it there.
      operationId: createOrganization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created — returns the caller's new membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMembershipDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/switch-org:
    post:
      tags: [auth]
      summary: Gone — issues no credentials (deprecated)
      deprecated: true
      description: |
        **Gone. This endpoint issues no credentials, and no request makes it
        succeed.** Every call is answered `410`.

        Two facts stack here, and only the second one is new.

        Since cross-089 there has been nothing to switch: an organization is no
        longer part of the session or of the access token, it is chosen by
        addressing `/api/v1/orgs/{slug}/…`. What survived that was a narrowed
        endpoint that re-minted a bare ACCESS token for the same identity.

        That remainder is what is gone now, and the reason is the shape rather
        than the feature. A door that mints a credential on the strength of a
        presented access token, asks for no password, and is designed for
        repeated calls cannot be made safe by the freshness gate that stood in
        front of it (api-107). That gate compares the token's `iat` with the
        moment this account's credentials were invalidated, truncated to whole
        SECONDS on both sides — `iat` carries whole seconds only, and a stricter
        reading would refuse tokens this product had just issued. A token
        stamped inside the second the marker was written in therefore passes,
        and passes again on every repeat: whoever holds one renews themselves
        indefinitely, and the owner of the account cannot end it, because
        logging out everywhere, changing the password and resetting it all move
        that same marker and all lose to the renewal. The comparison cannot be
        tightened — the two sides come off different physical clocks and the
        precision does not exist — so the cure is at the minting door, and it is
        that the door stopped minting.

        The route stays mounted and this operation stays in the contract because
        removing a shipped endpoint is a destructive change, and this project
        narrows and deprecates instead of deleting.

        Observable behaviour:
          - `410` for every caller and every body, always;
          - no access token, no refresh token, no session row, no cookie
            touched — the number of sessions before and after is identical;
          - the request body is not read at all, so a body missing `org_id` is
            answered `410` and not `400`: the endpoint being gone outranks the
            body being wrong.

        Nothing calls this endpoint. Removing it is a separate decision.
      operationId: switchOrg
      security:
        - BearerAuth: []
      requestBody:
        required: false
        description: |
          Ignored in full: nothing reads it and nothing validates it. Sending no
          body at all is answered exactly like sending one.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchOrgRequest'
      responses:
        '410':
          description: |
            The only answer this endpoint produces. There is no `error.code`:
            `410` on this address has exactly one meaning, and a code would open
            a second vocabulary on the client for a reaction it already has.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Not authenticated. It comes from the auth middleware in front of the
            endpoint and never from the endpoint itself: the handler reads no
            account state whatsoever, so a deactivated, platform-blocked or
            credential-invalidated caller gets the same `410` as everybody else.
            Those account gates stood here only to protect the minting, and
            there is no minting left to protect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Also produced entirely in front of the endpoint:

              * `password change required` — the caller still has
                `must_change_password=true`; the route sits inside the
                `RequirePasswordNotExpired` group;
              * `csrf_invalid` — a mutation under `AuthMiddleware`, so the
                `X-CSRF-Token` header must echo the `csrf_token` cookie.

            Never an organization refusal: the endpoint does not look at
            `org_id`, and no longer looks at anything.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout-all:
    post:
      tags: [auth]
      summary: Log out all sessions
      description: Invalidates all refresh tokens for the current user.
      operationId: logoutAll
      security:
        - BearerAuth: []
      responses:
        '204':
          description: |
            All sessions invalidated. Clears all three session cookies, exactly
            as `/auth/logout` does.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/CSRFInvalid'

  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      summary: Resend email verification
      description: |
        Sends a new verification email. If SMTP is not configured, auto-verifies the email.
        Returns 409 if email is already verified.
      operationId: resendVerification
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/auth/initial-password-change:
    post:
      tags: [auth]
      summary: Change password on first login
      description: |
        Completes the forced password change for a user whose account has
        `must_change_password=true` (set by admin reset or initial provisioning).
        Unlike `PUT /api/v1/me/password`, this endpoint does **not** require
        `current_password` — the caller has already proven ownership by logging
        in with the temporary password.

        On success the server:
          - sets the new password and clears `must_change_password`;
          - invalidates every other refresh token for the user (the current
            session is preserved);
          - issues a fresh access/refresh token pair so the client can continue
            without an extra login round-trip.

        Returns 403 when invoked for a user whose `must_change_password` is
        already false — regular password changes must go through
        `PUT /api/v1/me/password`.
      operationId: initialPasswordChange
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialPasswordChangeRequest'
      responses:
        '200':
          description: Password changed, new session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Authentication required, or one of the two account gates in front
            of the minting refused. Both answer a hidden `401` with no
            `error.code`, deliberately indistinguishable from an expired token:

              * the presented access token is older than the moment this
                account's credentials were invalidated (api-107) — logging out
                everywhere, changing or resetting the password, and a platform
                block all move that moment forward, and every token minted
                earlier stops being accepted here. "Older" is measured to whole
                seconds on both sides, so a token minted inside the same second
                as the invalidation is still accepted: `iat` carries whole
                seconds only, and a stricter reading would refuse tokens this
                product had just issued. A token carrying no `iat` at all is
                refused here too — this endpoint has to know WHEN the presented
                token was made, and "cannot tell" reads as no, even though the
                same token still authenticates ordinary requests;
              * the account is deactivated or platform-blocked (cross-061
                anti-enumeration).

            The first gate exists because this endpoint hands back a WHOLE
            session — access and refresh — on the strength of one presented
            access token and without a `current_password`: without it a stolen
            token would mint itself a brand-new session and survive the very
            logout-all meant to end it. It runs BEFORE the
            `must_change_password` check, so a token the invalidation has
            outrun is answered `401` whether or not the flag is set — a `403`
            there would let a dead token read the account's flag, and a raised
            flag means the account is sitting on a temporary password. A `code`
            would likewise turn the endpoint into an oracle answering "this
            account changed its password recently", so there is none: `401`
            means "the presented token was rejected" and nothing more, and the
            client reaction is the ordinary one — refresh, and on failure show
            the login screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/auth/accept-legal:
    post:
      tags: [auth]
      summary: Accept a legal document version
      description: |
        Records that the authenticated user has accepted the specified version
        of the specified legal document. The version label is required to
        defend against a race where the document's active version changed
        between the time the modal was rendered and the time the user clicked
        "Accept". Submitting a stale version label returns 400 `stale_version`
        and the frontend should re-fetch the document.

        Idempotent: re-accepting the same version is a 200 with the original
        accepted_at preserved server-side (compliance evidence is the original
        timestamp, not the latest).

        Whitelisted from the `RequireLegalAcceptances` middleware — otherwise
        users with pending acceptances would be locked out of the very
        endpoint they need to clear them.
      operationId: acceptLegalDocument
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptLegalRequest'
      responses:
        '200':
          description: Acceptance recorded (or no-op if already accepted)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [version, accepted_at]
                    properties:
                      version:
                        type: string
                        description: Version label that was accepted (echo of request).
                      accepted_at:
                        type: string
                        format: date-time
                        description: |
                          Timestamp recorded server-side. On a re-accept the
                          original timestamp is preserved at the storage layer;
                          this response field reflects the freshly minted
                          time.Now() and may differ from the persisted value
                          on idempotent calls.
        '400':
          description: |
            Validation error, stale version (`stale_version`), or document
            does not require acceptance (`not_acceptable_document`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/me/password:
    put:
      tags: [users]
      summary: Change own password
      description: Requires current password. Invalidates all refresh tokens.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ---------------------------------------------------------------------------
  # Organization
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [organization]
      summary: Get organization
      description: |
        Data of `{slug}` — name, timezone, plan, features. Accessible to every
        member of it.

        This is one half of an organization screen's context; the other half is
        the caller's own `OrgMembership` (role, position, status), which comes
        from `GET /api/v1/me/organizations`. Neither is derivable from the
        other, so a client needs both.
      operationId: getOrganization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Organization data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [organization]
      summary: Update organization
      description: Requires `org_admin` or `org_owner` role.
      operationId: updateOrganization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [organization]
      summary: Close this organization, irreversibly
      description: |
        Closes `{slug}` (cross-096). **Owner-only, irreversible, and there is no
        undo anywhere in the product** — not in this contour and not in the
        platform one.

        - **Owner-only** — the caller's `org_owner` role is re-read from
          `org_members` inside the closing transaction, never taken from the
          token (Security Invariant H). Every other role, `org_admin` included,
          gets a 403 with no `error.code`.
        - **The body repeats the slug** and it must equal `{slug}` character for
          character, or the request is a 400. It is a typo guard, not
          authentication: no password is asked for, because whoever holds a live
          session can already delete every integration, empty every escalation
          policy and silence everything — an organization with no routing left
          is just as dead, only quietly.
        - **Only an emptied organization can be closed.** If anybody besides the
          owner is still a member, the answer is 409
          `organization_has_other_members` with the number remaining. People may
          leave on their own or be removed first; this endpoint removes nobody,
          because removal is itself irreversible and doing it in bulk on the way
          to a refusal would leave a half-dismantled organization behind.
        - **A `pro` organization cannot be closed** — 409
          `organization_paid_plan`, including during the grace period that
          follows `expires_at`. There is no self-service downgrade: money is
          prepaid and refunds are a conversation, so a client should route the
          person to support. The wording of that route belongs to the client;
          the server supplies only the code.

        What is true the moment it answers 204:

        - the organization is gone from `GET /api/v1/me/organizations`, and the
          caller's `max_organizations_per_user` slot is free again;
        - every address under `/api/v1/orgs/{slug}` answers 403
          `organization_closed`;
        - the API keys of its integrations stop accepting alerts (403), whatever
          state the integration rows themselves are in;
        - no new delivery is enqueued or picked up for it. Work a worker had
          ALREADY claimed may still finish — that is an honest boundary rather
          than an oversight: nothing transactional joins the claim of a delivery
          to the outbound call it makes.

        What remains — alerts and their journals, teams, schedules, policies,
        channels, the subscription — is removed afterwards by a background
        sweep, which finishes by deleting the organization itself. The slug stays
        taken until then and is free after. None of that is observable and none
        of it is reversible; the only thing to conclude from a 204 is that the
        organization is gone.

        **On any other outcome — 5xx included, and a dropped connection above
        all — re-fetch `GET /api/v1/me/organizations` before saying what
        happened.** A 5xx does not prove the closure did not commit and a
        dropped connection proves nothing at all; the membership list is the
        only authority. Absent from it → treat as success and land on the
        organization picker. Still present → it did not happen, and may be
        retried. The re-fetch itself failed → say the result could not be
        confirmed.
      operationId: closeOrganization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseOrganizationRequest'
      responses:
        '204':
          description: >-
            Organization closed. Re-fetch the membership list: the caller has one
            organization fewer and one quota slot more.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Either the `{slug}` resolver refused access to the organization —
            `error.code` one of `organization_not_member`,
            `organization_blocked`, `organization_closed` (cross-089, possible
            on every route under `/api/v1/orgs/{slug}`) — or the caller is a
            member of it but not its owner. That last one carries **no**
            `error.code` at all; the absence is what tells "not enough rights"
            apart from "this organization is no longer yours".
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/OrgAccessDeniedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: |
            The organization was not closed. The `code` says why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseOrganizationConflictError'

  /api/v1/orgs/{slug}/leave:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [organization]
      summary: Leave organization
      description: |
        Removes the caller from `{slug}`. The account and the session survive;
        only this membership goes away.
        - `org_owner` cannot leave — hand the organization over first with
          `POST /api/v1/orgs/{slug}/transfer-ownership`, which leaves the former
          owner an `org_admin` free to leave.
        - Blocked if user has active (firing/acknowledged) alerts in this org.
        - Blocked when leaving would leave an escalation policy with no steps at
          all (the user is the target of every step that policy still has), and
          alerts routed through it would page nobody. The 409 message names the
          policies to edit first.
      operationId: leaveOrganization
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Left organization
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: >-
            Cannot leave (owner, has active alerts, or would leave an escalation
            policy with no steps)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/activate-trial:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [organization]
      summary: Activate a trial on this organization
      description: |
        Spends one of the caller's trial credits (`users.trial_credits`) to move
        the organization at `{slug}` from the Free plan to the Trial plan (voice
        on, Free-level capacity — cross-058). Owner-only distributive action:
        activating a trial starts consuming a paid resource (МТС Exolve calls) and,
        at launch, the trial expiry clock.

        - **Owner-only** — the caller's `org_owner` role is re-validated against
          `org_members` at request time (Security Invariant H).
        - Requires `trial_credits > 0` and the org currently on the Free plan.
        - The empty request body is intentional — the target org is `{slug}`.
        - On success the org's plan becomes Trial; the trial duration is governed
          by the platform setting `trial.duration_days` (`0` = infinite on the
          beta → no expiry; `14` = timed at launch).
      operationId: activateTrial
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Trial activated — returns the org's updated plan summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PlanInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Either the `{slug}` resolver refused access to the organization —
            `error.code = "organization_not_member"` or
            `"organization_blocked"` (cross-089, possible on every route under
            `/api/v1/orgs/{slug}`) — or the caller is a member but not the
            organization owner, which carries **no** `error.code` at all. The
            absence is what tells "not enough rights" apart from "this
            organization is no longer yours"; see `ForbiddenError`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/OrgAccessDeniedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: |
            Trial cannot be activated. The `code` distinguishes the reason:
            `not_on_free_plan` (org is already on Trial/Pro) or `no_trial_credits`
            (the caller has spent every trial credit).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateTrialConflictError'

  /api/v1/orgs/{slug}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [organization]
      summary: Hand this organization over to another member
      description: |
        Makes `new_owner_id` the `org_owner` of `{slug}` and demotes the caller
        to `org_admin`, in one transaction (api-004).

        - **Owner-only** — the caller's `org_owner` role is re-read from
          `org_members` at request time, never taken from the token (Security
          Invariant H). Every other role, `org_admin` included, gets a 403 with
          no `error.code`.
        - The target must be a member of `{slug}`; a non-member — or an account
          that does not exist — is a 404, the same answer the member card gives,
          so the endpoint cannot be used to probe accounts.
        - **Irreversible by the caller.** The moment it succeeds the caller is
          an `org_admin` and cannot call this endpoint again; only the new owner
          can hand the organization back. Say so in the confirmation dialog.
        - Nothing else moves: no session is ended, no refresh token is revoked,
          no mobile delivery address is silenced, and **no email is sent** —
          neither party is notified. The new owner finds out on their next
          membership refresh.
        - The former owner keeps every channel, rule, team, rotation and
          escalation step they had; so does the new owner.

        The caller's OWN role changed, so the client must re-fetch
        `GET /api/v1/me/organizations` on success — the membership list is what
        every landing decision is made from.
      operationId: transferOrgOwnership
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: >-
            Ownership transferred — the new owner's full member card, the same
            shape `GET /orgs/{slug}/members/{userId}` returns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Either the `{slug}` resolver refused access to the organization —
            `error.code = "organization_not_member"` or
            `"organization_blocked"` (cross-089, possible on every route under
            `/api/v1/orgs/{slug}`) — or the caller is a member but not the
            organization owner, or the caller's own account has lost platform
            access. Those last two carry **no** `error.code` at all; the absence
            is what tells "not enough rights" apart from "this organization is
            no longer yours". See `ForbiddenError`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/OrgAccessDeniedError'
        '404':
          description: >-
            `new_owner_id` is not a member of this organization (or is not an
            account at all — the two are deliberately indistinguishable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Ownership was not transferred. The `code` distinguishes the reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferOwnershipConflictError'

  /api/v1/orgs/{slug}/telegram-bot:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [organization]
      summary: Get organization Telegram bot status
      description: |
        Returns the connection status of the organization's own Telegram bot
        (BYO — bring your own bot, cross-050) plus the data a member needs to
        onboard a personal `telegram` notification channel.

        **Access — all organization members** (`org_owner` / `org_admin` /
        `org_member`), mirroring `GET /orgs/{slug}`. A plain `org_member`
        needs this status to (a) gate "add Telegram channel" when no bot is
        configured and (b) build the `t.me/<bot_username>` deep-link to start
        the bot before pasting their chat id.

        **The bot token is never returned** — it is a write-only secret. Only
        the public `bot_username` (anyone can open `t.me/<username>`) and the
        non-sensitive `bot_id` / `updated_at` are exposed.
      operationId: getOrganizationTelegramBot
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Telegram bot status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramBotStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [organization]
      summary: Connect or replace organization Telegram bot
      description: |
        Connects a new Telegram bot for the organization, or replaces the
        currently configured one (cross-050). The supplied `bot_token` is
        validated against Telegram (`getMe`), then stored encrypted at rest;
        it is never returned by any endpoint.

        Requires `org_admin` or `org_owner` role (mirrors
        `PATCH /orgs/{slug}`).

        Replacing a bot may change `bot_id`: members who previously pressed
        Start on the old bot must press Start on the new one before delivery
        resumes to their existing `telegram` channels.
      operationId: putOrganizationTelegramBot
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramBotConnectRequest'
      responses:
        '200':
          description: Telegram bot connected (status with configured=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramBotStatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: |
            The supplied bot token is invalid. The body uses the structured
            `InvalidBotTokenError` shape with `error.code = "invalid_bot_token"`
            so the UI can render the precise copy. Covers two cases:
              * the token does not match the `@BotFather` format
                `^\d+:[A-Za-z0-9_-]{30,}$` (rejected before any outbound call);
              * the token is well-formed but Telegram `getMe` rejected it
                (revoked / wrong / unknown bot).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidBotTokenError'
    delete:
      tags: [organization]
      summary: Disconnect organization Telegram bot
      description: |
        Removes the organization's Telegram bot record (cross-050). Requires
        `org_admin` or `org_owner` role (mirrors `PATCH /orgs/{slug}`).

        Members' existing `telegram` notification channels are **not** deleted,
        but stop delivering until a bot is connected again via `PUT`.
      operationId: deleteOrganizationTelegramBot
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Telegram bot disconnected (no content)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Mobile installations (api-102)
  # ---------------------------------------------------------------------------
  /api/v1/me/mobile-installations:
    get:
      tags: [mobile-installations]
      summary: List the caller's mobile devices
      description: |
        Returns the caller's **active** mobile devices, most recently seen
        first. Revoked devices are not listed, because they are not devices of
        the user any more. Their records are nevertheless kept for as long as
        the account exists: it is that record which makes a revocation
        permanent, so a revoked device cannot be brought back by registering it
        again.

        Scoped to the account — no organization context is required or used.

        **No push token is ever returned**, in any form: neither the raw
        provider token nor its hash. `push_endpoint` carries only routing facts
        (provider, environment, last registration time) and is `null` when the
        device currently has no deliverable address.
      operationId: listMobileInstallations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's active mobile devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileInstallationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/me/mobile-installations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: |
          The installation identifier, generated by the CLIENT. It is the
          identity of the device and survives push-token rotation, so the
          server never assigns it.

          What answers `404` differs by method, because the methods mean
          different things. `DELETE` needs an existing device, so a malformed
          identifier, an unknown one and one owned by another user all answer
          the same `404`. `PUT` is an upsert: an unknown identifier **creates**
          the device, and only a malformed identifier or one owned by another
          user answers `404`. In both cases "belongs to somebody else" is
          indistinguishable from the other refusals — the endpoints must not
          become an enumeration oracle over other people's devices.
    put:
      tags: [mobile-installations]
      summary: Register or refresh a mobile device
      description: |
        Idempotent upsert of one device plus its current push address.

        Repeating the call with the same installation, provider and token
        changes nothing but the "last seen" timestamps — in particular it does
        **not** advance the endpoint's internal token generation, so an app that
        re-registers on every launch stays stable.

        **The address is optional.** Omitting both `provider` and `push_token`
        registers the device with no delivery address: the installation is
        `active`, `push_endpoint` is `null`, and
        `push_address_absence_reason` carries the client's explanation. This is
        an ordinary state, not a failure — a person who refused notifications,
        or a handset with no push transport, must still finish onboarding, and
        the device limit counts DELIVERABLE devices, so such a device occupies
        no place. The two fields are ATOMIC: sending exactly one of them is
        `400`, because the provider is physically stored on the address row and
        has nowhere to live without it.

        Omitting them on a device that ALREADY holds a live address does **not**
        take that address away. An absent field is not a gesture of removal, and
        the explicit gesture for switching a handset off already exists — it is
        `DELETE`, and it is irreversible.

        Address transitions, all applied atomically:
          * **new token, same provider** — the address is rotated in place;
          * **different provider** — the previous address is superseded and a
            new one is created; exactly one address stays active, and the server
            never falls back between providers;
          * **token already active on another device** — that device's address
            is revoked and the token is reassigned. An operating-system token
            follows the handset, and leaving the previous owner's address active
            would page them about somebody else's incidents.

        A **revoked** installation is never resurrected (`409
        installation_revoked`), and the refusal does not expire: revocation is
        how "I lost this phone" is expressed, and a background re-registration
        undoing it silently is precisely the failure this refusal prevents. The
        record of a revoked device is kept for as long as the account exists, so
        an identifier that was turned off stays refused.

        The refusal is terminal for the client: it must neither retry nor
        rotate the installation identifier on its own. A new identifier may be
        minted only after the person has completed an interactive sign-in with
        their password on that device, and only if that sign-in happened
        **after** this refusal — a token refresh, a biometric unlock of a
        stored credential and an ordinary app launch do not count as one. The
        server cannot tell a rotated identifier from an honest reinstall, so
        this is an obligation of the client, not a rule the server enforces.

        `app_id` is stored but not yet checked against provider credentials —
        that comparison arrives with the provider adapter.
      operationId: putMobileInstallation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMobileInstallationRequest'
      responses:
        '200':
          description: Device registered or refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileInstallationDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Authentication required, or the presented access token is older than
            the moment this account's credentials were invalidated — logging out
            everywhere, changing or resetting the password, or a platform block
            all move that moment, and every token minted earlier stops being
            accepted here. "Older" is measured to whole seconds on both sides, so
            a token minted inside the same second as the invalidation is still
            accepted: `iat` carries whole seconds only, and a stricter reading
            would refuse tokens this product had just issued. A token carrying no
            `iat` at all is refused here too — this endpoint has to know WHEN the
            presented token was made, and "cannot tell" reads as no, even though
            the same token still authenticates ordinary requests.

            The refusal belongs to endpoints that mint something durable from a
            token rather than to authentication at large: an access token is
            stateless with a short lifetime, and on ordinary requests its powers
            die with it, but registering a device converts a brief write into an
            OPEN-ENDED delivery address. There is no `error.code`: `401` means
            "the presented token was rejected" and nothing more, so the client
            reaction is the ordinary one — refresh, and on failure show the
            login screen, which is where somebody who has just changed their
            password belongs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/MobileInstallationNotFound'
        '409':
          description: |
            The registration conflicts with the current state of the account.
            The body carries `error.code`; clients switch on it:
              * `installation_revoked` — this installation was revoked and is
                not resurrected. The refusal is terminal: do not retry, and do
                not rotate the installation identifier automatically (see the
                endpoint description for the one path that mints a new one);
              * `installation_limit_reached` — the account already holds the
                maximum number of devices that can currently be paged (an
                active device whose address the provider has declared dead does
                not occupy a place). This is deliberately **not** reported as a
                plan quota (the limit is per user, not per organization, and no
                upgrade lifts it); the resolution is to revoke a device that is
                no longer used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileInstallationConflictError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
    delete:
      tags: [mobile-installations]
      summary: Revoke a mobile device
      description: |
        Turns off one device: the installation is revoked and every active push
        address of it is revoked with its stored token erased.

        Idempotent — revoking an already-revoked device also answers `204`,
        because the post-condition the caller asked for holds either way.

        The scope is this device only: the endpoint revokes exactly the device
        named in the path and no other. Removing the caller from an
        organization does **not** revoke any device either — a device belongs
        to the person, not to an organization.

        Unlike registration, revoking is **not** rate limited: it is how a lost
        handset is turned off, and it must answer whatever else the account has
        been doing.
      operationId: deleteMobileInstallation
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Device revoked (no content)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/MobileInstallationNotFound'

  # ---------------------------------------------------------------------------
  # Invites
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/invites:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [invites]
      summary: List organization invites
      description: |
        Lists all invites of `{slug}`.
        Requires `org_admin` or `org_owner` role — the list exposes every
        invited email, so it is not readable by `org_member`.
      operationId: listInvites
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitesListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [invites]
      summary: Create invite
      description: |
        Sends an invite to join the organization.
        Requires `org_admin` or `org_owner` role.
        Requires verified email (`email_verified_at != null`).
        Invite expires in 72 hours.
      operationId: createInvite
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: Invite created
          headers:
            X-Quota-Limit-members:
              description: |
                Configured org-members quota limit, resolved through the plan
                reader (`subscriptions.limits_override` > `plans.limits` > env
                default). Creating an invite charges this cap up front, because
                a sane invite must end in a member slot. Omitted when the quota
                is unlimited (limit <= 0) rather than reported as 0.
              required: false
              schema:
                type: integer
            X-Quota-Used-members:
              description: |
                Current org member count. NOT incremented by this request — an
                invite creates no `org_members` row until it is accepted — so
                the pair advertises how much member headroom is left before
                further invites are refused. Omitted together with the limit
                header when the quota is unlimited.
              required: false
              schema:
                type: integer
            X-Quota-Limit-pending_invites:
              description: |
                Configured cap on invites awaiting a reply, resolved through the
                same plan reader as the members pair. Omitted when the quota is
                unlimited (limit <= 0) rather than reported as 0.
              required: false
              schema:
                type: integer
            X-Quota-Used-pending_invites:
              description: |
                Number of invites currently awaiting a reply, INCLUDING the one
                just created — unlike the members pair, this request does move
                the counter. Omitted together with the limit header when the
                quota is unlimited.
              required: false
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Forbidden. One of:
              * access to `{slug}` is gone — `code="organization_not_member"`
                or `code="organization_blocked"` (cross-089, possible on every
                route under `/api/v1/orgs/{slug}`);
              * an RBAC / verification denial (`Error` /
                `LegalAcceptanceRequiredError`) — **no** `code` for the plain
                RBAC case, and that absence is what distinguishes it from the
                two above;
              * the org-members anti-abuse quota was hit
                (`code="quota_exceeded"`);
              * the paid-seat ceiling was reached on a paid Pro subscription
                (`code="paid_seats_exceeded"`, cross-059) — the org must add
                seats before inviting another member. On beta (Free/Trial) the
                seat case never occurs.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/LegalAcceptanceRequiredError'
                  - $ref: '#/components/schemas/QuotaExceededError'
                  - $ref: '#/components/schemas/PaidSeatsExceededError'
                  - $ref: '#/components/schemas/OrgAccessDeniedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/orgs/{slug}/invites/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [invites]
      summary: Resend invite
      description: Resends the invite email. Requires `org_admin` or `org_owner` role.
      operationId: resendInvite
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: Invite resent
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs/{slug}/invites/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    delete:
      tags: [invites]
      summary: Revoke invite
      description: Cancels a pending invite. Requires `org_admin` or `org_owner` role.
      operationId: revokeInvite
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: Invite revoked
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Users (admin)
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [members]
      summary: List organization members
      description: |
        Members of `{slug}`. Requires `org_admin` or `org_owner` role.

        Returns `OrganizationMember`, not `User`: `org_role` and `position_id`
        are properties of the membership in THIS organization, and the same
        account carries different ones elsewhere (cross-089).
      operationId: listOrgMembers
      security:
        - BearerAuth: []
      parameters:
        - name: org_role
          in: query
          schema:
            $ref: '#/components/schemas/OrgRole'
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: team_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter members by team membership
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of organization members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembersListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # An organization manages membership, not the account itself (cross-075):
  # creating, updating and password-resetting a `users` row from an org route
  # were removed — an org role must not mutate the global `users` entity.
  # People are added through invites (`POST /orgs/{slug}/invites`); role and
  # position are changed through `PATCH /orgs/{slug}/members/{userId}`.
  #
  # cross-089 folded the former `/users/{id}` and `/users/{id}/member` into a
  # single path item: under the canonical map both become
  # `/orgs/{slug}/members/{userId}`, and OpenAPI cannot declare one path
  # template twice. The three operations are unchanged in behaviour; the
  # suffix `/member` is gone because the resource itself is now the membership.
  /api/v1/orgs/{slug}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/OrgMemberUserId'
    get:
      tags: [members]
      summary: Get organization member
      description: |
        One member of `{slug}`. Requires `org_admin` or `org_owner` role.

        Returns `OrganizationMember` — the account fields plus this
        organization's `org_role` and `position_id` (cross-089).
      operationId: getOrgMember
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Organization member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [members]
      summary: Update org membership
      description: |
        Updates the member's organization role and/or position.
        Requires `org_admin` or `org_owner` role.
        Cannot assign `org_owner` role. Cannot modify own membership (409).
        A non-owner admin cannot modify an existing `org_owner` (403,
        `error.code = "cannot_modify_owner"`).

        Returns the same `OrganizationMember` as `GET` on this path
        (cross-089). A `GET` and a `PATCH` on one resource must describe the
        same thing: the members screen needs the whole card after a role
        change and used to stitch the account fields back in by hand. The
        price is one extra read on a rare administrative operation.
      operationId: updateMember
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Membership updated — the member's full card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      tags: [members]
      summary: Remove member from organization
      description: |
        Removes a member from `{slug}`.
        Requires `org_admin` or `org_owner` role.
        Cannot remove `org_owner`. Cannot remove self. Blocked if member has active alerts.
        Also blocked when the removal would leave an escalation policy with no
        steps at all (the member is the target of every step that policy still
        has), and alerts routed through it would page nobody. The 409 message
        names the policies to edit first.

        Removal takes the membership away, never the account: the person keeps
        their session, their profile and their other organizations (cross-075,
        cross-089). Their access to `{slug}` stops on the next request.
      operationId: removeMember
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Member removed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: >-
            Cannot remove (owner, self, has active alerts, or would leave an
            escalation policy with no steps)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

