    OrgMembershipDataResponse:
      type: object
      description: |
        A single membership of the caller. Returned by the two endpoints that
        create one — `POST /api/v1/orgs` and
        `POST /api/v1/auth/accept-invite` — so the client learns the slug to
        navigate to. Neither endpoint issues tokens any more (cross-089): the
        session already exists and is not bound to an organization.
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/OrgMembership'

    OrganizationMemberDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/OrganizationMember'

    InviteDataResponse:
      type: object
      required: [data]
      properties:
