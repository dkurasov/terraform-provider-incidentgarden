  # The caller's own on-call picture, one call for the whole organization
  # (api-116). Its per-schedule counterpart is the endpoint right below.
  /api/v1/orgs/{slug}/me/on-call:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [schedules]
      summary: My on-call picture in this organization
      description: |
        Answers "am I on call, who is on call if not me, and when is my next
        shift" for every schedule of the teams the caller belongs to — in one
        call. `GET /api/v1/orgs/{slug}/schedules/{id}/on-call` answers the same
        question for ONE schedule and is unchanged; this endpoint exists
        because a client otherwise has to walk teams, then schedules, then one
        request per schedule.

        **Scope is team membership, never the org role.** An `org_admin` or
        `org_owner` who belongs to no team gets `200` with
        `is_team_member: false` and empty lists — the state "there is nowhere
        to be on call", not `403` and not an organization-wide overview. This
        deliberately differs from `GET /api/v1/orgs/{slug}/schedules`, which is
        role-scoped: the picture here is a duty roster for the person, not an
        administrator's view.

        **The response carries independent facts, not a screen state.** There is
        no summary enum and no `am_i_on_call` boolean: a summary can disagree
        with the very body that produced it, and `on_call_schedule_ids` already
        answers both "am I on call" (non-empty) and "where" (its members).

        **Emptiness is always an explicit value.** `[]`, `null` and
        `next_shift.state = "no_shift"` are answers; a missing key is not. The
        four screen states — I am on call / somebody else is / nobody is /
        I have no team — are told apart by `is_team_member`, `schedules` and
        `on_call_schedule_ids` together, and by nothing else.

        The moment is always "now": there is no `at` parameter. Ask the
        per-schedule endpoint for another moment.
      operationId: getMyOnCall
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's on-call picture in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOnCallResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs/{slug}/schedules/{id}/on-call:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [schedules]
      summary: Who is on call
      description: Returns users currently on call for this schedule.
      operationId: getOnCall
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - name: at
          in: query
          description: >
            Point in time (RFC3339, default = now). Must fall within calendar
            years 2020-2099; a moment outside that range is rejected with 400
            rather than answered with an empty roster. JSON Schema cannot express
            a bound on a date-time string, so this sentence is the contract.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: On-call users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnCallResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs/{slug}/schedules/{id}/timeline:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [schedules]
      summary: Get schedule timeline
      description: Pre-calculates a timeline showing who is on-call, grouped by rotation.
      operationId: getScheduleTimeline
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - name: from
          in: query
          description: >
            Start of time range (RFC3339, default = now). Must fall within
            calendar years 2020-2099. The 90-day span limit below is a separate,
            relative check: a short window placed outside these years is refused
            by this bound, not by that one.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: >
            End of time range (RFC3339, default = from + 14 days). Must fall
            within calendar years 2020-2099, and must be after `from` by no more
            than 90 days.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Schedule timeline grouped by rotation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScheduleTimeline'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs/{slug}/schedules/{id}/rotations:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [schedules]
      summary: Add rotation to schedule
      description: "Access: org_admin, org_owner, or team_admin of the schedule's team."
      operationId: createRotation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRotationRequest'
      responses:
        '201':
          description: Rotation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationDataResponse'
        '400':
          description: |
            Validation or domain error. Possible messages:
            - validation error (invalid request body)
            - "end date must be after start date"
            - "invalid time restriction"
            - "single-day overnight time restriction is not allowed; use different start/end days for overnight windows" — a `weekday_and_time` restriction with `start_day == end_day` and `end_time <= start_time` (see TimeRestriction schema)
            - "time restriction windows must not overlap" — two windows of the same rotation overlap on the weekly circle (see TimeRestriction schema)
            - "hourly rotations cannot have a time restriction" — an `hourly` rotation was given a `time_restriction` (see TimeRestriction schema)
            - "participant requires user_id for type user or team_id for type team"
            - "participant of type none must carry neither user_id nor team_id" — an empty position of the rotation circle must carry no target at all (see CreateRotationRequest.participants)
            - "participant of type user must carry only user_id, and of type team only team_id" — the reference a type demands is also the only one it may carry (see CreateRotationRequest.participants)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: |
            Participant validation failed. Possible messages:
            - "participant must belong to the schedule's team" — a rotation participant (user or team) does not belong to the schedule's team. A schedule is team-scoped, so every participant must belong to that same team: a user who is only a member of a sibling team, a `team` participant whose id differs from the schedule's team, or an org_admin/org_owner who is not an actual member of the team are all rejected here. Anti-enumeration — the same message and status are returned whether the participant is absent or merely in another team. (The legacy org-scoped messages "user is not a member of this organization" / "team does not belong to this organization" remain for the team_id supplied at schedule creation.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/schedules/{id}/rotations/preview:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [schedules]
      summary: Preview the shift pattern of a rotation without saving it
      description: |
        Answers "what would this rotation produce" for a rotation body that has
        not been stored — the create form and the edit form both post the SAME
        body they would save.

        Access: org_admin, org_owner, or team_admin of the schedule's team.

        WHAT IT IS NOT. The answer is the pattern of ONE rotation: overrides and
        the schedule's other rotations are not part of the calculation, so this
        does not answer "who will actually be on call". A client showing these
        intervals must say so.

        The rotation is validated exactly as create and update validate it (the
        same date range, window, hourly-restriction, ceiling and team-membership
        rules), so a body accepted here is accepted by the write that follows.
        The rotation quota is deliberately NOT consulted — a team already at its
        rotation limit can still look at a preview, because looking creates
        nothing.
      operationId: previewRotation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRotationRequest'
      responses:
        '200':
          description: Preview computed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationPreviewDataResponse'
        '400':
          description: |
            Validation or domain error. The same messages the create endpoint
            answers with, for the same bodies:
            - validation error (invalid request body)
            - "end date must be after start date"
            - "date must be within years 2020-2099"
            - "invalid time restriction"
            - "single-day overnight time restriction is not allowed; use different start/end days for overnight windows"
            - "time restriction windows must not overlap"
            - "hourly rotations cannot have a time restriction"
            - "participant requires user_id for type user or team_id for type team"
            - "participant of type none must carry neither user_id nor team_id" — an empty position of the rotation circle must carry no target at all (see CreateRotationRequest.participants)
            - "participant of type user must carry only user_id, and of type team only team_id" — the reference a type demands is also the only one it may carry (see CreateRotationRequest.participants)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: |
            Participant validation failed. Possible messages:
            - "participant must belong to the schedule's team" — same rule and same anti-enumeration polarity as createRotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

