  /api/v1/legal:
    get:
      tags: [legal]
      summary: List public legal documents
      description: |
        Returns active legal documents with a published version.
        Drafts (no active version) and inactive documents are excluded.
        No authentication required.
      operationId: listLegalDocuments
      security: []
      responses:
        '200':
          description: List of public legal documents
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegalDocumentSummary'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/legal/{slug}:
    get:
      tags: [legal]
      summary: Get a public legal document by slug
      description: |
        Returns the active version of a legal document by its slug.
        Drafts and inactive documents return 404 (callers cannot
        distinguish "wrong slug" from "draft" from "deactivated").
        No authentication required.
      operationId: getLegalDocumentBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        '200':
          description: Legal document with active version content
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LegalDocumentPublic'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/legal/{slug}/versions/{version}:
    get:
      tags: [legal]
      summary: Get a historical version of a public legal document
      description: |
        Returns a specific version (by label) of an active legal document.
        Drafts and inactive documents return 404.
      operationId: getLegalDocumentVersion
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - name: version
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: Legal document version content
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LegalDocumentVersion'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    # Account id of a member of {slug}. Named `userId` rather than `id`
    # because cross-089 folded `/users/{id}` and `/users/{id}/member` into the
    # single path item `/orgs/{slug}/members/{userId}`, and a path template
    # can only declare one name for that segment. Kept apart from
    # `TeamMemberUserId`, which addresses the same account inside a team.
    OrgMemberUserId:
      name: userId
      in: path
      required: true
      description: Account id of the organization member
      schema:
        type: string
        format: uuid
    PositionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamMemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RotationId:
      name: rotationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OverrideId:
      name: overrideId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EscalationPolicyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IntegrationPolicyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IntegrationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKey:
      name: apiKey
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SilenceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationChannelId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    # Every org-scoped route carries the organization in the address
    # (cross-038 for notifications, cross-089 for the rest). Pattern matches
    # the identity validator (lowercase + digits + single-hyphen joins).
    OrgSlug:
      name: slug
      in: path
      required: true
      description: |
        Organization slug (URL-safe, lowercase + digits + hyphens). This
        segment — not the access token — decides which organization the
        request runs in, and the caller's role is resolved from it on every
        request, so a removed membership or a lowered role takes effect
        immediately.

        Resolving it can fail three ways on ANY route that carries it:
          * `404` — no organization has this slug;
          * `403` with `error.code = "organization_not_member"` — the
            organization exists, the caller holds no membership in it;
          * `403` with `error.code = "organization_blocked"` — the caller's
            membership is intact, a platform administrator blocked the
            organization.

        **The three are deliberately distinguishable, and that is a decision,
        not an oversight.** Because 403 and 404 differ, an authenticated
        caller can learn whether a given slug is taken — addressing tenants by
        name makes organization names enumerable, and cross-089 accepted that
        knowingly. Nothing beyond that single bit leaves the server: no name,
        no size, no member, no owner, no plan. The alternative — answering 404
        for an organization the caller cannot see — was rejected because it
        collapses "you are no longer in this organization" into "this address
        is a typo", and those two demand different behaviour from the client
        (re-fetch memberships and go to the picker vs. show a not-found page).
        Do not "harden" this into a uniform 404.

        The slug is immutable — there is no endpoint to change it — because
        addresses, browser history, client cache keys and mobile navigation
        all stand on it.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    ReportFrom:
      name: from
      in: query
      required: true
      description: Period start (ISO 8601 datetime)
      schema:
        type: string
        format: date-time
    ReportTo:
      name: to
      in: query
      required: true
      description: Period end (ISO 8601 datetime)
      schema:
        type: string
        format: date-time
    ReportTeamId:
      name: team_id
      in: query
      description: Filter by team (org_member is restricted to their own teams)
      schema:
        type: string
        format: uuid
    ReportLimit:
      name: limit
      in: query
      description: Maximum number of items (default 50, max 200)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ReportOffset:
      name: offset
      in: query
      description: Number of items to skip
      schema:
        type: integer
        minimum: 0
        default: 0

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------
  responses:
    MessageResponse:
      description: Success message
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message:
                    type: string
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: |
        Access denied.

        **Read `error.code` first, and read its ABSENCE as information.**
        The causes that mean "you have lost access to this organization" are the
        ones carrying an org-access code (cross-089); the authoritative list of
        those codes is the enum of `OrgAccessDeniedError`, not this table:

        | `error.code`              | Meaning                                            |
        |---------------------------|----------------------------------------------------|
        | `organization_not_member` | the caller is not a member of `{slug}`             |
        | `organization_blocked`    | `{slug}` was blocked by a platform administrator   |
        | `organization_closed`     | `{slug}` was closed by its owner and is being removed |
        | *(absent)*                | a plain RBAC refusal — the caller IS in this org   |

        The absence is load-bearing: it is the only thing that tells
        "not enough rights for this action" apart from "this organization is
        not yours any more". Clients must react differently — a plain RBAC 403
        is an inline message and nothing else, while either coded one means
        re-fetch the membership list and go to the organization picker,
        without ending the session. Detecting the difference by matching the
        message text is forbidden; the text is not a contract, the code is.
        Both coded refusals are emitted by the `{slug}` resolver, so any route
        under `/api/v1/orgs/{slug}` can return them.

        Other causes, all of them code-less unless stated:
          - insufficient role for the requested operation
          - email not verified
          - password change required: the user has `must_change_password=true`
            and must complete `POST /api/v1/auth/initial-password-change`
            before using other endpoints
          - public self-signup has been disabled by the platform admin
            (message `"registration is disabled"`, returned by
            `POST /api/v1/auth/register`)
          - legal acceptance required: the user has unmet legal-document
            acceptances. The body uses the structured `LegalAcceptanceRequiredError`
            shape with `error.code = "legal_acceptance_required"` and
            `error.details.pending` listing the documents to accept; clients
            should switch on `error.code` to detect this case.
          - org_owner protection: a non-owner admin attempted to change the
            organization owner's role or position. The body carries
            `error.code = "cannot_modify_owner"`; the sole emitter is
            `PATCH /orgs/{slug}/members/{userId}` (cross-075 removed the org-level
            password-reset and user-update endpoints, so an org role can no
            longer touch the owner's account itself).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/LegalAcceptanceRequiredError'
              - $ref: '#/components/schemas/OrgAccessDeniedError'
    IngestionOrganizationInactive:
      description: |
        The organization owning this API key is not active — it was blocked by a
        platform administrator, or closed by its owner (cross-096). The key is
        valid and the integration may well be enabled; neither matters while the
        organization is not active, and re-enabling the integration will not
        change the answer.

        **The two states are deliberately not distinguished**, here or anywhere
        outside the platform contour: which of them applies is a fact about the
        tenant that must not leak to whoever holds the key (api-082). The body is
        a plain `Error` and carries no `error.code` — a sender of alerts branches
        on the status, not on a dictionary.

        Retrying does not help. A blocked organization comes back when an
        administrator unblocks it; a closed one never does.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Conflict (duplicate, constraint violation, invalid state)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntityError:
      description: Business logic validation failed (e.g., referenced entity not found or cross-entity constraint violated)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsError:
      description: |
        Rate limit exceeded. The client must wait the number of seconds
        specified in the `Retry-After` header before retrying.

        Bucket scopes (cross-029):
          * Per IP — `/auth/login`, `/auth/register`, `/auth/forgot-password`,
            `/auth/reset-password`, `/auth/refresh`, `/auth/verify-email`,
            `/auth/resend-verification`.
          * Per API key — `/integrations/{apiKey}/alerts` (and any other
            ingestion endpoint embedding the API key in the path).
          * Per user — `POST /orgs`,
            `POST /orgs/{slug}/me/notification-channels` (per-tenant since
            cross-038), `POST /auth/accept-invite` (authenticated since
            cross-076), `PUT` and `DELETE
            /api/v1/me/mobile-installations/{id}` (api-102 — both share ONE
            bucket; the matching `GET` is not limited).
          * Per organization (cross-029 sub-task 2) — `POST /integrations`,
            `POST /silences`, `POST /policies`,
            `POST /teams`, `POST /schedules`. Each per-org bucket fires only on
            the create POST; PATCH/DELETE/GET on the same resource family share
            neither budget nor headers.

        Body uses the standard `Error` envelope. Per-org buckets exist to
        damp cross-tenant abuse: a flooding org cannot exhaust a global
        budget and starve other tenants — see CLAUDE.md § F Cross-org
        abuse principle.
      headers:
        Retry-After:
          description: Integer number of seconds the client must wait before retrying.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CSRFInvalid:
      description: |
        CSRF validation failed. Returned by any authenticated mutation
        (POST/PUT/PATCH/DELETE on `/api/v1/...` routes mounted under
        `AuthMiddleware`) when the `X-CSRF-Token` request header is missing
        or does not match the value of the `csrf_token` cookie. The cookie
        is seeded by every auth flow that mints a session (login, register,
        refresh, initial-password-change). Frontends mirror the
        double-submit-cookie pattern: read the cookie value via
        `document.cookie` and echo it in the `X-CSRF-Token` header on every
        mutation. The error envelope carries `error.code = "csrf_invalid"`
        so the frontend can distinguish CSRF failures from RBAC denials.
        Public unauthenticated endpoints (login, register, refresh) are NOT
        gated by CSRF — the cookie is not yet
        present. Webhook ingestion (`POST /integrations/{apiKey}/alerts`)
        authenticates via API key in the URL path and is also exempt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: |
        Request body exceeds the 1 MiB size limit (`MaxJSONBodyBytes`).
        Returned by any endpoint that decodes JSON via `httputil.DecodeJSON`
        and by the alert ingestion handlers, which cap the raw body before
        parsing. This is the only trigger: there is no limit on the number of
        entries in an AlertManager `alerts[]` array — a batch of any length is
        accepted as long as the encoded body fits the byte limit.
        Clients should reduce the payload size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: |
        Hard upper-bound resource quota reached (cross-029). The body uses the
        structured `QuotaExceededError` shape with `error.code = "quota_exceeded"`
        and `error.details = {resource, limit, used}`; clients should switch on
        `error.code` to render a localised "limit reached for X" banner with
        the actionable next step (contact admin / upgrade plan). See
        `QuotasConfig` defaults in `.env.example` and the per-resource enforcement
        list in `docs/tasks/planning/rate-limits-policy.md`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuotaExceededError'
    ChannelDuplicate:
      description: |
        A notification channel of the same type and target already exists in
        this organization for this user (cross-038). The body uses the
        structured `ChannelDuplicateError` shape with `error.code =
        "channel_duplicate"`; clients should surface an inline form error
        rather than a toast and prompt the user to use the existing channel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChannelDuplicateError'
    MobileInstallationNotFound:
      description: |
        No mobile installation this request could act on belongs to the caller
        (api-102). The cases it collapses depend on the method — `DELETE` also
        answers it for an unknown identifier, whereas `PUT` creates the device
        in that case (see the path parameter). What both share is that an
        identifier owned by ANOTHER user is indistinguishable from the rest, so
        the endpoints cannot be used to enumerate other people's devices. The
        body carries `error.code = "installation_not_found"`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MobileInstallationNotFoundError'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # --- Enums ---------------------------------------------------------------
    OrgRole:
      type: string
      enum: [org_owner, org_admin, org_member]
      description: Organization-level role
    OrganizationStatus:
      type: string
      enum: ['active', 'blocked']
      description: |
        Lifecycle status of an organization, set by a platform administrator.
        `blocked` means every org-scoped route of that organization answers
        `403` with `error.code = "organization_blocked"`; the caller's session
        and their other organizations are untouched (cross-089).
    TeamRole:
      type: string
      enum: [team_admin, team_member]
    AlertStatus:
      type: string
      enum: [firing, acknowledged, resolved, delayed, silenced, dropped]
    AlertSeverity:
      type: string
      enum: [critical, warning]
    MobilePlatform:
      type: string
      enum: [ios, android]
      description: Mobile operating system of a registered device (api-102).
    MobileEnvironment:
      type: string
      enum: [development, production]
      description: |
        Push provider environment. It separates sandbox builds from store
        builds; one request carries a single value that is applied to both the
        device and its address, so the two can never disagree.
    MobilePushProvider:
      type: string
      enum: [apns, fcm, rustore]
      description: |
        Transport that delivers to the device. The app STORE is a different
        axis and is not modelled: a build downloaded from RuStore still runs on
        Android and is served by FCM when Google services are present.
    MobilePermissionStatus:
      type: string
      enum: [unknown, denied, provisional, authorized]
      description: Operating-system notification permission state reported by the client.
    MobileCriticalAlertStatus:
      type: string
      enum: [unknown, denied, authorized]
      description: |
        iOS critical-alert entitlement state. There is no `provisional` value —
        the entitlement has no such state, and declaring one would invite
        clients to handle a case that cannot occur.
    MobileInstallationStatus:
      type: string
      enum: [active, revoked]
      description: |
        Lifecycle of a registered device. `revoked` is terminal: a later
        registration with the same identifier is refused rather than
        resurrecting it.
    MobilePushAddressAbsenceReason:
      type: string
      enum: [permission_denied, transport_unavailable, provider_error]
      description: |
        Why a registered device currently has no push delivery address, as
        reported by the client (api-123).

        It is a THIRD axis, not an extension of `permission_status`: the
        permission is meaningful while an address is alive too (withdrawing it
        does not invalidate the token), whereas this value is defined only
        where there is no address. `authorized` together with
        `push_endpoint: null` is exactly a handset without Google services,
        and nothing else in the read model can say so.

        `provider_error` is deliberately separate from
        `transport_unavailable`: "the SDK returned an error" and "this handset
        has no transport at all" are cured by opposite actions of the person,
        and collapsing them hides one of the two.

        The value EXPLAINS and decides nothing: neither deliverability, nor
        readiness, nor the device limit looks at it. A gate on a
        client-reported field on the paging path would mean a broken build
        silences the pager.
    OrgAvailability:
      type: string
      enum: [active, blocked]
      description: |
        Whether an organization can be acted on (api-103). `blocked` means the
        platform has suspended it: it is still listed, but every per-org call
        is refused with `403` until the block is lifted.
    PushChannelStatus:
      type: string
      # 'off' is quoted deliberately: unquoted it is a BOOLEAN in YAML 1.1, and
      # a parser on that version would turn this enum member into `false` —
      # silently, in the generated frontend types.
      enum: ['off', 'missing_critical_rule', 'ready']
      description: |
        State of the caller's push channel in ONE organization (api-103).

          * `off` — no push channel here, or one that would not be used for
            delivery (disabled or unverified). The two collapse into one value
            because the fix is the same call either way;
          * `missing_critical_rule` — the channel would be used, but no
            `critical` rule routes to it, so nothing is sent. Literal on
            purpose: a `warning` rule may exist, which is why this is not
            called `no_rules`. **Not a fault by itself:** enabling push creates
            no rule (api-120), so this is the ordinary state of a channel that
            has just been switched on and is waiting for the person to say what
            should be routed to it. Read it as "the channel is there, the route
            is not set yet", and lead to
            `PUT /api/v1/orgs/{slug}/me/notification-rules`;
          * `ready` — everything the server controls is in place. It says
            nothing about devices; that is the other axis
            (`ready_installations`).
    PushChannelTestOutcome:
      type: string
      # Every member is quoted deliberately. Under YAML 1.1 bare `off`/`on`/
      # `no` and their kin parse as BOOLEANS, and a parser on that version puts
      # `false` into the generated frontend types — silently. Quoting the whole
      # list keeps the rule in sight of whoever adds the next value.
      enum: ['accepted', 'address_invalidated', 'failed']
      description: |
        What the push transport said about ONE device (api-106):

          * `accepted` — the transport took the message for this device;
          * `address_invalidated` — the transport declared the address dead and
            the address has been cleared. The person has to open the app on
            that handset so it registers a fresh address; retrying from here
            cannot help;
          * `failed` — everything else: the transport refused the message, or
            could not be reached at all.

        There is no `delivered` value and there will not be one. The platform
        records that the PROVIDER ACCEPTED the message, never that the person
        received it — that boundary is where the platform's responsibility
        ends. A word implying receipt would lie on exactly the screen where
        somebody is checking whether their pager works.
    IntegrationType:
      type: string
      enum: [alertmanager, grafana, zabbix, generic_webhook]
    SeverityMapping:
      type: object
      description: Configures how source severity values map to critical/warning
      properties:
        source_field:
          type: string
          description: |
            Path to extract severity from the payload (e.g. "labels.severity", "severity").
            Empty string is allowed and means "no extraction — use default".
            Non-empty must match the pattern: dot-separated non-empty segments
            (no leading/trailing dots, no consecutive dots).
          pattern: '^$|^[^.]+(\.[^.]+)*$'
        mapping:
          type: object
          properties:
            critical:
              type: array
              items:
                type: string
              description: Source values that map to critical severity
            warning:
              type: array
              items:
                type: string
              description: Source values that map to warning severity
        default:
          type: string
          enum: [critical, warning]
          description: Default severity when source value is not found in mapping
    RotationType:
      type: string
      enum: [daily, weekly, hourly]
    ParticipantType:
      type: string
      enum: [user, team, none]
    EscalationTargetType:
      type: string
      enum: [on_call_schedule, user, team]
    NotificationChannelType:
      type: string
      enum: [push, telegram, email, mattermost, sip, webhook]
    NotificationEventType:
      type: string
      enum: [critical, warning]
    AlertLogAction:
      type: string
      description: |
        Alert lifecycle action recorded in alert_logs.
        Action semantics worth noting:
          - escalation_exhausted: escalation reached its final step (no acknowledgement).
        Details payload varies by action:
          - policy_applied: {policy_id, policy_name} — one entry per policy that matched,
            in chain order. It records that a policy ran, NOT that it decided the outcome.
          - dropped: {terminal_policy_id, terminal_policy_name}
          - delayed: {silenced_until, reason: "hold_outside_window", terminal_policy_id,
            terminal_policy_name}
          - silence_applied, silenced by a silence window:
            {silence_id, silence_type, silenced_until, silence_reason?}
          - silence_applied, silenced by a policy: {silenced_until, source: "policy",
            terminal_policy_id, terminal_policy_name} — the source key is what tells the
            two shapes apart; the window shape never carries it.
          - severity_fallback: {raw_value, default_used}
          - note_added: {text}
          - other actions: no details
        terminal_policy_id / terminal_policy_name (cross-073) name the policy that actually
        ended evaluation, and only the terminal entry carries them. Read the culprit from
        there, never from the first policy_applied entry: any chain longer than one match
        makes that a guess. The name is stored alongside the id because the record must stay
        readable after the policy is renamed or deleted. Both keys are absent when the
        journal cannot attribute the status (drifted data) — treat their absence as
        "unattributed", not as "no policy involved".
        A silence_applied entry written for a live silence window never carries the terminal
        keys: when a policy hold and a silence window are both in force the window wins by
        contract, and the entry names what a human can cancel.
      enum:
        - created
        - acknowledged
        - unacknowledged
        - resolved
        - escalated_manually
        - escalated_auto
        - escalation_exhausted
        - silenced_expired
        - note_added
        - deduplicated
        - policy_applied
        - silence_applied
        - delayed
        - dropped
        - severity_fallback
    AlertLogActorType:
      type: string
      enum: [user, system, source]

    # --- Error schemas -------------------------------------------------------
    Error:
      type: object
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
    OrgAccessDeniedError:
      description: |
        Body of the two 403s that mean "you have lost access to this
        organization" (cross-089). Emitted only while resolving the `{slug}`
        segment, therefore possible on every route under
        `/api/v1/orgs/{slug}`.

        `code` is required here on purpose: a plain RBAC refusal inside an
        organization the caller DOES belong to carries no `code` at all
        (plain `Error`), and that absence is the only reliable way to tell the
        two situations apart. Never distinguish them by message text.

        Both codes call for the same client reaction — re-fetch the membership
        list and go to the organization picker, keeping the session — and are
        kept separate only so the interface can say which of the two happened.
        Concurrent 403s from one screen must collapse into a single
        navigation, not a redirect race.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
              enum: ['organization_not_member', 'organization_blocked', 'organization_closed']
              description: |
                * `organization_not_member` — the caller holds no membership
                  in this organization (never had one, or it was just
                  removed).
                * `organization_blocked` — a platform administrator blocked
                  the organization. The caller's other organizations and their
                  session are unaffected.
                * `organization_closed` — the owner closed the organization and
                  it is being dismantled (cross-096). The client reaction is the
                  same as for the other two, and it is a SEPARATE code purely
                  because the words a person is shown differ: a block is a
                  platform decision one asks support about, a closure is
                  permanent and there is nothing to ask for. Reusing
                  `organization_blocked` here would send people to support over
                  something support cannot undo.
    ActivateTrialConflictError:
      description: |
        Returned with HTTP 409 by `POST /orgs/{slug}/activate-trial` when the
        trial cannot be activated (cross-058). The `code` discriminator lets the
        UI branch: `not_on_free_plan` — the org is already on Trial/Pro (hide the
        Start-trial CTA); `no_trial_credits` — the caller has no trial credits
        left (`users.trial_credits == 0`).
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
              enum: [not_on_free_plan, no_trial_credits]
    TransferOwnershipConflictError:
      description: |
        Returned with HTTP 409 by `POST /orgs/{slug}/transfer-ownership`
        (api-004) when the handover did not happen. The `code` says why:

        * `cannot_transfer_to_self` — `new_owner_id` is the caller. The caller
          already owns the organization; nothing was changed.
        * `new_owner_unavailable` — the chosen member has lost access to the
          product and must not be given the organization. **One code covers two
          server-side states on purpose** (api-082): a platform ban and a
          deactivated account are not distinguishable from inside an
          organization, because the platform's decision about one person must
          not leak to another tenant.
        * `owner_already_changed` — ownership moved between the moment this
          request read the organization and the moment it wrote: a concurrent
          transfer won. Nothing was changed; re-fetch the members list. The
          server has two independent ways of noticing this (the conditional
          demote of the caller matching no row, and the uniqueness of the owner
          role refusing the promote) and they deliberately share ONE code —
          which mechanism caught the race is not something a client can act on.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
              enum: [new_owner_unavailable, owner_already_changed, cannot_transfer_to_self]
    CloseOrganizationConflictError:
      description: |
        Returned with HTTP 409 by `DELETE /orgs/{slug}` (cross-096) when the
        organization was NOT closed. Nothing changed in either case, and the two
        are told apart by `code` — never by the message text:

        * `organization_has_other_members` — somebody besides the owner is still
          a member. `details.remaining_members` is how many people that is,
          EXCLUDING the owner, so `1` means one other person. The field name is
          part of the contract rather than an implementation detail: the type
          generator checks the shape of a payload, not the meaning of its keys,
          so a client reading `count` or `members_count` would simply find
          nothing and show no number.
        * `organization_paid_plan` — the organization's current plan is `pro`.
          It carries NO `details`. The plan turns `free` by itself once the
          subscription lapses (at once for a cancelled Pro, after the seven-day
          grace for a renewing one); during that grace the answer is this same
          code and not a different one. There is no self-service downgrade —
          where to send the person is the client's decision, not the server's.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
              enum: [organization_has_other_members, organization_paid_plan]
            details:
              type: object
              description: >-
                Present only with `organization_has_other_members`. Flat scalar
                keys, no nesting.
              properties:
                remaining_members:
                  type: integer
                  description: >-
                    How many members remain besides the owner. At least 1
                    whenever this code is returned.
    InviteRegistrationError:
      description: |
        Returned by `POST /auth/register` when the supplied `invite_token`
        cannot be used (cross-076). One envelope for the whole family; the
        status tells the caller which member it is, and the `code` repeats it
        machine-readably:

        | `code`               | HTTP | Meaning                                                                 |
        |----------------------|------|-------------------------------------------------------------------------|
        | `invite_invalid`     | 400  | Unknown or non-pending token, or the submitted `email` does not match the invite's address. The two are deliberately indistinguishable — a distinguishable mismatch would turn this public endpoint into an oracle for the invited address. |
        | `invite_expired`     | 410  | The invite is past its expiry.                                          |
        | `invite_org_blocked` | 403  | The organization that issued the invite has been blocked by a platform admin, so it can no longer sponsor a registration. |

        All three are recoverable the same way: the person may resubmit the very
        same form WITHOUT `invite_token` and register on their own, provided
        `GET /auth/signup-status` reports signup as allowed. Clients MUST gate
        that offer on an allowlist of these three codes, never on "any failure
        that is not X": a blacklisted address is rejected with a generic,
        code-less 400 precisely so it cannot be told apart from other failures,
        and a denylist would end up offering the banned caller a way around the
        ban.

        This is deliberately NOT the org-access 403 `organization_blocked`
        (`OrgAccessDeniedError`): the caller is addressing no organization at
        registration time, and that response drives "refresh memberships and
        go to the organization picker" — a flow that must not fire on a
        registration form, where there is no membership list and no picker.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
              enum: [invite_invalid, invite_expired, invite_org_blocked]
    QuotaExceededError:
      description: |
        Returned with HTTP 403 when a service-layer pre-create quota check
        rejects a mutation (cross-029). The `code` discriminator is the
        primary signal for clients; `details` carries the resource name and
        the numeric usage at the time of rejection so the UI can render a
        precise banner without parsing the human-readable message.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, details]
          properties:
            message:
              type: string
              example: quota exceeded
            code:
              type: string
              enum: [quota_exceeded]
            details:
              type: object
              required: [resource, limit, used]
              properties:
                resource:
                  type: string
                  description: |
                    Stable identifier of the quota that was hit. Mirrors the
                    `resource` argument to `quotas.Check` in the Go code —
                    examples include `integrations`, `silences`, `policies`,
                    `members`, `pending_invites`, `notification_channels`,
                    `phone_channels` (api-039 commit 6, per-(user, org)
                    plan-driven cap on sip channels), `organizations`,
                    `teams`, `escalation_policies`, `schedules`, `rotations`.
                limit:
                  type: integer
                  description: The configured cap. Always > 0 (a 0/negative
                    cap is treated as unlimited and would not produce a 403).
                used:
                  type: integer
                  description: The current usage at the time of rejection.
    PaidSeatsExceededError:
      description: |
        Returned with HTTP 403 by the per-seat gate (cross-059) when a paid Pro
        organization is already at its paid seat ceiling and another member
        would be added (admin-create user / invite / accept-invite). Distinct
        from `QuotaExceededError` (`quota_exceeded`): the org is on a paid plan
        and must add seats, not upgrade — so the UI must NOT show an "Upgrade to
        Pro" toast. On beta (Free/Trial, `paid_seats=null`) this error never
        occurs. `details.members` is the live member count; `details.paid_seats`
        is the paid ceiling.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, details]
          properties:
            message:
              type: string
              example: paid seat ceiling reached — add seats to add another member
            code:
              type: string
              enum: [paid_seats_exceeded]
            details:
              type: object
              required: [paid_seats, members]
              properties:
                paid_seats:
                  type: integer
                  description: The paid seat ceiling at the time of rejection.
                members:
                  type: integer
                  description: The current member count at the time of rejection.
    IntegrationHasOpenAlertsError:
      description: |
        Returned with HTTP 409 by DELETE integration (api-127) when the
        integration still has OPEN alerts — `firing`, `acknowledged`,
        `silenced` or `delayed`. Those are incidents the operator has not
        finished with, and deleting the integration under them would hide where
        they came from while they are still being worked on.

        CLOSED alerts (`resolved`, `dropped`) are NOT a reason to refuse: the
        row does not go away on deletion anyway. The deletion marks the
        integration, every reader loses sight of it at once, and the row is
        removed later by the retention worker, once the last alert that
        referenced it has been collected.

        Nothing was changed by the rejected call. `details.open_alert_count` is
        the number of OPEN alerts counted at the moment of rejection; it is a
        snapshot, not a live figure.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, details]
          properties:
            message:
              type: string
              description: >-
                Human-readable refusal naming the count, which matches
                `details.open_alert_count`. Do not parse it; key off `code` and
                `open_alert_count`.
              example: integration has 3 open alerts and cannot be deleted
            code:
              type: string
              enum: [integration_has_open_alerts]
            details:
              type: object
              required: [open_alert_count]
              properties:
                open_alert_count:
                  type: integer
                  description: >-
                    Number of OPEN alerts (firing, acknowledged, silenced,
                    delayed) referencing this integration at the time of
                    rejection.
    ChannelDuplicateError:
      description: |
        Returned with HTTP 409 when POST notification-channels would create a
        duplicate of an existing channel in the same org for the same user,
        type and target (enforced by UNIQUE index
        `uq_notification_channels_org_user_type_target` added in migration
        000016 — cross-038).
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: notification channel already exists for this org, user, type and target
            code:
              type: string
              enum: [channel_duplicate]
    ChannelNotVerifiedError:
      description: |
        Returned with HTTP 409 when POST /test targets a channel that requires
        verification (email, telegram) but has not been verified yet
        (cross-041). Testing an unverified target would deliver a real message
        to an address the user has not proven ownership of — the user must
        complete the verification flow first.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: notification channel is not verified
            code:
              type: string
              enum: [channel_not_verified]
    PhoneInvalidError:
      description: |
        Returned with HTTP 400 when POST notification-channels rejects a sip
        target during the static-validation ladder (api-039 commit 6). One
        machine-readable code (`phone_invalid`) covers three distinct failure
        modes; the precise reason lives in `error.details.reason` so the UI
        can render targeted copy without parsing the human-readable message:

          * `format` — target does not match the E.164 RU regex
            `^\+7\d{10}$`. Surfaced for: missing leading `+`, leading `8`
            instead of `+7`, non-digit characters, length mismatch.
          * `country` — leading country code maps to a country outside the
            configured allowlist (closed beta = RU-only via
            `IG_VOICE_ALLOWED_COUNTRIES=RU`).
          * `premium_prefix` — RU NSN prefix (first 3 digits after `+7`)
            matches the configured premium-rate blacklist
            (`IG_VOICE_BLOCKED_PHONE_PREFIXES`, default `809,803,805`).
            These prefixes route to paid-services / scam numbers and would
            charge the platform per call.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, details]
          properties:
            message:
              type: string
              example: phone number must be in E.164 format starting with +7
            code:
              type: string
              enum: [phone_invalid]
            details:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [format, country, premium_prefix]
                  description: |
                    Discriminator for the rejection cause. `format` —
                    E.164 regex miss; `country` — country code not in the
                    allowlist; `premium_prefix` — NSN prefix on the
                    premium-rate blacklist.
    PhoneRateLimitedError:
      description: |
        Returned with HTTP 429 when POST notification-channels trips the
        sip-specific sliding-window rate limit (api-039 commit 6, voice-
        channel-design.md § 4.8 Layers 3 + 4). Distinct from the generic
        per-user create-channel bucket: the sip-specific limits count
        UNIQUE phones per window and tolerate duplicate submissions
        (UI re-submit of the same target does not consume budget).

          * `scope="user"` — Layer 3, default 2 unique phones per user
            per hour (`IG_RATE_LIMIT_VOICE_VERIFY_PER_USER`).
          * `scope="ip"` — Layer 4, default 5 unique phones per IP per
            hour (`IG_RATE_LIMIT_VOICE_VERIFY_PER_IP`). The IP is taken
            after the global trusted-XFF middleware; "0.0.0.0" / empty
            IP degrades silently to "Layer 4 skipped".

        Per `voice/channel_guards.go` reserve-then-rollback semantics,
        a sip CreateChannel that fails the Layer 1 quota check rolls back
        the sliding-window reservation so the caller does not burn budget
        on a downstream failure.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, details]
          properties:
            message:
              type: string
              example: 'phone rate limit: scope=user retry_after=1h0m0s'
            code:
              type: string
              enum: [phone_rate_limited]
            details:
              type: object
              required: [scope, retry_after_seconds]
              properties:
                scope:
                  type: string
                  enum: [user, ip]
                  description: |
                    Identifies which sliding window was exhausted. UIs
                    swap copy between "you have reached your per-user phone
                    add limit" and "another user on this network reached the
                    per-IP limit".
                retry_after_seconds:
                  type: integer
                  minimum: 1
                  description: |
                    Wall-clock seconds before the next attempt may succeed.
                    Mirrors the `Retry-After` response header (rounded
                    seconds, floor 1).
    VoiceResendTooSoonError:
      description: |
        Returned with HTTP 429 when POST /send-verification on a sip
        channel is invoked inside the 60-second resend cooldown window
        (api-039 commit 7). The endpoint emits the same response on
        every retry inside the window; clients must wait `Retry-After`
        seconds (mirror of `details.retry_after_seconds`) before
        attempting again. The cooldown is hardcoded to 60s (not a
        plan / config tunable) — it is part of the user-facing UX
        contract, see voice-channel-design.md § 4.10.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, details]
          properties:
            message:
              type: string
              example: 'verification code was just sent; retry after cooldown'
            code:
              type: string
              enum: [voice_resend_too_soon]
            details:
              type: object
              required: [retry_after_seconds]
              properties:
                retry_after_seconds:
                  type: integer
                  enum: [60]
                  description: |
                    Wall-clock seconds before the next /send-verification
                    call may succeed. Hardcoded to 60 — matches the
                    Retry-After response header. UIs SHOULD render a
                    countdown rather than expose the raw seconds.
    ResendTooSoonError:
      description: |
        Returned with HTTP 429 when POST /resend-verification on an
        email/telegram channel is invoked inside the 60-second resend
        cooldown window (cross-041). The window arms on every code send,
        including the auto-send that fires on channel create — so the first
        resend within 60s of creating the channel also gets this response.
        Clients must wait `Retry-After` seconds (mirror of
        `details.retry_after_seconds`) before attempting again. The cooldown
        is hardcoded to 60s — same UX contract as the sip
        `voice_resend_too_soon` counterpart.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code, details]
          properties:
            message:
              type: string
              example: 'verification code was just sent; retry after cooldown'
            code:
              type: string
              enum: [resend_too_soon]
            details:
              type: object
              required: [retry_after_seconds]
              properties:
                retry_after_seconds:
                  type: integer
                  enum: [60]
                  description: |
                    Wall-clock seconds before the next /resend-verification
                    call may succeed. Hardcoded to 60 — matches the
                    Retry-After response header. UIs SHOULD render a
                    countdown rather than expose the raw seconds.
    InvalidBotTokenError:
      description: |
        Returned with HTTP 422 by PUT /orgs/{slug}/telegram-bot when the
        supplied Telegram bot token is invalid (cross-050). One
        machine-readable code (`invalid_bot_token`) covers two failure modes
        — a malformed token (fails the `^\d+:[A-Za-z0-9_-]{30,}$` format gate
        before any outbound call) and a well-formed token that Telegram
        `getMe` rejected (revoked / wrong / unknown bot). UIs key on the code
        to render "check the token from @BotFather".
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: invalid Telegram bot token
            code:
              type: string
              enum: [invalid_bot_token]
    TelegramBotNotConfiguredError:
      description: |
        Returned with HTTP 422 by POST notification-channels when a `telegram`
        channel is requested but the organization has not connected its own
        Telegram bot (cross-050). Members cannot receive Telegram
        notifications until an `org_admin` / `org_owner` connects a bot via
        `PUT /orgs/{slug}/telegram-bot`. UIs key on the code to surface "ask
        an admin to connect the org Telegram bot first".
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: organization Telegram bot is not configured
            code:
              type: string
              enum: [telegram_bot_not_configured]
    ChannelTypeNotSupportedError:
      description: |
        Returned with HTTP 422 by POST notification-channels when the requested
        channel type cannot be created through this generic endpoint (api-099).
        Today the only such type is `push`, and the reason is the shape of the
        resource rather than a missing backend: a push channel is addressed to
        the account's DEVICES, not to a target string this endpoint could take,
        and it is created together with its verified state by its own managed
        endpoint (`POST /orgs/{slug}/me/push-channel`, api-103). A channel
        created here would carry the constant target and no device at all.
        `push` deliberately remains a legal `NotificationChannelType`. UIs key
        on the code to hide the type from the channel-type picker.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: channel type cannot be created through this endpoint
            code:
              type: string
              enum: [channel_type_not_supported]
    ValidationErrorBody:
      type: object
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string

    # --- Domain entities -----------------------------------------------------
    Organization:
      type: object
      required: [id, name, slug, timezone, plan, features, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
        plan:
          $ref: '#/components/schemas/PlanInfo'
        features:
          $ref: '#/components/schemas/OrganizationFeatures'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PlanInfo:
      type: object
      description: |
        Minimal plan summary exposed to organisation members (cross-035).
        Read-only — admin UI changes plan via `/admin/subscriptions/{id}` PATCH.
      required: [name, display_name]
      properties:
        name:
          type: string
          enum: [free, trial, pro]
          description: |
            System plan name. `free` is the default terminal plan (voice off);
            `trial` is the credit-activated Pro-lite plan (voice on, Free-level
            capacity — an org lands on it via `POST /orgs/{slug}/activate-trial`,
            cross-058); `pro` is the paid per-seat plan (activates after payments).
        display_name:
          type: string
          description: Human-readable plan label (rendered in UI).

    OrganizationFeatures:
      type: object
      description: |
        Plan-level feature flags exposed to organisation members (cross-035).
        Returned alongside Organization in the same response to avoid race
        flash between Organization load and org-usage load. `additionalProperties:
        false` enforces a typed contract — new feature keys require an OpenAPI
        change.
      additionalProperties: false
      properties:
        sso:
          type: boolean
          description: Single sign-on enabled (placeholder; v1.0+).
        mfa:
          type: boolean
          description: Multi-factor authentication enabled (placeholder; v1.0+).
        voice:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              description: Voice channel (SIP) enabled for this plan.
            severity_levels:
              type: array
              items:
                type: string
                enum: [critical, warning]
              description: Severity levels allowed for voice dispatch.
            allowed_countries:
              type: array
              items:
                type: string
                pattern: '^[A-Z]{2}$'
              description: ISO-3166 alpha-2 country codes allowed for voice destination.

    TelegramBotStatus:
      type: object
      description: |
        Connection status of the organization's own Telegram bot (BYO,
        cross-050). **The bot token is never present in this object** — it is a
        write-only secret stored encrypted at rest. Only the public
        `bot_username` (used to build `t.me/<username>` deep-links) and the
        non-sensitive `bot_id` / `updated_at` are exposed. When `configured` is
        `false` the three optional fields are `null`.
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether the organization has a Telegram bot connected.
        bot_username:
          type: ['string', 'null']
          description: |
            The bot's public username (without `@`). Public information —
            anyone can open `t.me/<bot_username>`. `null` when no bot is
            configured.
        bot_id:
          type: ['integer', 'null']
          format: int64
          description: |
            Telegram numeric bot id (the part before `:` in the token).
            `null` when no bot is configured.
        updated_at:
          type: ['string', 'null']
          format: date-time
          description: When the bot was last connected or replaced. `null` when no bot is configured.

    MobilePushEndpoint:
      type: object
      description: |
        The device's current push delivery address, as far as a client is
        allowed to see it (api-102).

        **The provider token is never present here**, in any form: neither the
        raw token nor its hash. Both are bearer secrets — the token is stored
        only as an encrypted envelope and the hash is a fingerprint of it. This
        object carries only routing facts.
      required: [provider, environment, last_registered_at]
      properties:
        provider:
          $ref: '#/components/schemas/MobilePushProvider'
        environment:
          $ref: '#/components/schemas/MobileEnvironment'
        last_registered_at:
          type: string
          format: date-time
          description: When this address was last (re-)registered by the device.

    MobileInstallation:
      type: object
      description: |
        One mobile device of the caller (api-102). The device identity is
        chosen by the client and survives push-token rotation, which the
        operating system performs without the user's involvement.
      required:
        - id
        - platform
        - environment
        - app_id
        - app_version
        - build_number
        - os_version
        - device_model
        - device_label
        - permission_status
        - critical_alert_status
        - status
        - push_endpoint
        - push_address_absence_reason
        - last_seen_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated installation identifier.
        platform:
          $ref: '#/components/schemas/MobilePlatform'
        environment:
          $ref: '#/components/schemas/MobileEnvironment'
        app_id:
          type: string
          description: Application bundle / package identifier reported by the client.
        app_version:
          type: string
          description: Marketing version of the app. Empty when not reported.
        build_number:
          type: string
          description: Build number of the app. Empty when not reported.
        os_version:
          type: string
          description: |
            Operating-system version — device-matrix diagnostics, not a device
            fingerprint. Empty when not reported.
        device_model:
          type: string
          description: |
            Device model as the operating system reports it ("Pixel 8",
            "iPhone 15 Pro") — the CLASS of device, never an instance of one.
            Empty when not reported.
        device_label:
          type: string
          description: |
            Human-chosen name of this device, shown wherever two handsets of
            one person have to be told apart. Empty when the person has not
            named it.
        permission_status:
          $ref: '#/components/schemas/MobilePermissionStatus'
        critical_alert_status:
          oneOf:
            - $ref: '#/components/schemas/MobileCriticalAlertStatus'
            - type: 'null'
          description: |
            iOS critical-alert entitlement state. `null` on platforms where the
            concept does not exist, or when the client did not report it.
        status:
          $ref: '#/components/schemas/MobileInstallationStatus'
        push_endpoint:
          oneOf:
            - $ref: '#/components/schemas/MobilePushEndpoint'
            - type: 'null'
          description: |
            The device's active delivery address, or `null` when it has none.
            `null` is the readiness signal: this phone currently cannot be
            paged. It is always present as a key — "absent" and "known to have
            no address" must not collapse into one shape.

            A device registered without a push token has `null` here from the
            moment it is created; `push_address_absence_reason` below says why.
        push_address_absence_reason:
          oneOf:
            - $ref: '#/components/schemas/MobilePushAddressAbsenceReason'
            - type: 'null'
          description: |
            Why this device has no delivery address, or `null` when the client
            did not say — `null` is NOT a member of the enumeration, it is the
            absence of a statement. It is also `null` whenever an address is
            present: the field describes an absence, so keeping a stale reason
            next to a live `push_endpoint` would be a lie.
        last_seen_at:
          type: string
          format: date-time
          description: Last time the device registered or refreshed itself.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegisterMobileInstallationRequest:
      type: object
      description: |
        Body of `PUT /api/v1/me/mobile-installations/{id}` (api-102). The
        installation identifier travels in the path, not here.

        **No field of this body may carry an identifier bound to the hardware
        or to the operating-system installation** — IDFV / IDFA, `ANDROID_ID`,
        serial numbers, advertising identifiers. Such a value turns a
        descriptive string into a device fingerprint, whose processing has
        neither a purpose nor a legal basis here. The server sees a string and
        cannot tell the two apart, so this is a rule for the client, not a
        check: send the CLASS of device, never the instance.
      required:
        - platform
        - environment
        - app_id
        - permission_status
      properties:
        platform:
          $ref: '#/components/schemas/MobilePlatform'
        environment:
          $ref: '#/components/schemas/MobileEnvironment'
        provider:
          allOf:
            - $ref: '#/components/schemas/MobilePushProvider'
          description: |
            Transport of the address in `push_token`. Optional and atomic with
            it — send both or neither.

            An explicitly sent `null` is treated exactly like an omitted field.
            The type stays non-nullable deliberately: declaring `null` here
            would make every generated client model the field as nullable, and
            on the mobile client a nullable value inside a set the app always
            sends back would become indistinguishable from an unset one — an
            ambiguity bought for a shape that never occurs on the successful
            path.
        push_token:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            The push address issued by the operating system / provider SDK.
            **Write-only bearer secret**: it is stored encrypted at rest,
            compared only through a hash, and is never returned by any
            endpoint, logged, or used as a metric label.

            An explicitly sent `null` is treated exactly like an omitted field;
            the type stays non-nullable for the reason given on `provider`.

            `provider` and `push_token` are OPTIONAL and ATOMIC: send both or
            neither. Sending neither registers the device with no delivery
            address — the normal outcome when the person refused notifications
            or the handset has no push transport — and `minLength: 1` is what
            says the remaining half: a field may be absent, but a field that is
            present may not be empty. "Absent" and "present and empty" are
            different statements by the client, and collapsing them would turn
            a serialisation bug into silently lost pages under a green
            "device registered".
        app_id:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Application bundle / package identifier. Stored for routing and
            diagnostics; it is not yet cross-checked against provider
            credentials — that check arrives with the provider adapter.
        app_version:
          type: string
          maxLength: 32
        build_number:
          type: string
          maxLength: 32
        os_version:
          type: string
          maxLength: 64
          description: |
            Operating-system version for device-matrix diagnostics. Send a
            coarse version, not a device fingerprint.
        device_model:
          type: string
          maxLength: 64
          description: |
            Device model as the operating system reports it ("Pixel 8",
            "iPhone 15 Pro"). It names the CLASS of device and distinguishes
            DIFFERENT handsets of one person.

            **Never an identifier of this particular handset or of this
            operating-system installation** — see the schema description. A
            model string is a class; IDFV, `ANDROID_ID` and a serial number are
            instances, and they do not belong in any field of this body.
        device_label:
          type: string
          maxLength: 64
          description: |
            A name the PERSON gave this device, which is what distinguishes two
            IDENTICAL handsets — the case the model alone cannot separate, and
            the one that matters in the irreversible revoke dialog.

            The operating system is not a source for it: since iOS 16 the
            user-chosen device name is not handed to apps at all.

            The client must send the value back as it read it. This endpoint is
            the ONLY writer of the field, and the client rewrites the whole
            body on every re-registration, so a second writer elsewhere would
            silently overwrite the person's rename on the device's next call.

            Free text the OWNER types, which through the device description
            reaches the delivery history OTHER members of the organization
            read: it is narrowed by a positive character whitelist at that one
            point, not here — on their own device list the owner must see their
            own text.
        permission_status:
          $ref: '#/components/schemas/MobilePermissionStatus'
        critical_alert_status:
          oneOf:
            - $ref: '#/components/schemas/MobileCriticalAlertStatus'
            - type: 'null'
          description: |
            iOS critical-alert entitlement state. Nullable, mirroring the read
            model: the server accepts an explicit `null` and treats it exactly
            like an omitted field — "this axis does not apply to the device, or
            the client did not report it". A client holding one nullable field
            for the value must be able to send it back as it read it.
        push_address_absence_reason:
          oneOf:
            - $ref: '#/components/schemas/MobilePushAddressAbsenceReason'
            - type: 'null'
          description: |
            Why the client is registering without a push token. It is stored
            only while the device really has no address: a registration that
            brings one — or that finds one already on the device — clears it in
            the same act, because a reason kept beside a live address would lie
            about the very endpoint next to it.

            Nullable and omittable, mirroring the read model — `null` means
            "the client did not say" and is not a member of the enumeration.

    MobileInstallationNotFoundError:
      description: |
        Returned with HTTP 404 by every mobile-installation endpoint that takes
        an identifier. One answer covers a malformed identifier, an unknown one
        and one owned by another user — see the response description.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: mobile installation not found
            code:
              type: string
              enum: [installation_not_found]

    MobileInstallationConflictError:
      description: |
        Returned with HTTP 409 by `PUT /api/v1/me/mobile-installations/{id}`.
        Two distinct situations share the status and are separated by
        `error.code`, so clients must switch on the code rather than on the
        message.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: maximum number of registered devices reached; revoke one first
            code:
              type: string
              enum: [installation_revoked, installation_limit_reached]

    PushReadinessOrganization:
      type: object
      description: |
        Push readiness of ONE organization the caller belongs to (api-103).
        Identity fields are carried so the client can render the row without a
        second call to `GET /api/v1/me/organizations`.
      required: [id, name, slug, availability, channel_status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: |
            The path segment of the per-organization endpoints, e.g.
            `POST /api/v1/orgs/{slug}/me/push-channel`.
        availability:
          $ref: '#/components/schemas/OrgAvailability'
        channel_status:
          $ref: '#/components/schemas/PushChannelStatus'

    PushReadiness:
      type: object
      description: |
        The two axes of "will a page reach me" (api-103): the caller's ready
        devices, counted once for the whole account, and the push-channel state
        of each organization they belong to.

        The axes are independent. `ready_installations: 0` with every
        organization `ready` means the configuration is complete and no phone
        will ring; the reverse means the phones are fine and no organization
        will send.
      required: [ready_installations, organizations]
      properties:
        ready_installations:
          type: integer
          minimum: 0
          description: |
            Devices of this account that are registered, still hold a delivery
            address, and report the notification permission as `authorized`.
            iOS `provisional` is excluded: such notifications arrive silently
            and would not wake anybody.

            Stricter than the device limit of
            `PUT /api/v1/me/mobile-installations/{id}`, which ignores the
            reported permission — a device may hold a place and still not be
            counted here.
        organizations:
          type: array
          description: |
            Every organization the caller belongs to, ordered by name (the
            order of `GET /api/v1/me/organizations`). `[]` when the account
            belongs to none — an ordinary state, since devices survive leaving
            an organization.
          items:
            $ref: '#/components/schemas/PushReadinessOrganization'

    PushChannelTestRequest:
      type: object
      description: |
        Optional body of `POST /api/v1/orgs/{slug}/me/push-channel/test`
        (api-106). An absent body, an empty object and an explicit
        `installation_id: null` all mean the same thing: send the test to every
        ready device of the caller.
      properties:
        installation_id:
          type: ['string', 'null']
          format: uuid
          description: |
            Narrows the test to ONE device — in practice the handset the mobile
            client is running on, the only one whose result answers "does the
            pager on THIS phone work". Omit it, or send `null`, to test every
            ready device of the caller.

            A device that is not ready, does not exist, or belongs to somebody
            else is refused with `422 push_no_ready_device`; the three are not
            told apart on purpose (see the endpoint's `422`).

    PushChannelTestResult:
      type: object
      description: |
        The outcome for ONE device (api-106). Every field is always present —
        `reason` is an explicit empty string on success, never an absent key,
        so "no reason" and "reason not reported" cannot collapse into the same
        shape on the client.
      required: [installation_id, device, outcome, reason]
      properties:
        installation_id:
          type: string
          format: uuid
          description: |
            The device this entry is about — the identifier of
            `GET /api/v1/me/mobile-installations`.
        device:
          type: string
          description: |
            Human-readable name of the device, snapshotted when the test was
            sent. It is the same string that goes into the `target` of a
            delivery row, so a test result and the alert delivery history name
            one handset identically.

            Never empty: the person's own label for the handset is used when
            there is one, otherwise the reported model, otherwise the platform
            and OS version. A client may show it as it stands and does not need
            a placeholder of its own.
        outcome:
          $ref: '#/components/schemas/PushChannelTestOutcome'
        reason:
          type: string
          description: |
            A bounded, safe code explaining a non-`accepted` outcome; an empty
            string when the outcome is `accepted`. NEVER the transport's own
            response text — that text is written by a third party, is not
            bounded, and tells the person holding the phone nothing. As with
            `outcome`, an unrecognised value must be shown as raw text rather
            than dropped.

    PushChannelTestNotReadyError:
      description: |
        Body of the `422` from
        `POST /api/v1/orgs/{slug}/me/push-channel/test` (api-106): there is
        nothing to send the test to. `code` splits the refusal along the axis
        that decides where the person goes next — the organization's push
        setting, or the phone in their hand. The message says which case of the
        two it is; never branch on the message text.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: no ready device to send the test push to
            code:
              type: string
              enum: [push_channel_not_ready, push_no_ready_device]

    PushProviderNotConfiguredError:
      description: |
        Body of the `503` from
        `POST /api/v1/orgs/{slug}/me/push-channel/test` (api-106): the platform
        cannot use its push transport. A state of the platform, not of the
        tenant and not of any device — which is why it fails the whole call
        instead of appearing as a per-device outcome, exactly as an
        unconfigured SMTP sender does.

        Two codes share this status because they are two different jobs for
        whoever reads the answer, and collapsing them would tell an operator
        whose key expired to configure a key they already configured:

        * `push_provider_not_configured` — no push credentials are stored at
          all. The normal state of a platform before an operator pastes a key.
        * `push_provider_credentials_rejected` — credentials ARE stored and the
          transport refused them: expired, revoked, or issued for a project
          that no longer accepts them.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
              example: push provider is not configured
            code:
              type: string
              enum: [push_provider_not_configured, push_provider_credentials_rejected]

    TelegramBotConnectRequest:
      type: object
      required: [bot_token]
      properties:
        bot_token:
          type: string
          pattern: '^\d+:[A-Za-z0-9_-]{30,}$'
          description: |
            Telegram bot token from `@BotFather` (e.g.
            `123456789:AA...`). Write-only — validated via the Telegram
            `getMe` API and never returned by any endpoint. The format is
            checked server-side before any outbound call; a malformed token
            is rejected with `422 invalid_bot_token` without contacting
            Telegram.

    User:
      type: object
      description: |
        A platform ACCOUNT. Carries nothing that depends on an organization:
        `org_role` and `position_id` were removed in cross-089 because they
        describe a membership, not an account — the same person is
        `org_owner` in one organization and `org_member` in another, so a
        role without an organization beside it has no meaning at all. Read
        them from `OrgMembership` (your own membership, from
        `GET /api/v1/me/organizations` or the login response) or from
        `OrganizationMember` (somebody else's, from the members list).
      required: [id, email, first_name, last_name, is_active, must_change_password, email_verified_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        email_verified_at:
          type: ['string', 'null']
          format: date-time
          description: |
            Null if email not yet verified. Always present: every producer of
            this schema writes it without `omitempty`, and "unverified" and
            "not returned" are different answers.
        timezone:
          type: ['string', 'null']
          description: |
            IANA timezone for UI date formatting. Null = fallback to org timezone.

            NOT in `required`, and that is a fact about the producers rather
            than a drift: the account paths (`/me`, the auth envelope) always
            emit it, but `TeamMember.user` and `OnCallUser.user` are built from
            a leaner Go type that has no timezone field at all, so the key is
            absent there. Declaring it required would make this schema promise
            what two of its four users never send.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationMember:
      type: object
      description: |
        A person INSIDE one organization: the account fields plus the role and
        the position that this organization gave them. Returned by the members
        list and the member card of `/api/v1/orgs/{slug}/members*` (cross-089).

        There is no membership status field here, and one must not be added:
        `org_members` holds a role and a position and nothing else — the row
        either exists or it was removed. `is_active` below is an ACCOUNT flag
        (platform-level), not a state of the membership.

        Distinct from `OrgMembership`, which describes the CALLER's own
        membership and is keyed by organization, not by person.
      required: [id, email, first_name, last_name, org_role, position_id, is_active, must_change_password, email_verified_at, timezone, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Account id of the member.
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        org_role:
          allOf:
            - $ref: '#/components/schemas/OrgRole'
          description: |
            Role in THIS organization. Never null — a membership row without a
            role does not exist.
        position_id:
          type: ['string', 'null']
          format: uuid
          description: |
            Position in THIS organization, or `null` when none is assigned.
            Positions are reference data and grant no permissions.
        is_active:
          type: boolean
          description: |
            Account-level flag, not a membership state. An organization cannot
            change it (cross-075).
        must_change_password:
          type: boolean
          description: Account-level flag, not a membership state.
        email_verified_at:
          type: ['string', 'null']
          format: date-time
          description: |
            Null if email not yet verified. Always present: "unverified" and
            "not returned" are different answers, so the field is `required`
            and its Go counterpart must not carry `omitempty`.
        timezone:
          type: ['string', 'null']
          description: |
            IANA timezone of the account. Null = fallback to org timezone.
            Always present, for the same reason as `email_verified_at`.
        created_at:
          type: string
          format: date-time
          description: When the ACCOUNT was created.
        updated_at:
          type: string
          format: date-time
          description: When the ACCOUNT was last updated.

    OrgMembership:
      type: object
      description: |
        The CALLER's own membership in one organization. Returned by
        `GET /api/v1/me/organizations`, by every session answer that carries
        `AuthResponse.data.memberships` (login, register,
        initial-password-change and refresh) and by the two endpoints that
        create a membership (`POST /api/v1/orgs`,
        `POST /api/v1/auth/accept-invite`).

        Since cross-089 this is the client's index of the whole interface: the
        organization picker, the role gate and the "can I even open this
        address" question are all answered from this list, so it carries the
        role, the position and the organization's status. Clients must
        re-fetch it on events (focus regained, entering the picker, creating
        or joining or leaving an organization, and any org-scoped 403) rather
        than caching it from login for the life of the session — a stale list
        renders permissions the person no longer has.

        `org_status` is the status of the ORGANIZATION. There is no membership
        status: the row exists or it does not.
      required: [org_id, org_name, org_slug, org_role, position_id, org_status]
      properties:
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        org_slug:
          type: string
          description: |
            The address segment. Every org-scoped route is `/api/v1/orgs/{slug}/…`;
            the slug is immutable (there is no API to change it).
        org_role:
          allOf:
            - $ref: '#/components/schemas/OrgRole'
          description: |
            The caller's role in this organization. Never null — a membership
            row without a role does not exist. Was nullable before cross-089,
            which was a drift from the Go type (a non-pointer string), not a
            real state.
        position_id:
          type: ['string', 'null']
          format: uuid
          description: The caller's position in this organization, `null` when unassigned.
        org_status:
          allOf:
            - $ref: '#/components/schemas/OrganizationStatus'
          description: |
            Status of the organization. A `blocked` entry is shown greyed out
            and non-clickable in the picker; requests to its address answer
            `403 organization_blocked`. Blocking one organization does not end
            the session or affect the others.

    Invite:
      type: object
      required: [id, org_id, email, org_role, invited_by, expires_at, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        org_role:
          allOf:
            - $ref: '#/components/schemas/OrgRole'
          description: |
            The role the invitee gets on acceptance. Never null and never
            absent — the Go field is a plain string with no `omitempty`, so
            the wire always carries a value. The previous nullable+optional
            declaration was drift from the type, not a real state (cross-089
            fixed the same drift on `OrgMembership` and the membership row).
        invited_by:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: ['string', 'null']
          format: date-time
        status:
          type: string
          enum: [pending, accepted, invalidated, expired]
          description: |
            Authoritative invite lifecycle state. Source of truth for accept/resend gates
            after cross-035; `accepted_at`/`expires_at` are kept for backward compat and forensics.
            - `pending` — the invite is valid and can be accepted
            - `accepted` — it was accepted (`accepted_at` set)
            - `invalidated` — cancelled manually. The automatic setter (the subscription
              downgrade hook) was removed in cross-057; a downgraded organization keeps
              its pending invites and the members quota is re-checked on accept.
            - `expired` — lifecycle-marked expired (cleanup-worker territory; v1+)
        created_at:
          type: string
          format: date-time

    Position:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ['string', 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Team:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ['string', 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TeamMember:
      type: object
      required: [user_id, team_role]
      properties:
        user_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        team_role:
          $ref: '#/components/schemas/TeamRole'

    TeamDetail:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/TeamMember'

    Schedule:
      type: object
      required: [id, name, team_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ['string', 'null']
        team_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Rotation:
      type: object
      required: [id, schedule_id, name, type, length, start_date, participants, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/RotationType'
        length:
          type: integer
          minimum: 1
        start_date:
          type: string
          format: date-time
        end_date:
          type: ['string', 'null']
          format: date-time
        time_restriction:
          $ref: '#/components/schemas/TimeRestriction'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RotationParticipant'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RotationParticipant:
      type: object
      required: [id, participant_type, position]
      properties:
        id:
          type: string
          format: uuid
        participant_type:
          $ref: '#/components/schemas/ParticipantType'
        user_id:
          type: ['string', 'null']
          format: uuid
        team_id:
          type: ['string', 'null']
          format: uuid
        position:
          type: integer

    TimeRestriction:
      type: ['object', 'null']
      description: |
        Restriction on when a rotation is active. Only `type=weekday_and_time` is
        supported: the rotation is active during specified hours on specified days
        (weekly-periodic, evaluated in UTC — cross-049). Time outside every window
        means nobody is on-call for that rotation at that moment.
        Rules:
        - The windows of one rotation **must not overlap** each other. A seam where
          one window ends exactly as the next begins (`{… → Mon 09:00}` followed by
          `{Mon 09:00 → …}`) is legal — windows are half-open `[start, end)`.
        - When `start_day == end_day` the range must be same-day forward: `end_time`
          (end_hour:end_min) must be strictly **after** `start_time`
          (start_hour:start_min). A single-day overnight window (`start_day ==
          end_day` with `end_time <= start_time`, e.g. Monday 22:00 → Monday 06:00)
          is rejected with 400. Express overnight on-call with different days
          instead (e.g. `start_day=monday`, `end_day=tuesday`).
        - `hourly` rotations **cannot** carry a `time_restriction` (a sub-day window
          on an ≤ 1h bucket is meaningless); such a combination is rejected with 400.
        - At most **20** windows per rotation. Like every other rule stated here,
          this is a WRITE rule: it judges the `time_restriction` a client sends on
          create, update or preview, never a stored row read back.
      properties:
        type:
          type: string
          enum: [weekday_and_time]
        restrictions:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              start_hour:
                type: integer
              start_min:
                type: integer
              end_hour:
                type: integer
              end_min:
                type: integer
              start_day:
                type: string
                enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
              end_day:
                type: string
                enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

    Override:
      type: object
      required: [id, schedule_id, start_date, end_date, created_at]
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        user_id:
          type: ['string', 'null']
          format: uuid
          description: "User who takes over. Null = nobody on call for this period."
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        rotation_id:
          type: ['string', 'null']
          format: uuid
          description: Scope override to specific rotation. Null = all rotations.
        created_at:
          type: string
          format: date-time

    ScheduleDetail:
      allOf:
        - $ref: '#/components/schemas/Schedule'
        - type: object
          required: [rotations, overrides]
          properties:
            rotations:
              type: array
              items:
                $ref: '#/components/schemas/Rotation'
            overrides:
              type: array
              items:
                $ref: '#/components/schemas/Override'

    EscalationPolicy:
      type: object
      required: [id, name, team_id, steps, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ['string', 'null']
        team_id:
          type: string
          format: uuid
        steps:
          type: array
          items:
            $ref: '#/components/schemas/EscalationStep'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EscalationStep:
      type: object
      required: [id, position, target_type, activation_offset_minutes]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        target_type:
          $ref: '#/components/schemas/EscalationTargetType'
        schedule_id:
          type: ['string', 'null']
          format: uuid
        user_id:
          type: ['string', 'null']
          format: uuid
        team_id:
          type: ['string', 'null']
          format: uuid
        activation_offset_minutes:
          type: integer
          minimum: 0
          description: >
            Absolute activation offset in minutes from escalation start (t=0).
            The step pages its recipient when this many minutes of active
            (un-acknowledged) escalation time have elapsed. Steps are ordered by
            this offset; the server sorts them.

    Integration:
      type: object
      required: [id, name, type, team_id, escalation_policy_id, severity_mapping, api_key_prefix, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/IntegrationType'
        team_id:
          type: string
          format: uuid
        escalation_policy_id:
          type: string
          format: uuid
        severity_mapping:
          $ref: '#/components/schemas/SeverityMapping'
        api_key_prefix:
          type: string
          description: First characters of the API key for identification
        settings:
          type: ['object', 'null']
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IntegrationCreated:
      allOf:
        - $ref: '#/components/schemas/Integration'
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: Full API key (shown only once)

    Alert:
      type: object
      required: [id, integration_id, status, severity, title, fingerprint, group_key, instance_count, acknowledged_by, acknowledged_at, escalation_policy_id, dedup_count, created_at, updated_at, hold]
      properties:
        id:
          type: string
          format: uuid
        integration_id:
          type: string
          format: uuid
        team_id:
          type: ['string', 'null']
          format: uuid
          description: Team that owns this alert (snapshot from integration)
        status:
          $ref: '#/components/schemas/AlertStatus'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        title:
          type: string
        description:
          type: ['string', 'null']
        source:
          type: ['string', 'null']
        fingerprint:
          type: string
          description: Informational field for debugging. Not used for dedup (see group_key).
        group_key:
          type: string
          description: Dedup key. For AM batches, sha256 of sorted groupLabels. For generic/Zabbix, dedup_key or sha256 of labels.
        instance_count:
          type: integer
          description: Number of alert instances in the batch. For generic webhooks, always 1.
        instances_preview:
          type: ['array', 'null']
          description: First 50 alert instances from the AM batch (labels, annotations, value each).
          items:
            $ref: '#/components/schemas/AlertInstancePreview'
        labels:
          type: ['object', 'null']
        annotations:
          type: ['object', 'null']
        details:
          type: ['object', 'null']
        acknowledged_by:
          type: ['string', 'null']
          format: uuid
          description: >
            Id of the user who acknowledged the alert, `null` while nobody has.
            Always present on the wire (api-117): a client that compares it with
            its own user id must be able to tell "somebody else acknowledged
            this" from "the value is unknown", and an absent key collapses the
            two into a false "somebody else".
        acknowledged_at:
          type: ['string', 'null']
          format: date-time
          description: >
            When the alert was acknowledged, `null` while nobody has. Always
            present on the wire — see `acknowledged_by`.
        resolved_at:
          type: ['string', 'null']
          format: date-time
        resolved_by:
          type: ['string', 'null']
          format: uuid
        silenced_until:
          type: ['string', 'null']
          format: date-time
          deprecated: true
          description: >
            **Deprecated (api-084).** The value is unchanged, but it never meant
            what its name suggests and now says so: it is the boundary of the
            holder that was in force at ingest, not the moment the alert wakes
            up. Another holder may take over at that very instant, and the
            configuration behind it may have been edited since. Read `hold`
            instead — it is computed live on every read and answers whether
            anything is holding the alert now, what that is, and where that
            holder's grip ends. The column is dropped in a later release.
        hold:
          type: ['object', 'null']
          description: >
            Live projection of "is anything holding this alert back right now"
            (api-084). Computed on every read and stored nowhere, so it always
            reflects the CURRENT silence windows and integration policies rather
            than a decision frozen at ingest.


            The field is always present. It is `null` for every status outside
            `silenced` / `delayed` — the question does not apply there — and an
            object otherwise. It is never omitted: absence and `state: unknown`
            must stay distinguishable.
          required: [state, reason, next_boundary_at]
          properties:
            state:
              type: string
              enum: [held, pending_release, unknown]
              description: >
                `held` — a holder was found; `reason` and `next_boundary_at`
                describe it. `pending_release` — nothing holds the alert any
                more and the next sweep will wake it; the stored `status` simply
                has not caught up yet. `unknown` — the answer could not be
                computed (drifted policy data, an unreadable scope); the request
                still succeeds, because reading the alert list matters more than
                knowing why one row is asleep, but the client must show that the
                cause is unknown rather than imply there is none.
            reason:
              type: ['object', 'null']
              description: >
                The single holder responsible, chosen by a fixed priority — a
                live matching silence window wins over a holding policy rule,
                because `silenced` promises the on-call engineer that a human
                can lift the suppression. Present only when `state` is `held`.
              required: [kind, id, name]
              properties:
                kind:
                  type: string
                  enum: [silence, policy]
                id:
                  type: string
                  format: uuid
                  description: Silence id or integration-policy id, per `kind`.
                name:
                  type: string
                  description: >
                    Silence reason (may be empty) or policy name, per `kind`.
            next_boundary_at:
              type: ['string', 'null']
              format: date-time
              description: >
                End of THIS holder's grip — **not** a promise of wake-up. A
                window until 08:00 in front of a rule until 09:00 reports 08:00,
                and at 08:00 the alert does not wake: the rule takes over.
                Present only when `state` is `held`.
        escalation_policy_id:
          type: string
          format: uuid
        dedup_count:
          type: integer
        last_dedup_at:
          type: ['string', 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertInstancePreview:
      type: object
      description: A single alert instance from an AM batch, included in instances_preview.
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        value:
          type: string

    AlertEscalationState:
      type: object
      required: [id, alert_id, policy_id, current_step, escalation_anchor, is_exhausted]
      properties:
        id:
          type: string
          format: uuid
        alert_id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        current_step:
          type: integer
          description: >
            Number of escalation steps already paged — a count, not an index
            into the step list. 0 means no step has been paged yet. Updating
            the policy rebuilds the ladder without touching this counter, so
            the next page is taken by this number from the new ladder.
        escalation_anchor:
          type: string
          format: date-time
          description: >
            Effective t=0 anchor for the escalation timeline. Each step's
            activation_offset_minutes is measured from this instant.
        ack_step:
          type: ['integer', 'null']
        is_exhausted:
          type: boolean

    AlertDetail:
      allOf:
        - $ref: '#/components/schemas/Alert'
        - type: object
          properties:
            escalation_state:
              description: Null if the alert did not start escalation (e.g. delayed/silenced/dropped).
              oneOf:
                - $ref: '#/components/schemas/AlertEscalationState'
                - type: 'null'

    AlertLog:
      type: object
      required: [id, alert_id, action, actor_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        alert_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/AlertLogAction'
        actor_type:
          $ref: '#/components/schemas/AlertLogActorType'
        actor_id:
          type: ['string', 'null']
          format: uuid
        details:
          $ref: '#/components/schemas/AlertLogDetails'
        created_at:
          type: string
          format: date-time

    AlertLogDetails:
      type: ['object', 'null']
      description: >
        The UNION of every key any `alert_logs.details` payload can carry — a
        superset across all actions, not the shape of any single entry. Which
        keys are actually present is decided by the entry's `action` and is
        spelled out per action in `AlertLogAction.description`.


        No key here is guaranteed. Every property is optional, several actions
        write no details at all (the whole object is then `null`), and a key may
        be absent even for an action that usually writes it — the terminal
        `terminal_policy_*` pair, for instance, is skipped when the journal
        cannot attribute the status. A reader MUST check for presence before
        using a value and MUST NOT infer the entry's shape from its `action`
        alone. Additional keys may appear in future actions, so unknown ones are
        to be ignored rather than treated as an error.


        This schema exists so the payload has names and formats at all — it
        replaces an untyped `object`, which generated a type with no members and
        forced every consumer to hand-maintain a shadow contract in casts. It is
        deliberately NOT a discriminated union: the per-action shapes are
        documented prose, not a machine-checked contract, and modelling them as
        `oneOf` would promise a guarantee the writer does not make.
      properties:
        policy_id:
          type: string
          format: uuid
          description: '`policy_applied`: the policy that ran (one entry per match, in chain order).'
        policy_name:
          type: string
          description: '`policy_applied`: name of the policy that ran, at the time it ran.'
        terminal_policy_id:
          type: string
          format: uuid
          description: >
            `dropped` / `delayed` / `silence_applied`-by-policy: the policy that
            ENDED evaluation. Never written by a `policy_applied` entry, and
            never by a `silence_applied` entry produced by a live silence
            window.
        terminal_policy_name:
          type: string
          description: >
            Name of the terminal policy, stored alongside its id so the entry
            stays readable after the policy is renamed or deleted.
        source:
          type: string
          description: >
            `silence_applied`: `"policy"` when the alert was put to sleep by a
            policy hold. The window-produced shape never carries this key, so it
            is the discriminator between the two — fork on this key being
            PRESENT, never on `silence_type` being absent.
        reason:
          type: string
          description: '`delayed`: why the alert was held — `"hold_outside_window"` today.'
        silenced_until:
          type: string
          format: date-time
          description: >
            `delayed` / `silence_applied`: the boundary of the holder in force
            AT INGEST — a historical fact, not a wake-up time. Whether the alert
            is still held, and until when, is answered live by `Alert.hold`.
        silence_id:
          type: string
          format: uuid
          description: '`silence_applied` by a silence window: the matching silence.'
        silence_type:
          type: string
          description: '`silence_applied` by a silence window: `manual` or `maintenance`.'
        silence_reason:
          type: string
          description: >
            `silence_applied` by a silence window: the human-entered reason.
            Absent when the silence carries none.
        raw_value:
          type: string
          description: >
            `severity_fallback`: the source value that matched no mapping rule.
            Written on EVERY `severity_fallback` entry, alongside `default_used`
            — the two are marshalled from one map, so neither is ever absent
            when the other is present. When the value could not be read at all
            (no `source_field` configured, the field missing from the payload,
            or an unparseable `severity_mapping`) the key carries the EMPTY
            STRING rather than disappearing: emptiness here means "there was
            nothing to map", never "no fallback happened".
        default_used:
          type: string
          description: '`severity_fallback`: the default severity applied instead.'
        text:
          type: string
          description: '`note_added`: the note body, untruncated.'
        step_number:
          type: integer
          minimum: 1
          description: The 1-based escalation step that was evaluated.
        target_type:
          type: string
          enum: [on_call_schedule, user, team]
          description: The configured target kind. Absent for an unknown target kind.
        target_id:
          type: string
          format: uuid
          description: The target identifier. Absent when the target is outside the readable team scope.
        resolved_users:
          type: integer
          minimum: 0
          description: Users selected by target resolution before delivery gates.
        paged_users:
          type: integer
          minimum: 0
          description: Unique users with at least one registered delivery request.
        delivery_requests:
          type: integer
          minimum: 0
          description: Registered delivery addressees, including voice compaction and push device fan-out.
        unreached_reasons:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            type: string
            enum:
              - no_one_on_duty
              - target_not_eligible
              - recipient_cannot_sign_in
              - no_matching_rules
              - no_deliverable_channels
              - delivery_refused
          description: Bounded reasons why some or all resolved users received no registered delivery.

    NotificationChannel:
      type: object
      required: [id, type, target, is_enabled, is_verified, verification_pending, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationChannelType'
        target:
          type: string
        is_enabled:
          type: boolean
        is_verified:
          type: boolean
        verification_pending:
          type: boolean
          description: True if a verification code has been sent and is awaiting confirmation.
        verification_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the current verification code expires. Null if no code is pending.
        config:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            Reserved for future per-channel settings (e.g. HMAC secret, custom headers).
            Currently always null. Not writable via the API.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserNotificationRule:
      type: object
      required: [id, event_type, channel_id, position, delay_minutes]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/NotificationEventType'
        channel_id:
          type: string
          format: uuid
        position:
          type: integer
        delay_minutes:
          type: integer
          minimum: 0

    OnCallUser:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
        rotation_id:
          type: ['string', 'null']
          format: uuid
          description: Which rotation placed this user on call. Null if from override.

    # --- My on-call picture (api-116) ----------------------------------------

    MyNextShiftShift:
      type: object
      required: [state, value]
      description: |
        The caller's next shift was found inside the horizon.
      properties:
        state:
          type: string
          enum: ['shift']
        value:
          type: object
          required: [schedule_id, schedule_name, starts_at, ends_at, is_override]
          properties:
            schedule_id:
              type: string
              format: uuid
            schedule_name:
              type: string
            starts_at:
              type: string
              format: date-time
              description: |
                Start of the shift. Always strictly LATER than the moment of
                the request — see `MyNextShift` for what this field does and
                does not promise.
            ends_at:
              type: string
              format: date-time
              description: |
                End of that shift, as the schedule actually has it. It may lie
                beyond the horizon: the horizon decides which shift is
                reported, never where it ends. Clipping this to the horizon
                would be a silent lie about the length of a duty.
            is_override:
              type: boolean
              description: |
                True when the shift comes from a covering override rather than
                from the rotation's normal turn.

    MyNextShiftNoShift:
      type: object
      required: [state, value]
      description: |
        No shift of the caller starts inside the horizon. A content-bearing
        answer, not missing data — the client renders "nothing scheduled this
        week", which is a different sentence from "we could not tell".
      properties:
        state:
          type: string
          enum: ['no_shift']
        value:
          type: object
          required: [horizon_ends_at]
          properties:
            horizon_ends_at:
              type: string
              format: date-time
              description: |
                The far edge of the window that was searched — the sentence
                "no shift" is only true up to this instant.

    MyNextShift:
      oneOf:
        - $ref: '#/components/schemas/MyNextShiftShift'
        - $ref: '#/components/schemas/MyNextShiftNoShift'
      discriminator:
        propertyName: state
        mapping:
          shift: '#/components/schemas/MyNextShiftShift'
          no_shift: '#/components/schemas/MyNextShiftNoShift'
      description: |
        The caller's next shift across every schedule in scope, as a
        discriminated union on `state` — never a set of optional fields, so
        "no shift" cannot be confused with "field absent".

        **It is strictly the NEXT shift: one that STARTS after the moment of
        the request.** A shift already running is not reported here — the
        question "when does my current shift end" is deliberately NOT answered
        by this endpoint. "Am I on call right now" is answered by
        `on_call_schedule_ids`.

        The search horizon is seven days from the moment of the request and is
        fixed; `no_shift` carries its far edge so the client can say what the
        answer covers.

    MyOnCallSchedule:
      type: object
      required: [schedule_id, schedule_name, team_id, team_name, on_call_users, my_override]
      description: |
        One schedule of the caller's teams, with who is on call in it right
        now. Present whether or not the caller is among them: the screen has to
        be able to say "you are not on call — these people are".
      properties:
        schedule_id:
          type: string
          format: uuid
        schedule_name:
          type: string
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
        on_call_users:
          type: array
          description: |
            Everybody on call in this schedule at the moment of the request —
            the same set the per-schedule endpoint returns for the same moment.
            More than one is normal (a team holds the slot, or several
            rotations are active at once) and the order expresses no priority.
            `[]` means nobody is on call here, which is an ordinary state (a
            gap, an empty slot, a moment outside every rotation's window).
          items:
            $ref: '#/components/schemas/OnCallUser'
        my_override:
          oneOf:
            - $ref: '#/components/schemas/Override'
            - type: 'null'
          description: |
            The override that is covering the CALLER in this schedule right
            now, or `null` when none is. Overrides covering somebody else are
            not reported here — they are already visible through
            `on_call_users`.

    MyOnCall:
      type: object
      required: [is_team_member, on_call_schedule_ids, schedules, next_shift]
      description: |
        The caller's on-call picture in one organization (api-116).
      properties:
        is_team_member:
          type: boolean
          description: |
            Whether the caller belongs to at least one team of this
            organization. NOT derivable from `schedules`: a team with no
            schedules yields an empty list at an existing membership, and the
            two states need different words on the screen ("no schedules yet"
            versus "you are in no team — join one on the web").
        on_call_schedule_ids:
          type: array
          description: |
            The schedules in which the CALLER is on call right now. `[]` means
            "not on call anywhere", and that is the whole of the "am I on call"
            answer — there is no separate boolean to disagree with it. Every id
            here also appears in `schedules`.
          items:
            type: string
            format: uuid
        schedules:
          type: array
          description: |
            Every schedule of every team the caller belongs to, ordered by
            name. `[]` with `is_team_member: true` means the teams have no
            schedules; `[]` with `is_team_member: false` means there are no
            teams.
          items:
            $ref: '#/components/schemas/MyOnCallSchedule'
        next_shift:
          $ref: '#/components/schemas/MyNextShift'

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token TTL in seconds

    # --- Request schemas -----------------------------------------------------
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name, accepted_versions]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        invite_token:
          type: string
          maxLength: 255
          description: |
            Optional invite token, copied verbatim from the invite link
            (`/invite/accept?token=…`). It is a bearer of elevated rights, not a
            hint: a valid token bypasses the `auth.allow_self_signup` flag and
            marks the address verified immediately (no verification email is
            sent, so registration does not depend on a live SMTP service). It
            never bypasses the platform email blacklist.

            The `email` field MUST equal the invite's address. Any problem with
            the token (unknown, non-pending, expired, address mismatch, blocked
            inviting organization) rejects the registration outright — the
            request is never silently downgraded to a plain self-signup. See
            `InviteRegistrationError` for the failure codes.

            Omit the field for ordinary self-registration.
        accepted_versions:
          type: array
          description: |
            Legal-document versions the user agreed to in the registration form.
            Every document with `requires_acceptance=true` AND `is_active=true`
            AND a published active version MUST appear here with the matching
            active `version` label. The server validates the submission inside
            the user-creation transaction; missing required documents return
            `400 legal_acceptance_required` with the pending list, a stale
            version label returns `400` with the standard error envelope.
            May be an empty array when no required documents exist server-side.
          items:
            $ref: '#/components/schemas/LegalAcceptanceSubmission'

    LegalAcceptanceSubmission:
      type: object
      description: |
        One (slug, version) pair acknowledging acceptance of the active
        version of a legal document. Used by `RegisterRequest`.
      required: [slug, version]
      properties:
        slug:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Document slug (e.g. "terms", "consent").
          example: terms
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: Active version label echoed back from the document.
          example: "1.1"

    LoginRequest:
      type: object
      description: |
        cross-089 removed `org_id`: logging in no longer selects an
        organization, because a session is not bound to one. The response
        carries `memberships`, and the client navigates to
        `/api/v1/orgs/{slug}/…`.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8

    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        timezone:
          type: ['string', 'null']
          maxLength: 50
          description: IANA timezone (e.g. Europe/Moscow). Null to clear.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    InitialPasswordChangeRequest:
      type: object
      description: |
        Payload for the forced first-login password change. Only `new_password`
        is accepted — the server trusts the bearer token as proof of the old
        (temporary) password and will reject any other fields.
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: New password chosen by the user. Must be at least 8 characters long.
          example: "S3cure!NewPass"

    AcceptLegalRequest:
      type: object
      description: |
        Payload for `POST /api/v1/auth/accept-legal`. The version label MUST
        match the document's current `active_version_id`; submitting a stale
        label returns 400 `stale_version`.
      required: [slug, version]
      properties:
        slug:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Document slug (e.g. "terms", "consent").
          example: terms
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: Active version label (echoed back in the response).
          example: "1.1"

    LegalAcceptanceRequiredError:
      type: object
      description: |
        Error envelope returned by gated routes (status 403) when the user
        has not yet accepted one or more documents marked
        `requires_acceptance=true`. Frontends key on `error.code` and render
        an acceptance modal sequence using `error.details.pending`.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [legal_acceptance_required]
            message:
              type: string
              example: Please accept updated legal documents to continue
            details:
              type: object
              required: [pending]
              properties:
                pending:
                  type: array
                  description: Documents the user must accept (ordered by position).
                  items:
                    $ref: '#/components/schemas/PendingLegalAcceptance'

    StaleVersionError:
      type: object
      description: |
        Error envelope returned by POST /auth/register with status 400 when a
        required legal document's active version changed between the moment the
        form was rendered and the moment it was submitted (a race against an admin
        publishing a new version). Frontends key on `error.code` to prompt the
        user to reload the form and re-accept the new version. Unlike
        LegalAcceptanceRequiredError this envelope carries NO `details` — the
        stale-version condition is a bare race signal with no per-document
        list; the client re-fetches the active document set on reload.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [stale_version]
            message:
              type: string
              example: legal document version is stale

    PendingLegalAcceptance:
      type: object
      description: One document the user must accept to continue.
      required: [slug, title, current_version, change_summary]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
        current_version:
          type: string
          description: Active version label the user must accept.
        change_summary:
          type: string
          description: |
            Admin-authored summary of what changed in the active version, so
            the frontend can show "what's new" copy in the acceptance modal.

