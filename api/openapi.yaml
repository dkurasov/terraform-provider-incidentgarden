    TransferOwnershipRequest:
      type: object
      description: |
        Body of `POST /orgs/{slug}/transfer-ownership` (api-004). The organization
        comes from `{slug}` and the outgoing owner from the token, so the only
        thing left to say is who receives it.

        There is deliberately no field for the caller's own new role: the former
        owner always becomes `org_admin`. Wanting to be a plain `org_member`
        afterwards is one ordinary `PATCH /members/{userId}` away, made by the
        new owner — and the safer polarity is the one where somebody who
        mis-clicked still has the rights to ask for the organization back.
      required: [new_owner_id]
      properties:
        new_owner_id:
          type: string
          format: uuid
          description: >-
            The member of `{slug}` who becomes `org_owner`. Must not be the
            caller (409 `cannot_transfer_to_self`).

    CloseOrganizationRequest:
      type: object
      description: |
        Body of `DELETE /orgs/{slug}` (cross-096). Its only field repeats the
        slug that is already in the path, and the redundancy IS the feature: it
        turns an irreversible action into one that cannot be triggered by a
        mis-click on the wrong row of a list.

        A password was considered and rejected. The main contour has no
        re-authentication step of any kind, and the only attacker such a step
        would stop — somebody holding a live session — can already delete every
        integration and empty every escalation policy of this organization.
      required: [slug]
      properties:
        slug:
          type: string
          description: >-
