            $ref: '#/components/schemas/UnacknowledgedItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    UnacknowledgedReportResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UnacknowledgedReport'

    NotificationFailureErrorAgg:
      type: object
      required: [error_message, count]
      properties:
        error_message:
          type: string
        count:
          type: integer

    NotificationFailureChannel:
      type: object
      required: [channel_type, total, errors]
      properties:
        channel_type:
          type: string
        total:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/NotificationFailureErrorAgg'

    NotificationFailureSummary:
      type: object
      required: [total_failed, period]
      properties:
        total_failed:
          type: integer
        period:
          $ref: '#/components/schemas/ReportPeriod'

    NotificationFailuresReport:
      type: object
      required: [by_channel, summary]
      properties:
        by_channel:
          type: array
          items:
            $ref: '#/components/schemas/NotificationFailureChannel'
