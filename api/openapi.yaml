    RotationPreview:
      type: object
      description: >
        The shift pattern of ONE unsaved rotation. Overrides and the schedule's
        other rotations are not part of it.
      required: [intervals, effective_from, truncated_by]
      properties:
        intervals:
          type: array
          maxItems: 16
          description: >
            In chronological order. An "interval" is not a shift: a
            `time_restriction` window splits a shift, so one shift can produce
            several intervals, and `maxItems` above therefore does not promise
            that many handovers.
          items:
            $ref: '#/components/schemas/RotationPreviewInterval'
        effective_from:
          type: string
          format: date-time
          description: >
            The instant the enumeration started from — `max(now, start_date)`.
            The first interval may have begun BEFORE it (see `ongoing`).
        truncated_by:
          type: ['string', 'null']
          enum: [end_date, calendar_limit, null]
          description: >
            Why fewer than 16 intervals came back, or `null` when the full 16
            did. `end_date` — the rotation ends. `calendar_limit` — the walk
            reached the end of the supported calendar (2100-01-01); a weekly
            rotation of length 365 hits it about 112 years out, which is a
            diagnosis of the configuration rather than an error.


            When both would apply, `end_date` wins: a domain boundary outranks
            running out of calendar.


            Always present and never omitted: "the field is absent" and "we
            returned everything" must not collapse into one answer on the wire.

    RotationPreviewInterval:
      type: object
      required: [participant_index, participant_type, team_has_members, start, end, ongoing]
      properties:
        participant_index:
          type: integer
          description: >
            Index into the `participants` array that was SENT. The name of the
            person or team is not repeated here — the client that sent the array
            already has it.
        participant_type:
          $ref: '#/components/schemas/ParticipantType'
        team_has_members:
          type: ['boolean', 'null']
          description: >
            Whether that team's roster is non-empty. `null` exactly when
            `participant_type` is not `team`; `false` means the team has no
            members.


            It answers about the ROSTER, not about delivery: escalation
            additionally drops recipients who have lost access to the system
            (blocked or deactivated), so a team with members can still page
            nobody. This field does not promise otherwise.


            A boolean rather than a roster or a count on purpose: repeating a
            fifty-person team in each of sixteen intervals answers a question
            nobody asked. Always present and never omitted, for the same reason
            as `truncated_by`.
        start:
          type: string
          format: date-time
          description: >
            The interval's real start, NOT clipped to `effective_from`: an
            interval already running when the preview was asked for reports the
            instant it actually began, which is the only way to check the anchor
            while editing mid-shift.
        end:
          type: string
          format: date-time
          description: >
            The interval's real end, clipped only by the rotation's `end_date`.
        ongoing:
          type: boolean
          description: This interval started before `effective_from`.

