    # =========================================================================
    # Integration Policies
    # =========================================================================

    IntegrationPolicy:
      type: object
      required: [id, team_id, applies_to_all, name, position, is_active, conditions, actions, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
          description: The team that owns the policy (cross-047).
        integration_id:
          type: ['string', 'null']
          format: uuid
          description: >-
            Set only for a single-integration policy (`applies_to_all=false`);
            `null` when `applies_to_all=true`.
        applies_to_all:
          type: boolean
          description: >-
            When true the policy dynamically covers every integration of the
            owning team (incl. future ones) and `integration_id` is null;
            mutually exclusive with `integration_id` (XOR).
        name:
          type: string
        description:
          type: ['string', 'null']
        position:
          type: integer
        is_active:
          type: boolean
        conditions:
          $ref: '#/components/schemas/PolicyConditions'
        actions:
          type: array
          minItems: 1
          maxItems: 1
          description: >-
            A policy carries exactly one action (cross-079). Order and stopping
            of the policy chain are decided solely by that action's terminality:
            `drop` and `suppress` are terminal, `hold_outside_window` is terminal
            only while it actually holds, `override_severity` and `add_labels`
            are not and always pass evaluation on to the next policy. Composition
            is expressed by ordering several policies via `position`, never by
            several actions inside one. The array form is kept for contract
            stability; the length is fixed at one and enforced by the API, by the
            service layer and by a DB CHECK constraint.
          items:
            $ref: '#/components/schemas/PolicyAction'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PolicyConditions:
      type: object
      description: All present conditions must match (AND logic). Empty conditions = always match.
      properties:
        matchers:
          type: array
          items:
            $ref: '#/components/schemas/PolicyMatcher'
          description: >-
            Label matchers (Alertmanager model). All matchers must match (AND).
            An empty or absent list imposes no label condition.
        severity_in:
          type: array
          items:
            type: string
            enum: [critical, warning]
          description: Alert severity must be in this list (after severity_mapping).
        time_window:
          $ref: '#/components/schemas/PolicyTimeWindow'

    PolicyMatcher:
      type: object
      required: [key, op]
      description: >-
        A single label matcher (Alertmanager model). Semantics: a missing label
        key is treated as the empty string. `value` is required for `eq`/`neq`
        and must be omitted for `exists`/`notexists`.
      properties:
        key:
          type: string
          description: Label key to match against.
          example: env
        op:
          type: string
          enum: [eq, neq, exists, notexists]
          description: >-
            Match operator. `eq` — label equals value; `neq` — label differs from
            value (a missing key, treated as "", matches `neq "non-empty"`);
            `exists` — key is present (any value, incl. empty); `notexists` — key
            is absent.
        value:
          type: string
          description: >-
            Comparison value. Required for `eq`/`neq`; omitted for
            `exists`/`notexists`.
          example: production

    PolicyTimeWindow:
      type: object
      required: [start, end, days_of_week]
      properties:
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Start time in HH:MM format
          example: "22:00"
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: End time in HH:MM format (supports overnight, e.g. 22:00-03:00)
          example: "03:00"
        days_of_week:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
          description: ISO weekday numbers (1=Monday..7=Sunday)

    PolicyActionDrop:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [drop]
      description: Terminal action. Alert created with status=dropped.

    PolicyActionSuppress:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [suppress]
      description: Terminal action. Alert created with status=silenced.

    PolicyActionOverrideSeverity:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [override_severity]
        value:
          type: object
          required: [value]
          properties:
            value:
              type: string
              enum: [critical, warning]
      description: Non-terminal. Mutates alert severity.

    PolicyActionAddLabels:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [add_labels]
        value:
          type: object
          required: [labels]
          properties:
            labels:
              type: object
              additionalProperties:
                type: string
      description: Non-terminal. Merges additional labels into alert.

    PolicyActionHoldOutsideWindow:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [hold_outside_window]
        value:
          type: object
          required: [start, end, days_of_week]
          properties:
            start:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              description: Window start time in HH:MM format (UTC — cross-052/cross-049).
              example: "09:00"
            end:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              description: >-
                Window end time in HH:MM format (UTC). Supports overnight
                windows (e.g. 22:00-03:00), like PolicyTimeWindow.
              example: "18:00"
            days_of_week:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
              description: ISO weekday numbers (1=Monday..7=Sunday). Empty = every day.
      description: >-
        Conditionally terminal action (cross-052 П3). Holds an alert that
        arrives OUTSIDE the configured working window until the start of the next
        window occurrence — including across the weekend boundary (e.g. Fri
        19:00 → Mon 09:00). When the alert arrives INSIDE the window the action
        is NON-terminal and evaluation continues (the alert is delivered
        immediately). The window is interpreted as UTC; the frontend normalizes
        the operator's wall-clock input to UTC before sending. NB the polarity
        is the OPPOSITE of `suppress`: suppress silences alerts INSIDE its
        time_window (a quiet window), while this action delays alerts OUTSIDE its
        window (a working window).

    PolicyAction:
      oneOf:
        - $ref: '#/components/schemas/PolicyActionDrop'
        - $ref: '#/components/schemas/PolicyActionSuppress'
        - $ref: '#/components/schemas/PolicyActionOverrideSeverity'
        - $ref: '#/components/schemas/PolicyActionAddLabels'
        - $ref: '#/components/schemas/PolicyActionHoldOutsideWindow'
      discriminator:
        propertyName: type
        mapping:
          drop: '#/components/schemas/PolicyActionDrop'
          suppress: '#/components/schemas/PolicyActionSuppress'
          override_severity: '#/components/schemas/PolicyActionOverrideSeverity'
          add_labels: '#/components/schemas/PolicyActionAddLabels'
          hold_outside_window: '#/components/schemas/PolicyActionHoldOutsideWindow'
      description: |
        Policy action. Discriminated by `type` field:
        - drop/suppress: no value required, terminal
        - override_severity: value = {value: critical|warning}, non-terminal
        - add_labels: value = {labels: Record<string,string>}, non-terminal
        - hold_outside_window: value = {start, end, days_of_week}, conditionally
          terminal — terminal OUTSIDE the window, non-terminal INSIDE. Its grip
          ends at the next window start; that is the boundary of THIS rule's
          hold, not a promise that the alert wakes up then — another rule or a
          silence window may keep holding it past that point

    CreateIntegrationPolicyRequest:
      type: object
      required: [name, position, actions, team_id, applies_to_all]
      description: >-
        Scope is set by the `applies_to_all` / `integration_id` XOR pair: when
        `applies_to_all=true`, omit `integration_id` (or send null) — the policy
        covers every integration of `team_id`, including future ones; when
        `applies_to_all=false`, `integration_id` is required and must reference an
        integration belonging to `team_id`. Sending both, or neither, is rejected
        with 400.
      properties:
        team_id:
          type: string
          format: uuid
          description: The team that will own the policy.
        applies_to_all:
          type: boolean
          description: >-
            true → dynamically cover all integrations of the team (omit
            `integration_id`); false → cover the single `integration_id`.
        integration_id:
          type: ['string', 'null']
          format: uuid
          description: >-
            Required when `applies_to_all=false`; must be null/omitted when
            `applies_to_all=true`.
        name:
          type: string
          maxLength: 255
        description:
          type: ['string', 'null']
        position:
          type: integer
          minimum: 0
        conditions:
          $ref: '#/components/schemas/PolicyConditions'
        actions:
          type: array
          minItems: 1
          maxItems: 1
          description: >-
            Exactly one action (cross-079). Zero or two-and-more are refused with
            400.
          items:
            $ref: '#/components/schemas/PolicyAction'

    UpdateIntegrationPolicyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: ['string', 'null']
        position:
          type: integer
          minimum: 0
        is_active:
          type: boolean
        conditions:
          $ref: '#/components/schemas/PolicyConditions'
        actions:
          type: array
          minItems: 1
          maxItems: 1
          description: >-
            Replaces the whole array. Exactly one action (cross-079); the
            single stored action is swapped for the single supplied one.
          items:
            $ref: '#/components/schemas/PolicyAction'

    IntegrationPolicyDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/IntegrationPolicy'

    IntegrationPolicyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationPolicy'

    # -------------------------------------------------------------------------
    # Silences
    # -------------------------------------------------------------------------

    Silence:
      type: object
      required: [id, team_id, integration_id, matchers, starts_at, ends_at, type, created_by, created_at, parent_silence_id]
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
          description: Owning team. A silence is always owned by a team.
        integration_id:
          type: ['string', 'null']
          format: uuid
          description: >-
            Integration the silence is narrowed to. NULL means the silence
            applies to all integrations of the owning team, including future ones.
        matchers:
          type: object
          additionalProperties:
            type: string
          description: Label key=value pairs (AND matching). Empty object matches all alerts in scope.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        type:
          type: string
          enum: [manual, maintenance]
          description: Type of silence — manual (ad-hoc) or maintenance (planned work)
        reason:
          type: ['string', 'null']
          description: Optional reason for the silence
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        parent_silence_id:
          type: ['string', 'null']
          format: uuid
          description: |
            ID of the immediately preceding silence when this silence was created via POST /silences/{id}/replace.
            Forms an AlertManager-style chain — points to the directly preceding silence, not the chain root.
            NULL for original silences created via POST /silences.

    CreateSilenceRequest:
      type: object
      required: [team_id, starts_at, ends_at, type]
      properties:
        team_id:
          type: string
          format: uuid
          description: Owning team. Must belong to the caller's organization.
        integration_id:
          type: ['string', 'null']
          format: uuid
          description: >-
            Optional integration to narrow the silence to. Omit or send null to
            silence all integrations of the team (including future ones). When
            set, the integration must belong to team_id (otherwise 422).
        matchers:
          type: object
          additionalProperties:
            type: string
          description: Label key=value pairs for matching. Empty or omitted matches all alerts in scope.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        type:
          type: string
          enum: [manual, maintenance]
        reason:
          type: string

    UpdateSilenceRequest:
      type: object
      description: |
        Partial update of an in-place editable silence. AlertManager-style mutability matrix:
          - Pending silences: reason, ends_at, starts_at (if >= now) are editable in place.
          - Active silences: reason, ends_at (if >= now) are editable in place.
          - Expired silences: nothing is editable — server returns 400 with hint to use POST /silences/{id}/replace.
        Attempting to modify immutable fields (matchers, team_id, integration_id, type, or starts_at on active silence)
        returns 400 with hint to use POST /silences/{id}/replace. Smart client routing is expected to keep this
        contract a backend failsafe rather than a routine error path.
      additionalProperties: false
      properties:
        reason:
          type: ['string', 'null']
          description: Optional human-readable reason. Send null to clear.
        starts_at:
          type: string
          format: date-time
          description: Only editable for pending silences and only when the new value is >= now.
        ends_at:
          type: string
          format: date-time
          description: Editable for pending and active silences; must remain >= now and > starts_at.

    SilenceDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Silence'

    SilenceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Silence'

    # --- Legal documents (public) -------------------------------------------
    LegalDocumentSummary:
      type: object
      description: Slim shape returned by GET /api/v1/legal — no content_md.
      required: [slug, title, requires_acceptance, position, current_version, updated_at]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
        requires_acceptance:
          type: boolean
          description: When true, authenticated users must accept this document version.
        position:
          type: integer
          description: Display order (lower = earlier).
        current_version:
          type: string
          description: Active version label (e.g. "1.0", "2.1-rev").
        updated_at:
          type: string
          format: date-time
          description: Document last-update timestamp (metadata change, not version change).

    LegalDocumentPublic:
      type: object
      description: Active legal document with embedded current version content.
      required: [id, slug, title, requires_acceptance, is_active, position, created_at, updated_at, active_version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
        requires_acceptance:
          type: boolean
        is_active:
          type: boolean
        position:
          type: integer
        active_version_id:
          type: ['string', 'null']
          format: uuid
        active_version:
          $ref: '#/components/schemas/LegalDocumentVersion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LegalDocumentVersion:
      type: object
      description: Immutable version of a legal document.
      required: [id, document_id, version, content_md, change_summary, created_at]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        version:
          type: string
          description: Version label assigned at publish time (e.g. "1.0").
        content_md:
          type: string
          description: Document body in Markdown.
        change_summary:
          type: string
          description: Human-readable summary of what changed in this version.
        created_at:
          type: string
          format: date-time
        created_by:
          type: ['string', 'null']
          format: uuid
          description: Platform admin who published this version (null for system seed).
