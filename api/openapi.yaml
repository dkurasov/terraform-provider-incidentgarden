        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [notification-rules]
      summary: Replace all notification rules in this org
      description: |
        Replaces the entire set of notification rules for the current user within
        the given organization. All channel_id references in the request body must
        belong to the same (user, org) pair — cross-org channel refs return 404.
      operationId: replaceNotificationRules
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceNotificationRulesRequest'
      responses:
        '200':
          description: Rules replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRulesListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: |
            No organization has this `{slug}` (an organization closed to the
