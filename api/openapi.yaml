    BulkAcknowledgeRequest:
      type: object
      required: [alert_ids]
      properties:
        alert_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: >
            Alerts to acknowledge. The cap is set by the consumer, not by the
            mechanism: the number of SQL commands is constant in the length of
            this list, but the work the database does (locks held, rows written,
            response size) is linear in it. No client collects more than one
            page of a hundred ids in one gesture. `uniqueItems` is NOT enforced
            by this description — the server checks it separately, and duplicate
            ids are rejected rather than answered twice, because a client
            keying the outcomes by id would collapse the pair in silence.
          items:
            type: string
            format: uuid

    BulkAcknowledgeOutcome:
      type: string
      description: >
        What happened to one alert of the list. Five values, no more. The four
        statuses that cannot be acknowledged (`resolved`, `silenced`, `delayed`,
        `dropped`) get no words of their own — the alert's own status is already
        part of the contract and says which of them it is.
      enum:
        - acknowledged
        - already_acknowledged
        - not_acknowledgeable
        - forbidden
        - not_found

    BulkAcknowledgeResult:
      type: object
      description: >
        The outcome for ONE input id. Every field is always present; a field
        that does not apply to the outcome is an explicit `null`, never an
        absent key — otherwise "does not apply" and "could not be computed"
        collapse into the same shape on the client.
      required: [alert_id, outcome, status, acknowledged_by, acknowledged_at]
      properties:
        alert_id:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/BulkAcknowledgeOutcome'
        status:
          description: >
            The alert's status, present only where the alert was actually read
            under lock — i.e. for `acknowledged`, `already_acknowledged` and
            `not_acknowledgeable`. `not_found` has no status to report, and for
            `forbidden` disclosing one would leak more than today's `403` does.
          oneOf:
            - $ref: '#/components/schemas/AlertStatus'
            - type: 'null'
        acknowledged_by:
          type: ['string', 'null']
          format: uuid
          description: >
            Who holds the acknowledgement, for the two acknowledged outcomes;
            `null` for every other outcome. The client MUST compare it with its
            own user id: a repeat that succeeds silently is worse than an
            honest refusal if it hides somebody else's acknowledgement.


            An alert acknowledged before this field existed may carry `null`
            here while the outcome is `already_acknowledged` — the honest
            reading is "acknowledged, by whom is unknown", not "acknowledged by
            somebody else".
        acknowledged_at:
          type: ['string', 'null']
          format: date-time
          description: When the acknowledgement was recorded — see `acknowledged_by`.

    BulkAcknowledgeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [results]
          properties:
            results:
              type: array
              description: One entry per input id, in the order of the input ids.
              items:
                $ref: '#/components/schemas/BulkAcknowledgeResult'

