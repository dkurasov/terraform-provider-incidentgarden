  # ---------------------------------------------------------------------------
  # Escalation Policies
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/escalation-policies:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [escalation-policies]
      summary: List escalation policies
      description: >-
        Team-scoped (D3): org_admin / org_owner see all escalation policies in
        the organization; an org_member sees only policies of their own teams.
      operationId: listEscalationPolicies
      security:
        - BearerAuth: []
      parameters:
        - name: team_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPoliciesListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [escalation-policies]
      summary: Create escalation policy with steps
      description: "Access: org_admin, org_owner, or team_admin of the policy's team."
      operationId: createEscalationPolicy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEscalationPolicyRequest'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicyDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: |
            Either no organization has this `{slug}` (the resolver runs first;
            an organization that exists but is closed to the caller answers
            `403` with an `error.code` instead — see `OrgSlug`), or the
            `team_id` does not belong to the caller's organization (or does
            not exist). Message: "team not found". The team→org check runs before
            the permission check, so a team outside the caller's org is reported
            as not-found (anti-enumeration — indistinguishable from a missing
            team, uniform across roles) rather than as a permission error. A
            `team_id` that belongs to the caller's org but on which the caller
            lacks rights returns `403` instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Step target validation failed. Possible messages:
            - "step target not found in organization" — a step references a team, schedule, or user that either does not exist in the organization OR does not belong to the policy's team. A policy is always team-scoped, so every step target (team, on-call schedule, or user) must belong to that same team; a target that exists in a sibling team is rejected here (anti-enumeration — the same message and status are returned whether the target is absent or merely in another team).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/escalation-policies/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [escalation-policies]
      summary: Get escalation policy with steps
      operationId: getEscalationPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EscalationPolicyId'
      responses:
        '200':
          description: Policy with steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicyDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [escalation-policies]
      summary: Update escalation policy (replace steps)
      description: |
        Replaces the entire policy including all steps.
        Access: org_admin, org_owner, or team_admin of the policy's team.
      operationId: updateEscalationPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EscalationPolicyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEscalationPolicyRequest'
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicyDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: |
            Step target validation failed. Possible messages:
            - "step target not found in organization" — a step references a team, schedule, or user that either does not exist in the organization OR does not belong to the policy's team. A policy is always team-scoped, so every step target (team, on-call schedule, or user) must belong to that same team; a target that exists in a sibling team is rejected here (anti-enumeration — the same message and status are returned whether the target is absent or merely in another team).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [escalation-policies]
      summary: Delete escalation policy
      description: |
        Fails with 409 for either of two reasons, told apart by the message
        only (no `code` in the body), and split by who can clear the reference:
        the policy is still attached to an integration — repoint it — or alerts
        routed through it still reference it, which only alert retention
        clears. The second reason covers alerts of EVERY status: an ordinary
        `firing` / `acknowledged` / `resolved` alert holds the policy through
        both its own `escalation_policy_id` and the escalation state it left
        behind (nothing removes that state but deleting the alert), while
        `dropped` / `silenced` / `delayed` alerts never get a state and hold it
        through the column alone.
        Access: org_admin, org_owner, or team_admin of the policy's team.
      operationId: deleteEscalationPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EscalationPolicyId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

