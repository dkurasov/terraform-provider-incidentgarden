              schema:
                $ref: '#/components/schemas/IntegrationsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [integrations]
      summary: Create integration
      description: |
        Generates an API key. The full key is returned only in this response.
        Subsequent reads show only `api_key_prefix`.

        **Access:** org_admin, org_owner, or team_admin of the owning team.

        **Rate limit:** Per-organization bucket (cross-029,
        `IG_RATE_LIMIT_CREATE_INTEGRATION`, default 10/min). Other CRUD verbs
        on `/integrations` and `/integrations/{id}` do not consume this
        budget.
      operationId: createIntegration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '201':
          description: Integration created (includes full API key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationCreatedDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: |
            Business logic validation failed. Possible messages:
            - "escalation policy not found"
            - "escalation policy does not belong to this team"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/orgs/{slug}/integrations/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [integrations]
      summary: Get integration
      operationId: getIntegration
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: Integration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [integrations]
      summary: Update integration
      description: |
        Updates integration fields. The `type` field is immutable and cannot be changed.

        **Access:** org_admin, org_owner, or team_admin of the integration's team.
      operationId: updateIntegration
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationRequest'
      responses:
        '200':
          description: Integration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: |
            Business logic validation failed. Possible messages:
            - "escalation policy not found"
            - "escalation policy does not belong to this team"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [integrations]
      summary: Delete integration
      description: |
        Fails with 409 `integration_has_open_alerts` while the integration still
        has OPEN alerts (`firing`, `acknowledged`, `silenced`, `delayed`).
        CLOSED alerts (`resolved`, `dropped`) do not stand in the way, however
        many of them there are and however old they are.

        On success the integration is gone for every reader immediately: it
        disappears from the list and from every other read, its API key stops
        being accepted, and its integration policies and silences narrowed to it
        are removed. The database row itself is removed later, by the retention
        worker, once the last alert that referenced it has been collected — that
        is invisible from the API and there is no way to bring the integration
        back in the meantime.

        **Access:** org_admin, org_owner, or team_admin of the integration's team.
      operationId: deleteIntegration
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: |
            Open alerts still reference this integration (`code`
            = `integration_has_open_alerts`, `details.open_alert_count` = how
            many).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationHasOpenAlertsError'

  /api/v1/orgs/{slug}/integrations/{id}/regenerate-key:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [integrations]
      summary: Regenerate API key
      description: |
        Old key stops working immediately. New key returned only in this response.

        **Access:** org_admin, org_owner, or team_admin of the integration's team.
      operationId: regenerateIntegrationKey
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntegrationId'
      responses:
        '200':
          description: New API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationCreatedDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Integration Policies
  # ---------------------------------------------------------------------------

  /api/v1/orgs/{slug}/policies:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [integrations]
      summary: List integration policies
      description: >-
        Team-scoped (D3): org_admin / org_owner see all integration policies in
        the organization; an org_member sees only policies of their own teams.
        Optional `team_id` query filters to a single team. Ordered by team, then
        position.
      operationId: listIntegrationPolicies
      security:
        - BearerAuth: []
      parameters:
        - name: team_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationPolicyListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    post:
      tags: [integrations]
      summary: Create integration policy
      description: |
        Creates a new conditional policy owned by a team. The policy's scope is
        set by the `applies_to_all` / `integration_id` XOR pair (see
        `CreateIntegrationPolicyRequest`).

        **Access:** org_admin, org_owner, or team_admin of the policy's team
        (`team_id`).

        **Rate limit:** Per-organization bucket (cross-029,
        `IG_RATE_LIMIT_CREATE_POLICY`, default 10/min). PATCH/DELETE on
        `/policies/{id}` do not consume this budget.
      operationId: createIntegrationPolicy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationPolicyRequest'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationPolicyDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: |
            Either no organization has this `{slug}` (the resolver runs first;
            an organization that exists but is closed to the caller answers
            `403` with an `error.code` instead — see `OrgSlug`), or the
            `team_id` does not belong to the caller's organization (or does
            not exist). Message: "team not found". The team→org check runs before
            the permission check, so a team outside the caller's org is reported
            as not-found (anti-enumeration — indistinguishable from a missing
            team, uniform across roles) rather than as a permission error. A
            `team_id` that belongs to the caller's org but on which the caller
            lacks rights returns `403` instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          description: |
            FK / scope validation failed. Possible messages:
            - "integration does not belong to the policy team" — a
              single-integration policy (`applies_to_all=false`) references an
              integration that exists in the org but belongs to a different team
              than the policy. A policy is always team-scoped, so its
              `integration_id` must belong to the policy's `team_id`; a target in
              a sibling team is rejected here (anti-enumeration — same message
              and status whether the integration is absent or merely in another
              team).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/orgs/{slug}/policies/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [integrations]
      summary: Get integration policy
      description: |
        Returns a single policy by ID.

        **Access (D3):** org_admin / org_owner for any policy; an org_member only
        for policies of their own teams (404 otherwise).
      operationId: getIntegrationPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntegrationPolicyId'
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationPolicyDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags: [integrations]
      summary: Update integration policy
      description: |
        Updates a policy. All fields are optional (PATCH semantics). The policy's
        scope (`team_id` / `applies_to_all` / `integration_id`) is **immutable**
        and cannot be changed via this endpoint.

        **Access:** org_admin, org_owner, or team_admin of the policy's team.
      operationId: updateIntegrationPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntegrationPolicyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationPolicyRequest'
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationPolicyDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

    delete:
      tags: [integrations]
      summary: Delete integration policy
      description: |
        Deletes a policy permanently.

        **Access:** org_admin, org_owner, or team_admin of the policy's team.
      operationId: deleteIntegrationPolicy
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IntegrationPolicyId'
      responses:
        '204':
          description: Policy deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Alert Ingestion (public, API key in path)
  # ---------------------------------------------------------------------------
  /api/v1/integrations/{apiKey}/alerts:
    post:
      tags: [alert-ingestion]
      summary: Receive AlertManager webhook
      description: |
        Accepts an AlertManager v4 webhook payload.

        Flat grouping: one AM batch collapses into exactly ONE alert, whatever
        the length of `alerts[]`. Deduplication runs on `group_key`, the
        sha256 of the sorted `groupLabels` — not on `fingerprint`, which is
        kept as a display-only field. A repeat batch with the same
        `group_key` updates the existing alert instead of creating a new one.

        `instance_count` on the resulting alert is the actual number of
        entries in `alerts[]`; a batch carrying no entries at all still counts
        as one instance. `instances_preview` holds up to the first 50 of them —
        fewer if the serialized preview would exceed its size budget, in which
        case trailing instances are dropped while `instance_count` keeps
        reporting the true batch size.

        There is no cap on `alerts[]` length; the only size limit is the
        1 MiB request body (see the 413 response).
      operationId: receiveAlertManagerAlerts
      security: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertManagerPayload'
      responses:
        '202':
          description: Alerts accepted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/IngestionOrganizationInactive'
        '404':
          description: Integration not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/integrations/{apiKey}/webhook:
    post:
      tags: [alert-ingestion]
      summary: Receive generic webhook
      description: Simple format for Zabbix, custom scripts, etc.
      operationId: receiveGenericWebhook
      security: []
      parameters:
        - $ref: '#/components/parameters/ApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericWebhookPayload'
      responses:
        '202':
          description: Alert accepted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/IngestionOrganizationInactive'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  # ---------------------------------------------------------------------------
  # Alerts
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/alerts:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [alerts]
      summary: List alerts
      description: >-
        Team-scoped (D3): org_admin / org_owner see all alerts in the
        organization; an org_member sees only alerts of their own teams. Alerts
        with no team assignment (legacy) are not visible to org_member.
      operationId: listAlerts
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AlertStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/AlertSeverity'
        - name: integration_id
          in: query
          schema:
            type: string
            format: uuid
        - name: team_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by integration's team
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs/{slug}/alerts/acknowledge:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [alerts]
      summary: Acknowledge several alerts at once
      description: |
        Acknowledges every alert of the list that can be acknowledged, in ONE
        request and ONE transaction. Intended for the mobile client, where N
        single acknowledgements mean N round trips over a cellular network
        while the escalation window is spent waiting.

        The call always answers `200` when the request itself is well-formed:
        per-alert outcomes are carried in the body, one entry per input id, in
        the order of the input ids. Rejection of the whole call is reserved for
        the request being malformed (`400`), the caller's role being
        unrecognised (`403`) and infrastructure failure (`5xx`).

        Partial success is by design: a list where half the alerts are already
        closed acknowledges the other half and explains the first. A database
        failure, by contrast, rolls the whole transaction back — no alert is
        acknowledged and the client may safely repeat the whole list.

        Repeating the list is safe as long as no other lifecycle operation
        intervened: a repeat over an already acknowledged alert is a success
        that changes nothing (no second journal entry, no cancellation of pages
        somebody has queued since). It is NOT idempotent in the strict sense —
        if another person unacknowledged the alert in between, the repeat
        acknowledges it again and cancels the pages that unacknowledgement had
        just queued.
      operationId: bulkAcknowledgeAlerts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAcknowledgeRequest'
      responses:
        '200':
          description: One outcome per input id, in input order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAcknowledgeResponse'
        '400':
          description: >
            Empty list, more than `maxItems` ids, duplicate ids, or a malformed
            body. The request is rejected WHOLE — nothing is acknowledged and
            the list is never silently truncated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/orgs/{slug}/alerts/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [alerts]
      summary: Get alert with escalation state
      operationId: getAlert
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Alert with escalation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs/{slug}/alerts/{id}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [alerts]
      summary: Acknowledge alert
      description: |
        Stops escalation. Records ack_step.
        org_member can only acknowledge alerts from their own teams.

        Acknowledging an ALREADY acknowledged alert is a success (api-117): it
        answers `200` with the current state, writes no second journal entry and
        runs no cancellation of pages queued since the first acknowledgement.
        A client with a poor connection must be able to retry without the retry
        looking like a failure. The response carries `acknowledged_by` and
        `acknowledged_at`, so the caller can tell its own acknowledgement from
        somebody else's.

        For several alerts at once use `POST /api/v1/orgs/{slug}/alerts/acknowledge`,
        which runs the same state transition over a list in one transaction.
      operationId: acknowledgeAlert
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: >
            Alert acknowledged, or already acknowledged (both answer with the
            current state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: >
            The alert is in a status that cannot be acknowledged — `resolved`,
            `dropped`, `silenced` or `delayed`. An already acknowledged alert
            answers `200`, not this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/alerts/{id}/unacknowledge:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [alerts]
      summary: Unacknowledge alert
      description: |
        Returns alert to firing. Escalation continues from next step (not restart).
        If ack was on last step, alert becomes exhausted.
        org_member can only modify alerts from their own teams.
      operationId: unacknowledgeAlert
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Alert unacknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: >
            Alert not in acknowledged state, or the alert has no escalation
            state to continue (nothing to resume — the alert stays acknowledged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/alerts/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [alerts]
      summary: Resolve alert manually
      description: |
        org_member can only modify alerts from their own teams.
      operationId: resolveAlert
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Alert already resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/alerts/{id}/escalate:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [alerts]
      summary: Manually escalate to next step
      description: |
        org_member can only modify alerts from their own teams.
      operationId: escalateAlert
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Escalated to next step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: |
            Alert cannot be escalated — it is resolved/dropped, the escalation is
            already exhausted, or there is no further step to page (single-step
            policy, or the last step was already paged: current_step >= total steps).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/alerts/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [alerts]
      summary: Add note to alert
      description: |
        org_member can only modify alerts from their own teams.
      operationId: addAlertNote
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNoteRequest'
      responses:
        '201':
          description: Note added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertLogDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Alert is terminal (resolved or dropped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/alerts/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [alerts]
      summary: Get alert audit log
      operationId: getAlertLogs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Alert logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertLogsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs/{slug}/alerts/{id}/notifications:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [alerts]
      summary: Get alert notification logs
      description: >-
        Returns all notification logs for a specific alert.
        Team-scoped (D3): org_admin / org_owner see any alert; an org_member
        sees the notification log only for alerts belonging to their own teams.
        A cross-team alert returns 404 (anti-enumeration), same as the alert
        itself and its audit log.
      operationId: getAlertNotifications
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Alert notification logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationLogsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Silences
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/silences:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [silences]
      summary: List silences
      description: >-
        Returns silences filtered by team_id, integration_id, and active status.
        Team-scoped (D3): org_admin / org_owner see all silences in the
        organization; an org_member sees only silences owned by their own
        teams.
      operationId: listSilences
      security:
        - BearerAuth: []
      parameters:
        - name: team_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to silences owned by this team.
        - name: integration_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to silences narrowed to this integration.
        - name: active_only
          in: query
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: List of silences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilenceListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [silences]
      summary: Create a silence
      description: |
        Creates a new silence or maintenance window owned by a team
        (`team_id`), optionally narrowed to a single integration
        (`integration_id`); omit `integration_id` to silence all integrations of
        the team, including future ones. When `integration_id` is set it must
        belong to `team_id` (otherwise 422). `team_id` must belong to the
        caller's organization (otherwise 404, anti-enumeration).

        Access control:
        - org_admin / org_owner OR team_admin / team_member of `team_id`.

        **Rate limit:** Per-organization bucket (cross-029,
        `IG_RATE_LIMIT_CREATE_SILENCE`, default 30/min). PATCH/DELETE/POST
        `/silences/{id}/replace` are not charged against this budget.
      operationId: createSilence
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSilenceRequest'
      responses:
        '201':
          description: Created silence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilenceDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: |
            Either no organization has this `{slug}` (the resolver runs first;
            an organization closed to the caller answers `403` with an
            `error.code` instead — see `OrgSlug`), or `team_id` does not exist
            in the caller's organization (anti-enumeration — same status
            whether the team is absent or in another org).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            FK / scope validation failed:
            - "integration does not belong to the silence team" — `integration_id`
              references an integration that exists in the org but belongs to a
              different team than `team_id`. A silence is team-scoped, so its
              `integration_id` must belong to its `team_id`; a target in a sibling
              team is rejected here (anti-enumeration — same message and status
              whether the integration is absent or merely in another team).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /api/v1/orgs/{slug}/silences/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [silences]
      summary: Get a silence
      description: Returns a single silence by ID. Accessible to any organization member.
      operationId: getSilence
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SilenceId'
      responses:
        '200':
          description: Silence details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilenceDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [silences]
      summary: Update a silence in place
      description: |
        Partial update of an in-place editable silence. Returns the updated silence (same id).

        Mutability matrix follows the Prometheus AlertManager `canUpdate` model:
        - Pending: `reason`, `ends_at`, `starts_at` (if >= now) editable in place.
        - Active: `reason`, `ends_at` (if >= now) editable in place.
        - Expired: nothing is editable — `400 use_replace` is returned.

        Attempting to mutate `matchers`, `team_id`, `integration_id`, `type`, or `starts_at` on an active silence
        returns `400 use_replace`. The frontend is expected to perform smart routing client-side; this contract
        acts as a backend failsafe.

        Access control matches creation/cancellation:
        - creator OR team_member/team_admin of the silence's team OR org_admin/org_owner.
      operationId: updateSilence
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SilenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSilenceRequest'
      responses:
        '200':
          description: Updated silence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilenceDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [silences]
      summary: Cancel a silence
      description: |
        Deletes (cancels) a silence. Same access control as creation:
        - creator OR team_member/team_admin of the silence's team OR org_admin/org_owner
      operationId: deleteSilence
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SilenceId'
      responses:
        '204':
          description: Silence cancelled
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/orgs/{slug}/silences/{id}/replace:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [silences]
      summary: Replace a silence (expire old, create new)
      description: |
        AlertManager-style "replace": atomically expires the silence at `{id}` (sets `ends_at = now`)
        and creates a new silence with `parent_silence_id` set to the old silence id. The transaction
        ensures that if the INSERT fails the old silence stays untouched.

        Use this endpoint to:
        - Change `matchers`, `team_id`, `integration_id`, or `type` of an existing silence.
        - Edit any field of an expired silence (the old expired silence remains in history).

        A silence that has **not started yet** (`starts_at` in the future) cannot be replaced:
        there is no running window to truncate, and expiring it would put `ends_at` behind
        `starts_at`. Such a request is rejected with `400`. Edit the pending silence in place
        with `PATCH /silences/{id}` (covers `reason`, `starts_at`, `ends_at`); for the fields
        that stay immutable in place — `matchers`, `team_id`, `integration_id`, `type` —
        delete the pending silence and create a new one. A pending silence has never
        suppressed anything, so nothing is lost from history.

        Returns the new silence object (with a new id). The client must update local state to use the new id.

        Access control matches creation/cancellation:
        - creator OR team_member/team_admin of the silence's team OR org_admin/org_owner.
      operationId: replaceSilence
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SilenceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSilenceRequest'
      responses:
        '201':
          description: New silence (with parent_silence_id set to the old silence id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilenceDataResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: |
            No organization has this `{slug}` (the resolver runs first; an
            organization closed to the caller answers `403` with an
            `error.code` instead — see `OrgSlug`), OR the silence at `{id}`
            does not exist, OR the replacement `team_id` does not exist in the
            caller's organization (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            FK / scope validation failed: the replacement `integration_id` does
            not belong to the replacement `team_id` (anti-enumeration — same
            status whether the integration is absent or merely in another team).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Notification Channels
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Per-tenant notification channels (cross-038). All paths sit under
  # /orgs/{slug}/me/ — channels + rules are independent per (user, org).
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/me/notification-channels:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      tags: [notification-channels]
      summary: List my notification channels in this org
      operationId: listMyNotificationChannels
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notification channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelsListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [notification-channels]
      summary: Add notification channel in this org
      description: |
        Creates a new notification channel scoped to (current user, {slug}).

        **Verification matrix by channel type:**
          * `email` / `telegram` — OTP-required + auto-sent on create. The 6-digit
            code is dispatched synchronously through the channel's sender; the
            channel is created `is_verified=false`, `verification_pending=true`.
          * `sip` (voice) — OTP-required + **manual trigger only** (api-039).
            The channel is created `is_verified=false`, `verification_pending=false`
            (no code stored yet). The user explicitly hits
            `POST .../{id}/send-verification` to trigger the voice call. The
            distinction `is_verified=false && verification_pending=false`
            indicates "needs verification but no code has been sent yet" — the
            UI surfaces a "Send verification code" button.
          * `mattermost` / `webhook` — auto-verified on create (no OTP).
          * `push` — **cannot be created through this endpoint** (api-099).
            Returns `422 {error.code:"channel_type_not_supported"}`. Push
            delivery does not exist yet, so a created channel would be stamped
            auto-verified and then fail permanently on every alert. `push`
            stays a legal `NotificationChannelType` — push channels are created
            by the dedicated managed endpoint
            `POST /orgs/{slug}/me/push-channel` (api-103), which fixes the
            target and keeps exactly one such channel per (user, org). Clients
            must not offer `push` in the channel-type picker.

        **Sip-specific validation (api-039 commit 6):**
          * `target` MUST match `^\+7\d{10}$` (E.164, RU-only on closed beta).
            Failures return `400 {error.code:"phone_invalid", error.details.reason:"format"}`.
          * Country allowlist enforces `+7` only (closed beta); other E.164
            country codes return `400 {error.code:"phone_invalid", details.reason:"country"}`.
          * Premium-rate prefix blacklist (`809`/`803`/`805` and similar)
            returns `400 {error.code:"phone_invalid", details.reason:"premium_prefix"}`.
          * Per-(user, org) `phone_channels_per_user` plan quota (Layer 1):
            returns `403 {error.code:"quota_exceeded", details.resource:"phone_channels", limit, used}`.
          * Per-user sliding-window cap (Layer 3, default 2 unique phones/hour)
            and per-IP sliding-window cap (Layer 4, default 5/hour) return
            `429 {error.code:"phone_rate_limited", details.scope, details.retry_after_seconds}`
            with the matching `Retry-After` header.

        **Rate limit:** Per-user bucket (cross-029,
        `IG_RATE_LIMIT_CREATE_CHANNEL`, default 10/min). PATCH/DELETE/verify/test
        on the channel collection do not consume this budget.
      operationId: createNotificationChannel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannelRequest'
      responses:
        '201':
          description: Channel created (check verification_pending and is_verified fields)
          headers:
            X-Quota-Limit-phone_channels:
              description: |
                Configured per-(user, org) phone_channels quota limit. Emitted
                only when the created channel is `sip` (cross-033 PR1). 0 means
                unlimited. Absent for non-sip channel types.
              required: false
              schema:
                type: integer
            X-Quota-Used-phone_channels:
              description: |
                Current per-(user, org) sip-channel count AFTER this create
                (includes the channel just created). Emitted only for `sip`
                channels (cross-033 PR1). Absent for non-sip channel types.
              required: false
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelDataResponse'
        '400':
          description: |
            Request validation failed. For sip-type creation the body may also
            carry the structured `PhoneInvalidError` shape with
            `error.code="phone_invalid"` and `error.details.reason ∈
            {format, country, premium_prefix}` — UIs key on `details.reason` to
            render the precise copy without parsing the human-readable message.
            Generic request validation failures (missing fields, bad enum value,
            etc.) use the legacy `ValidationErrorBody` shape with only
            `error.message`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PhoneInvalidError'
                  - $ref: '#/components/schemas/ValidationErrorBody'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            One of:
              * access to `{slug}` is gone — `code="organization_not_member"`
                or `code="organization_blocked"` (cross-089, possible on every
                route under `/api/v1/orgs/{slug}`). A plain RBAC denial inside
                an organization the caller IS in carries no `code` at all, and
                that absence is the difference;
              * Sip Layer 1 `phone_channels_per_user` plan cap reached —
                `code="quota_exceeded"` with `details.resource="phone_channels"`
                (api-039 commit 6);
              * Sip Layer 6 phone cooldown active —
                `code="phone_cooldown_active"` (cross-033 PR1): the phone was
                locked by a prior 3-wrong-codes verification trip and cannot be
                re-registered on a fresh channel until the 24h lock expires.
              * Sip creation on a plan without voice —
                `code="voice_not_in_plan"` (cross-056): the org's plan has
                `features.voice.enabled=false`, so a sip channel cannot be
                created (it could never be verified). Enabling voice requires a
                plan upgrade.
            UIs distinguish via `error.code`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuotaExceededError'
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/OrgAccessDeniedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ChannelDuplicate'
        '422':
          description: |
            The channel cannot be created. Body is one of:
              * `{code: "telegram_bot_not_configured"}` — a `telegram` channel
                was requested but the organization has not connected its own
                Telegram bot (cross-050). Members cannot receive Telegram
                notifications until an `org_admin` / `org_owner` connects a bot
                via `PUT /orgs/{slug}/telegram-bot`; the UI keys on the code to
                surface "ask an admin to connect the org Telegram bot".
              * `{code: "channel_type_not_supported"}` — the requested channel
                type cannot be created through this endpoint (api-099). Today
                that is only `push`: push delivery does not exist yet, so the
                channel would be created auto-verified and then fail
                permanently on every alert. It is not a permanent removal —
                `push` remains a legal `NotificationChannelType` and is created
                by the dedicated managed endpoint
                `POST /orgs/{slug}/me/push-channel` (api-103).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TelegramBotNotConfiguredError'
                  - $ref: '#/components/schemas/ChannelTypeNotSupportedError'
        '429':
          description: |
            Per-user `IG_RATE_LIMIT_CREATE_CHANNEL` bucket exhausted (cross-029)
            OR sip-specific Layer 3 (per-user) / Layer 4 (per-IP) sliding-window
            cap hit (api-039 commit 6). The latter case returns the structured
            `PhoneRateLimitedError` shape with `error.code="phone_rate_limited"`
            and `error.details.scope ∈ {user, ip}` + `details.retry_after_seconds`,
            allowing the UI to surface "wait N seconds before trying another phone"
            vs "another user on this network reached the limit". Both bodies
            carry the same `Retry-After` integer-seconds header.
          headers:
            Retry-After:
              description: Integer number of seconds the client must wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PhoneRateLimitedError'
                  - $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/me/notification-channels/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/NotificationChannelId'
    patch:
      tags: [notification-channels]
      summary: Update notification channel
      operationId: updateNotificationChannel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled:
                  type: boolean
      responses:
        '200':
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [notification-channels]
      summary: Delete notification channel
      operationId: deleteNotificationChannel
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Channel is used in notification rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/me/notification-channels/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/NotificationChannelId'
    post:
      tags: [notification-channels]
      summary: Verify notification channel
      description: |
        Submits a 6-digit verification code to verify ownership of the channel target.
        A verification code is automatically sent when the channel is created.
        Use the resend-verification endpoint to get a new code.

        Rate-limit / lockout: after 5 consecutive incorrect codes the channel is
        locked for 15 minutes. Further attempts during the lock window return 429
        with a Retry-After header indicating the seconds remaining. A successful
        verification resets the counter; ResendVerification does not.
      operationId: verifyNotificationChannel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyChannelRequest'
      responses:
        '200':
          description: Channel verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Channel is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Verification failed (invalid code, expired code, no pending verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Too many verification attempts. The channel is locked for 15 minutes after
            5 consecutive incorrect codes. Use the Retry-After header to determine when
            the next attempt will be accepted.
          headers:
            Retry-After:
              description: Seconds before the client should retry verification.
              schema:
                type: integer
                minimum: 1
                maximum: 900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/me/notification-channels/{id}/resend-verification:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/NotificationChannelId'
    post:
      tags: [notification-channels]
      summary: Resend channel verification code
      description: |
        Generates a new 6-digit verification code and sends it to the channel target.
        The previous code is invalidated. Code expires in 24 hours.
        Only applicable to channel types that require verification (email, telegram).

        A 60-second cooldown applies between consecutive sends (cross-041): if
        a code was just sent — including the auto-send that fires on channel
        create — the endpoint returns 429 `resend_too_soon` until 60s elapse.
      operationId: resendChannelVerification
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Verification code resent
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Channel is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Channel type does not require verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            60-second resend cooldown active — a code was just sent (including
            the auto-send on channel create). Body carries
            `{code: "resend_too_soon", details: {retry_after_seconds: 60}}`
            and the `Retry-After: 60` header.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendTooSoonError'

  /api/v1/orgs/{slug}/me/notification-channels/{id}/send-verification:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/NotificationChannelId'
    post:
      tags: [notification-channels]
      summary: Send verification code (sip / voice channel only)
      description: |
        Manually triggers the verification flow for a sip (voice) channel.
        api-039 commit 7. Unlike email/telegram which auto-send a code on
        CreateChannel, sip channels require an explicit "Send code" tap
        because a voice call is high-cost and high-friction.

        The endpoint runs (fail-fast):
          1. Defensive non-sip rejection (400 invalid channel type).
          2. 60s resend cooldown — second tap within 60s returns 429
             voice_resend_too_soon + Retry-After: 60.
          3. Layer 6 phone cooldown — phone in active 24h lock returns
             403 phone_cooldown_active.
          4. Layer 2 daily cap — 3 verifications/day/phone hard cap;
             4th attempt returns 403 phone_verify_limit_exceeded.
          5. Plan gate — voice.enabled=false on the plan returns 403
             voice_not_in_plan.
          6. Defensive E.164 re-check + premium-prefix re-check — a target
             that fails the format gate returns 400 phone_invalid
             (reason=format); a target whose premium-rate RU prefix
             (e.g. 809/803/805) is blacklisted returns 400 phone_invalid
             (reason=premium_prefix). This is the second half of the
             premium-prefix double-gate (the first runs at CreateChannel)
             — a number blacklisted AFTER registration is blocked here
             BEFORE any billable provider call.
          7. Provider call (МТС Exolve) — failure returns 502
             voice_provider_unavailable. No retry — billing per attempt.

        On success: 202 with `{data: {resend_after: 60}}`. The channel's
        verification_code_hash is set + last_verification_sent_at = NOW().
      operationId: sendNotificationChannelVerification
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Verification call placed; user should expect a phone call within seconds.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [resend_after]
                    properties:
                      resend_after:
                        type: integer
                        description: Seconds the client must wait before the next /send-verification call.
                        example: 60
        '400':
          description: |
            Phone re-validation failed (both gates also run at CreateChannel
            time). Body uses the `PhoneInvalidError` shape with:
              - `details.reason="format"` — defensive E.164 re-check failed.
              - `details.reason="premium_prefix"` — the target's premium-rate
                RU prefix is blacklisted (design § 3.2 double-gate; blocks a
                number blacklisted after registration before a billable call).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneInvalidError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Layer 2 / Layer 6 / plan-gate rejection, or loss of access to the
            organization. Body is one of:
              - `{code: "organization_not_member"}` / `{code:
                "organization_blocked"}` — the `{slug}` resolver refused
                (cross-089, possible on every route under
                `/api/v1/orgs/{slug}`).
              - `{code: "phone_verify_limit_exceeded"}` — 4th attempt of the
                day on this phone (Layer 2).
              - `{code: "phone_cooldown_active"}` — Layer 6 24h lock active
                after 3 consecutive wrong codes.
              - `{code: "voice_not_in_plan"}` — plan does not enable voice
                feature.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/OrgAccessDeniedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Channel already verified — verification flow is closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            60-second resend cooldown active. Body carries
            `{code: "voice_resend_too_soon", details: {retry_after_seconds: 60}}`
            and the `Retry-After: 60` header.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceResendTooSoonError'
        '502':
          description: |
            МТС Exolve provider unreachable / 5xx / timeout. NO retry — the
            user can retry via the same endpoint after the 60s cooldown.
            Body uses `{code: "voice_provider_unavailable"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orgs/{slug}/me/notification-channels/{id}/test:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/NotificationChannelId'
    post:
      tags: [notification-channels]
      summary: Test notification channel
      description: |
        Sends a test notification directly through the channel to verify it is
        working. Channels that require verification (email, telegram) must be
        verified first — testing an unverified target would let a user spam an
        address they do not own (cross-041).

        Sip (voice) channels do not support test notifications at all — test
        never places a voice call, regardless of channel state (verified or
        not). Voice delivery only happens through the dispatch pipeline with
        its abuse-defense preflight layers; a synchronous test call would
        bypass them.

        Push channels are refused here too, but for an unrelated reason and
        with somewhere else to go: a push channel has no single address — its
        address is the SET of the person's registered devices — so testing it
        is a fan-out that produces one outcome per device, which this
        endpoint's single `204` cannot express. That test lives at
        `POST /api/v1/orgs/{slug}/me/push-channel/test` (api-106) and answers
        `200` with a per-device result list. Both types still return 422
        `test_not_supported` here; clients must not offer the generic "send
        test" action for either, and must route the push one to the dedicated
        endpoint.
      operationId: testNotificationChannel
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Test notification sent successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: |
            Channel requires verification and is not verified yet. Body carries
            `{code: "channel_not_verified"}` — the user must complete the
            verification flow before testing (cross-041).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelNotVerifiedError'
        '422':
          description: |
            Channel cannot be tested. Body is one of:
              - plain message — channel is disabled, or no sender is configured
                for the channel type;
              - `{code: "test_not_supported"}` — the channel type does not
                support test notifications. Returned for any channel state
                (verified or not), because the type gate runs before the
                verification gate. Two types are excluded, for different
                reasons: **sip** — a test would place a real, billable voice
                call, and the synchronous test path bypasses the dispatch
                abuse-defense layers (cross-041); **push** — a push channel is
                delivered to every registered device of the person, so its
                test is a fan-out with a per-device outcome and cannot be
                reported through this endpoint's `204`/`502` pair (api-106).
                Push is not untestable: it has its own endpoint,
                `POST /api/v1/orgs/{slug}/me/push-channel/test`. The refusal
                here keeps its polarity — the type gate stays and this
                endpoint will never grow a push branch. Alert dispatch to a
                push channel is unaffected and stays visible in the alert's
                delivery history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            Downstream delivery failed (webhook 4xx/5xx, SMTP timeout, Telegram chat-not-found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Managed push channel (api-103).
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/me/push-channel:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [notification-channels]
      summary: Enable mobile push in this organization
      description: |
        Turns mobile push delivery on for the caller in `{slug}`: it ensures the
        person owns an enabled, verified `push` channel in this organization.
        That is the whole effect — the endpoint answers "where", never "what and
        when".

        **No notification rule is created (api-120).** Routing stays the
        person's own decision, exactly as for every other channel type: after
        enabling, add a rule with
        `PUT /orgs/{slug}/me/notification-rules`, or nothing will be delivered
        here. Until then `GET /api/v1/me/push-readiness` reports
        `channel_status: "missing_critical_rule"` for this organization, which
        immediately after enabling is the **expected** answer and not a fault.
        Clients must say so on the enabling screen and lead to the rule editor.

        The channel this endpoint manages has a **constant target** and there is
        at most one per (user, organization) — the address of a push
        notification is the set of the person's registered devices
        (`PUT /api/v1/me/mobile-installations/{id}`), not a string the user
        types. This is why the generic
        `POST /orgs/{slug}/me/notification-channels` refuses `type=push` with
        `422 channel_type_not_supported` (api-099): it accepts an arbitrary
        target and could not preserve the invariant.

        **Two axes, two actions.** Registering a device says "I have this
        phone"; this endpoint says "page me from THIS organization". Devices are
        global to the account, so enabling push here does not touch any other
        organization, and it applies to all of the person's devices at once.

        **Idempotent.** A repeat answers `200` with the same state; a channel
        that had been switched off comes back on. No request body.

        **A successful response means the channel exists and is deliverable** —
        it does not mean pages will arrive: that also takes a rule pointing at
        the channel and at least one ready device
        (`GET /api/v1/me/push-readiness` answers both).

        **The person's rules are never touched.** No rule is created, changed or
        removed by this call, and neither are their other channels — positions
        and delays included.

        **Turning it off again is the generic channel route**, the same as for
        every other type: `PATCH /orgs/{slug}/me/notification-channels/{id}`
        clears `is_enabled` and keeps the rules, `DELETE` of the same address
        refuses with `409` while any rule still points at the channel. The `id`
        comes from this response or from the channel list of the organization.

        **Quota:** consumes the shared `notification_channels_per_user` budget
        on the same terms as every other channel type. The budget is only
        consulted when the push channel does not exist yet — switching your own
        disabled channel back on cannot be refused for a slot you already hold.

        **Rate limit:** shares the per-user create-channel bucket
        (`IG_RATE_LIMIT_CREATE_CHANNEL`, default 10/min) with
        `POST /orgs/{slug}/me/notification-channels`.
      operationId: enablePushChannel
      security:
        - BearerAuth: []
      responses:
        '200':
          description: |
            Push is enabled. Returns the channel — always `200`, never `201`:
            the operation is idempotent, and a first call and a repeat describe
            the same post-condition.
          headers:
            X-Quota-Limit-notification_channels:
              description: |
                Configured per-(user, org) `notification_channels` quota limit.
                0 means unlimited (the header is then omitted).
              required: false
              schema:
                type: integer
            X-Quota-Used-notification_channels:
              description: |
                Channel count of this (user, org) AFTER the call, including the
                push channel. Informational — a concurrent change to the
                person's other channels can make it off by one.
              required: false
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelDataResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            One of:
              * access to `{slug}` is gone — `code="organization_not_member"`
                or `code="organization_blocked"` (cross-089, possible on every
                route under `/api/v1/orgs/{slug}`). This is the refusal
                `GET /api/v1/me/push-readiness` mirrors with
                `availability: "blocked"`;
              * the `notification_channels_per_user` quota is reached and the
                push channel does not exist yet — `code="quota_exceeded"` with
                `details.resource="notification_channels"`, `details.limit`,
                `details.used`. No `X-Quota-*` headers are emitted on this
                refusal; delete an unused channel and retry.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuotaExceededError'
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/OrgAccessDeniedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          description: |
            Per-user `IG_RATE_LIMIT_CREATE_CHANNEL` bucket exhausted — shared
            with the generic channel-create endpoint.
          headers:
            Retry-After:
              description: Integer number of seconds the client must wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [notification-channels]
      summary: Disable mobile push in this organization (deprecated)
      deprecated: true
      description: |
        **Deprecated (api-120) — use the generic channel routes instead:**
        `PATCH /orgs/{slug}/me/notification-channels/{id}` with
        `is_enabled: false` to switch push off while keeping the routing, and
        `DELETE /orgs/{slug}/me/notification-channels/{id}` to remove the
        channel (that one refuses with `409` while a rule still points at it).
        Push is an ordinary channel on both of those routes.

        Why: this endpoint **deletes the channel row**, and the rules pointing
        at it follow through the FK cascade. That was defensible while the rule
        had been created by the enable call itself; since api-120 the rules are
        the person's own work, so a gesture named "disable" would destroy
        configuration nobody asked it to touch.

        Behaviour is unchanged and stays as described below.

        Turns mobile push delivery off for the caller in `{slug}`: the push
        channel and the notification rules pointing at it are removed.

        Scoped to this organization only — the caller's devices stay registered
        and keep receiving pages from every other organization where push is
        enabled. Turning a device itself off is
        `DELETE /api/v1/me/mobile-installations/{id}`.

        **Idempotent:** `204` always, including when push was not enabled — the
        caller asked for a state, and that state holds either way. Re-enabling
        later is a fresh `POST` and consumes a quota slot again.

        Not rate-limited: turning delivery off is a safety operation and creates
        nothing.
      operationId: disablePushChannel
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Push is disabled (also returned when it was not enabled).
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # Test push (api-106). Own endpoint, because a push channel is addressed by a
  # SET of devices and answers with a per-device outcome.
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/me/push-channel/test:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      tags: [notification-channels]
      summary: Send a test push to the caller's devices
      description: |
        Sends a test push notification straight through the caller's push
        channel in `{slug}` and reports what the transport said **for each
        device separately** (api-106).

        **The success code is not a success (api-117).** `200` means the
        request was well-formed and the fan-out ran; whether any phone was
        reached is in `results`, one entry per device. The client MUST read the
        outcomes element by element, and MUST render an unrecognised `outcome`
        value as its raw text instead of swallowing it — a client that folds
        the unknown into "ok" reports a working pager that is not there.

        **What the button may promise.** This call and its result say
        "delivery to this phone works", NEVER "you will receive pages". The
        test goes into the channel directly and skips the routing rules
        entirely, so the existence of a notification rule is NOT part of the
        condition — and the three-way `channel_status` of
        `GET /api/v1/me/push-readiness` therefore cannot be the gate either:
        its `ready` value includes the presence of a `critical` rule, which by
        design does not exist right after the channel is enabled (api-120). A
        test bound to that status would refuse on the very onboarding step it
        exists to serve.

        **Why a dedicated endpoint.** The generic
        `POST /orgs/{slug}/me/notification-channels/{id}/test` does not serve
        push and never will: it has one address and answers `204`, whereas a
        push channel is addressed by the set of the person's devices and
        answers with a per-device outcome.

        **Nothing is written to the alert delivery history.** This send belongs
        to no alert, and rows without one would pollute the history operators
        read while reconstructing an incident.

        **Scope of the fan-out.** No body at all, an empty object, and an
        explicit `installation_id: null` mean the same thing: send to every
        ready device of the caller. With `installation_id` the test goes to
        that one device — the mobile client tests the handset it is running on,
        and "some phone was reached" does not answer the question that person
        asked.
      operationId: sendPushChannelTest
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushChannelTestRequest'
      responses:
        '200':
          description: |
            The fan-out ran. `results` carries one entry per device the test
            was sent to and is never empty — an empty target set is refused
            with `422`, so "nothing happened" can never arrive dressed as a
            success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushChannelTestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: |
            There is nothing to send the test to. Body is one of:
              * `{code: "push_channel_not_ready"}` — push is not enabled in
                this organization, or the channel is disabled, or it is not
                verified. The message names which of the three it is; the code
                does not, because all three lead the person to the same
                screen;
              * `{code: "push_no_ready_device"}` — the caller has no ready
                device: none is registered, or none holds a live delivery
                address, or none reports the notification permission as
                granted.

            The second code is ALSO the answer when a specific
            `installation_id` was named and that device is not ready, does not
            exist, or belongs to somebody else. Those three are deliberately
            indistinguishable: telling them apart would turn this endpoint into
            an oracle for other people's device identifiers, and the action
            asked of the person is the same in every case — open the app on the
            phone in question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushChannelTestNotReadyError'
        '429':
          description: |
            Rate limit for this endpoint exhausted; `Retry-After` says for how
            long. This endpoint is limited although the generic channel test is
            not, and the difference is not caution: one press here fans out
            across every ready device and spends the platform's SHARED
            push-provider budget — the same budget real pages go out of. Left
            unlimited, one person tapping "test" degrades delivery for every
            tenant.
          headers:
            Retry-After:
              description: Integer number of seconds the client must wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            The platform cannot use its push transport. A state of the platform,
            not a property of the tenant or of any single device, so it fails
            the whole call instead of arriving as a per-device outcome — the
            same shape an unconfigured SMTP sender uses.

            `{code: "push_provider_not_configured"}` — no credentials stored at
            all; `{code: "push_provider_credentials_rejected"}` — credentials
            are stored and the transport refused them. Two codes because they
            are two different jobs for whoever reads the answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushProviderNotConfiguredError'

  # ---------------------------------------------------------------------------
  # Push readiness (api-103). Account-scoped, on purpose: the answer spans every
  # organization the caller belongs to, so there is no "current" one to name.
  # ---------------------------------------------------------------------------
  /api/v1/me/push-readiness:
    get:
      tags: [notification-channels]
      summary: Push readiness of the caller — devices and per-organization channel state
      description: |
        Answers "will a page actually reach me" on both axes at once, so a
        client can build a checklist without guessing which half is missing.

        **Devices — one number for the whole account.** `ready_installations`
        counts the caller's devices that are registered, still hold a delivery
        address, AND report the notification permission as `authorized`. It is
        not repeated per organization because it cannot differ between them:
        devices belong to the person, not to an organization. iOS
        `provisional` permission does **not** count as ready — such
        notifications are delivered silently, with no sound and no banner, so a
        person relying on one would not be woken.

        This is deliberately stricter than the device limit of
        `PUT /api/v1/me/mobile-installations/{id}`, which counts devices that
        can be paged regardless of the reported permission. A device can
        therefore occupy a place and still not be ready — that is the state
        this endpoint exists to surface.

        **Channel — one state per organization.** `channel_status` is:
          * `off` — push is not enabled here, or the channel exists but would
            not be used for delivery. Enable it with
            `POST /api/v1/orgs/{slug}/me/push-channel`;
          * `missing_critical_rule` — the channel is deliverable, but no
            `critical` rule routes to it, so nothing will be sent. The name is
            literal: a `warning` rule may well exist. **This is the expected
            answer right after enabling** (api-120) — the channel answers
            "where", the rule answers "what and when", and the rule is the
            person's own. Fix it with
            `PUT /api/v1/orgs/{slug}/me/notification-rules`; repeating the
            enable call does nothing here;
          * `ready` — everything the server controls is in place.

        `availability` reports whether the organization can be acted on at all:
        a `blocked` organization is **listed, not hidden** — hiding it would
        leave the person wondering where their organization went — but its
        push-channel calls will be refused with `403` until the block is
        lifted. Its `channel_status` is still reported, so nothing changes when
        the block is lifted.

        **Both axes are independent.** `channel_status: "ready"` with
        `ready_installations: 0` is a perfectly normal answer and means the
        organization is configured but no phone will ring.

        Organizations are ordered by name — the same order as
        `GET /api/v1/me/organizations` — and the list is `[]` for an account
        that belongs to none. That is an ordinary state, not an edge case: an
        account is global, and leaving an organization does not unregister any
        device.

        The endpoint takes no parameters: the caller comes from the access
        token and the organizations from that caller's own memberships. There
        is no way to ask about anybody else's account or about an organization
        one does not belong to.
      operationId: getPushReadiness
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Readiness of the caller's devices and of each of their organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushReadinessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ---------------------------------------------------------------------------
  # Per-tenant notification rules (cross-038).
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{slug}/me/notification-rules:
    parameters:
